<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Math practice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f3f7ff; --card: #ffffff; --ink: #1d2433; --muted: #5b6475;
    --accent: #3867ff; --accent-dark: #2447c7; --good: #1f9d55; --warn: #d97706; --line: #d6def0;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 20px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body.tool-open { overflow: hidden; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 14px 200px; }
  header.top { background: linear-gradient(135deg, #3867ff, #7b5cff); color: #fff; border-radius: 22px;
    padding: 20px 20px 18px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(56,103,255,.25); }
  header.top h1 { margin: 0 0 4px; font-size: 1.5em; line-height: 1.2; }
  header.top .date { font-size: 1.05em; opacity: .95; }
  header.top .instructions { margin-top: 10px; font-size: .95em; background: rgba(255,255,255,.15);
    border-radius: 12px; padding: 10px 12px; }
  .card { background: var(--card); border-radius: 20px; padding: 18px 18px 8px; margin: 0 0 16px;
    box-shadow: 0 2px 8px rgba(29,36,51,.06); border: 1px solid var(--line); }
  .stamp { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .stamp label { font-weight: 600; font-size: .9em; color: var(--muted); display: block; margin-bottom: 4px; }
  .qhead { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .qnum { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.15em; }
  .qtitle { font-weight: 800; font-size: 1.1em; line-height: 1.25; }
  .qprompt { margin: 6px 0 10px; }
  .part { border-top: 2px dashed var(--line); padding: 14px 0 12px; }
  .part:first-of-type { border-top: none; }
  .plabel { display: inline-block; min-width: 38px; padding: 2px 10px; margin-right: 6px; border-radius: 10px;
    background: #e8eeff; color: var(--accent-dark); font-weight: 800; text-align: center; }
  .pprompt { font-weight: 600; }
  .field { margin-top: 10px; }
  .field > label { display: block; font-weight: 600; color: var(--muted); font-size: .92em; margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .suffix { color: var(--muted); white-space: nowrap; }
  input[type=text], textarea { width: 100%; font: inherit; font-size: 1.05em; color: var(--ink); padding: 12px 14px;
    border: 2px solid #b9c6e6; border-radius: 14px; background: #fbfcff; outline: none; }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(56,103,255,.15); }
  textarea { min-height: 110px; resize: vertical; }
  .filled input[type=text], .filled textarea { border-color: #8fd3ab; }
  .choices { display: flex; gap: 10px; flex-wrap: wrap; }
  .choices button { font: inherit; font-weight: 700; padding: 12px 20px; border-radius: 14px; border: 2px solid #b9c6e6;
    background: #fff; color: var(--ink); cursor: pointer; min-width: 130px; }
  .choices button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .paper { background: #fff8e6; border: 2px solid #f6d58a; border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
  .paper .big { font-weight: 800; }
  .paper-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .photo-btn { display: inline-block; margin-top: 10px; font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 12px;
    background: #fff; border: 2px solid #f0c052; cursor: pointer; color: var(--ink); min-height: 48px; }
  .paper-btns .photo-btn { margin-top: 0; }
  .photo-btn.graph { border-color: var(--accent); color: var(--accent-dark); }
  .photo-btn input { display: none; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .thumb { position: relative; }
  .thumb img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 2px solid #f0c052; }
  .thumb button { position: absolute; top: -8px; right: -8px; width: 30px; height: 30px; border-radius: 50%; border: none;
    background: #d33; color: #fff; font-weight: 800; cursor: pointer; }
  .graph-att { margin-top: 10px; }
  .graph-att:empty { display: none; }
  .graph-att .att-head { font-weight: 800; color: #145c33; }
  .graph-att img { display: block; width: 100%; max-width: 360px; border-radius: 12px; border: 3px solid #8fd3ab; background: #fff; margin: 6px 0; }
  .graph-att .att-desc { white-space: pre-wrap; font-size: .8em; line-height: 1.4; background: #fff; border-radius: 10px;
    padding: 8px 10px; margin: 6px 0; border: 1px solid #f0dca6; overflow-wrap: anywhere; }
  table.vals { border-collapse: collapse; margin: 8px 0 12px; font-variant-numeric: tabular-nums; }
  table.vals th, table.vals td { border: 2px solid var(--line); padding: 6px 16px; text-align: center; }
  table.vals th { background: #eef2ff; }
  .info { color: var(--muted); font-style: italic; margin-top: 6px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.97); border-top: 1px solid var(--line);
    padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(29,36,51,.08); z-index: 5; }
  .bar-inner { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .tools { display: flex; gap: 8px; width: 100%; }
  .tool-btn { flex: 1 1 0; font: inherit; font-weight: 800; font-size: .92em; min-height: 46px; padding: 6px 10px; border-radius: 14px;
    border: 2px solid #c5d3fb; background: #eef2ff; color: var(--accent-dark); cursor: pointer; white-space: nowrap; touch-action: manipulation; }
  .tool-btn:active { background: #dbe4ff; }
  .progress { flex: 1; min-width: 0; }
  .progress .txt { font-size: .85em; color: var(--muted); font-weight: 600; }
  .progress .track { height: 12px; background: #e3e8f5; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .progress .fill { height: 100%; width: 0; background: linear-gradient(90deg, #34c77b, #1f9d55); transition: width .3s; }
  .btn { font: inherit; font-weight: 800; font-size: 1.05em; padding: 14px 26px; border-radius: 16px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(56,103,255,.3); touch-action: manipulation; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.secondary { background: #fff; color: var(--accent-dark); border: 2px solid var(--accent); box-shadow: none; }
  .btn.good { background: var(--good); box-shadow: 0 4px 12px rgba(31,157,85,.3); }
  .overlay { position: fixed; inset: 0; background: rgba(20,26,40,.55); display: none; align-items: center; justify-content: center;
    padding: 18px; z-index: 30; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 24px; padding: 26px 22px; max-width: 460px; width: 100%; text-align: center; }
  .modal h2 { margin: 0 0 8px; font-size: 1.6em; }
  .modal .emoji { font-size: 3.2em; line-height: 1; margin-bottom: 8px; }
  .modal .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .sent-banner { display: none; background: #e7f8ee; border: 2px solid #8fd3ab; color: #145c33; border-radius: 16px;
    padding: 12px 14px; margin-bottom: 16px; font-weight: 700; }
  .sent-banner.show { display: block; }
  .error { background: #fff1f0; border: 2px solid #f5b5ae; color: #8a1c12; }
  .other-days { font-size: .9em; color: var(--muted); }
  .other-days select { font: inherit; font-size: 1em; padding: 6px 8px; border-radius: 10px; }
  .muted { color: var(--muted); }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 6px rgba(31,157,85,.45); border-color: var(--good); } 100% { box-shadow: none; } }

  /* ---------- tool popups (graph + calculator) ---------- */
  .tool-overlay { position: fixed; inset: 0; z-index: 20; background: rgba(20,26,40,.55); display: flex;
    align-items: center; justify-content: center; }
  .tool-overlay[hidden] { display: none; }
  .toolbox { background: #fff; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .toolhead { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 12px;
    border-bottom: 1px solid var(--line); background: #f7f9ff; }
  .tabs { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .tab { flex: 1 1 0; position: relative; min-width: 0; }
  .tab input { position: absolute; opacity: 0; pointer-events: none; }
  .tab span { display: flex; align-items: center; justify-content: center; min-height: 50px; padding: 4px 6px; border-radius: 14px;
    border: 2px solid #b9c6e6; background: #fff; font-weight: 800; font-size: .88em; cursor: pointer; white-space: nowrap;
    touch-action: manipulation; overflow: hidden; }
  .tab input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab input:focus-visible + span { outline: 3px solid rgba(56,103,255,.45); outline-offset: 2px; }
  .close-x { flex: 0 0 auto; min-width: 54px; min-height: 54px; padding: 0 14px; border-radius: 14px; border: none; background: #1d2433;
    color: #fff; font: inherit; font-weight: 800; font-size: 1.05em; cursor: pointer; touch-action: manipulation; }
  .close-x .wide-only { display: none; }
  .toolbody { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; overscroll-behavior: contain; }
  .toolfoot { flex: 0 0 auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #f7fff9; }
  .toolfoot .btn { width: 100%; }
  .toolfoot .muted { font-size: .8em; text-align: center; margin-top: 4px; }
  .gtarget { background: #fff8e6; border: 2px solid #f6d58a; border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; font-size: .9em; }
  .glayout { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .canvas-wrap { position: relative; width: 100%; }
  .canvas-wrap canvas { display: block; width: 100%; border-radius: 12px; border: 2px solid var(--line); touch-action: manipulation; cursor: crosshair; background: #fff; }
  .gbelow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 40px; margin-top: 6px; }
  .gbelow .hint { margin-top: 0; }
  .coord { background: #1d2433; color: #fff; font-weight: 800; padding: 4px 14px; border-radius: 99px; font-size: 1em; }
  .coord[hidden] { display: none; }
  .hint { color: var(--muted); font-size: .8em; margin-top: 4px; }
  .gsec { background: #f7f9ff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; margin-bottom: 12px; }
  .gsec-title { display: block; font-weight: 800; margin-bottom: 6px; }
  .axrow { display: grid; grid-template-columns: 20px auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: center;
    gap: 5px; margin: 6px 0; }
  .axrow b { font-size: 1.1em; font-style: italic; }
  .axrow span { color: var(--muted); font-size: .8em; }
  .axrow input[type=text] { padding: 8px 4px; text-align: center; font-size: 18px; border-radius: 12px; min-width: 0; }
  input[type=text].bad { border-color: #e5484d; background: #fff5f5; }
  .gmsg { border-radius: 12px; padding: 8px 12px; margin: 8px 0; font-size: .88em; font-weight: 600; background: #e7f8ee; color: #145c33; }
  .gmsg.bad { background: #fff1f0; color: #8a1c12; border: 2px solid #f5b5ae; }
  .gmsg[hidden] { display: none; }
  .gbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip-btn { font: inherit; font-size: .85em; font-weight: 700; min-height: 44px; padding: 6px 12px; border-radius: 12px; border: 2px solid #b9c6e6;
    background: #fff; color: var(--ink); cursor: pointer; touch-action: manipulation; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .keys button { font: inherit; font-weight: 800; min-width: 44px; min-height: 44px; border-radius: 12px; border: 2px solid #c5d3fb;
    background: #eef2ff; color: var(--accent-dark); cursor: pointer; touch-action: manipulation; }
  #gLabel { margin-top: 2px; font-size: 1em; }
  .add-btn { width: 100%; margin-top: 10px; }
  .glist { list-style: none; margin: 10px 0 4px; padding: 0; }
  .glist li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .glist li:first-child { border-top: none; }
  .glist li.empty { color: var(--muted); font-size: .88em; }
  .swatch { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; }
  .glist .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
  .glist .txt b { font-weight: 800; }
  .glist .txt small { display: block; color: var(--muted); font-size: .8em; }
  .glist .rm { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 12px; border: 2px solid #f5c2bc; background: #fff1f0; color: #b42318;
    font: inherit; font-weight: 800; cursor: pointer; touch-action: manipulation; }
  .linkish { font: inherit; font-size: .85em; background: none; border: none; color: #b42318; text-decoration: underline; cursor: pointer; padding: 8px 0; }
  .calc { max-width: 480px; margin: 0 auto; }
  .cdisplay { background: #1d2433; color: #fff; border-radius: 18px; padding: 10px 16px 12px; text-align: right; min-height: 118px; }
  .cexpr { font-size: 1.1em; opacity: .85; overflow-wrap: anywhere; min-height: 1.5em; }
  .cres { font-size: 2.2em; font-weight: 800; overflow-wrap: anywhere; line-height: 1.2; }
  .cres.preview { opacity: .55; font-size: 1.5em; }
  .cres.err { color: #ffb4a8; font-size: 1em; font-weight: 700; padding-top: 6px; }
  .cfrac { font-size: 1em; opacity: .85; min-height: 1.2em; }
  .ckeys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 8px; margin-top: 12px; }
  .ckeys button { min-height: 56px; font: inherit; font-size: 1.25em; font-weight: 700; border-radius: 14px; border: 2px solid #d6def0;
    background: #fff; color: var(--ink); cursor: pointer; padding: 0; touch-action: manipulation; }
  .ckeys button:active, .ckeys button.hit { transform: scale(.96); filter: brightness(.93); }
  .ckeys .d { background: #f3f6fd; }
  .ckeys .op { background: #e8eeff; color: var(--accent-dark); border-color: #c5d3fb; font-size: 1.6em; }
  .ckeys .fn { background: #fff1f0; color: #b42318; border-color: #f5c2bc; }
  .ckeys .eq { background: var(--accent); color: #fff; border-color: var(--accent); grid-row: span 2; font-size: 1.6em; }
  .ckeys .wide { grid-column: span 2; }
  .ckeys .small { font-size: 1em; }
  .cactions { display: flex; gap: 10px; margin-top: 12px; }
  .cactions .btn { flex: 1 1 0; padding: 12px 10px; font-size: .95em; }
  .cactions .btn:disabled { cursor: not-allowed; opacity: .45; }
  @media (min-width: 640px) {
    main { padding-bottom: 140px; }
    .bar-inner { flex-wrap: nowrap; }
    .tools { width: auto; flex: 0 0 auto; }
    .tool-btn { flex: 0 0 auto; }
  }
  @media (min-width: 760px) {
    .tool-overlay { padding: 20px; }
    .toolbox { max-width: 1000px; height: auto; max-height: calc(100vh - 40px); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    .close-x .wide-only { display: inline; }
    .toolbody { padding: 18px; }
    .glayout { grid-template-columns: minmax(0, 1.3fr) minmax(300px, 1fr); align-items: start; }
    .tab span { font-size: .95em; }
  }
  @media (max-width: 480px) {
    body { font-size: 19px; }
    .stamp { grid-template-columns: 1fr; }
    .btn { padding: 14px 18px; }
  }
  /* ---------- Rio's home screen ---------- */
  body.is-home main { padding-bottom: 28px; }
  .home h1 { margin: 2px 0 0; font-size: 1.7em; line-height: 1.15; }
  .home-date { margin: 2px 0 12px; color: var(--muted); font-weight: 700; }
  .home-today { display: block; width: 100%; text-align: left; border: none; border-radius: 22px; padding: 16px 16px 14px;
    color: #fff; cursor: pointer; touch-action: manipulation; background: linear-gradient(135deg, #3867ff, #7b5cff);
    box-shadow: 0 8px 20px rgba(56,103,255,.28); }
  .home-today:disabled { opacity: .65; cursor: default; }
  .home-today .k { font-size: .75em; font-weight: 800; letter-spacing: .06em; opacity: .92; }
  .home-today .t { font-size: 1.55em; font-weight: 900; line-height: 1.1; margin: 2px 0 4px; }
  .home-today .s { font-size: .88em; font-weight: 700; line-height: 1.3; }
  .home-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .home-tile { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-height: 88px; }
  .home-tile .k { font-size: .72em; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .home-tile .v { font-size: 1.35em; font-weight: 900; line-height: 1.15; margin-top: 2px; }
  .home-tile .s { font-size: .75em; color: var(--muted); margin-top: 2px; }
  .home-tile.good { background: #effaf3; border-color: #b7e4c7; }
  .home-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 14px 12px 12px; margin: 0 0 14px;
    box-shadow: 0 2px 8px rgba(29,36,51,.05); }
  .home-card h2 { margin: 0 0 10px; font-size: 1.15em; }
  .home-card h3 { margin: 0 0 6px; font-size: .95em; }
  .home-cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .home-cal-head h2 { flex: 1; text-align: center; margin: 0; font-size: 1.1em; }
  .home-nav { width: 44px; height: 44px; border-radius: 12px; border: 2px solid #c5d3fb; background: #fff; font: inherit;
    font-size: 1.4em; font-weight: 800; color: var(--accent-dark); cursor: pointer; touch-action: manipulation; }
  .home-nav:disabled { opacity: .35; cursor: default; }
  .home-cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .home-dow { text-align: center; font-size: .68em; font-weight: 800; color: var(--muted); padding-bottom: 2px; }
  .home-day { min-height: 52px; border-radius: 12px; border: 1px solid transparent; background: #f4f7ff; display: flex;
    flex-direction: column; align-items: center; justify-content: center; font: inherit; font-weight: 800; color: var(--ink);
    padding: 2px 0 3px; line-height: 1.05; }
  button.home-day { cursor: pointer; touch-action: manipulation; }
  .home-day.empty { background: transparent; border-color: transparent; }
  .home-day .dn { font-size: .78em; }
  .home-day .ds { font-size: .62em; font-weight: 800; }
  .home-day.st-none { background: transparent; color: #b0b8c9; font-weight: 700; }
  .home-day.st-graded { color: #fff; }
  .home-day.st-awaiting { background: #fff4d6; color: #8a5a00; border-color: #f0d48a; }
  .home-day.st-missed { background: #eef0f4; color: #8b93a3; border-color: #e1e5ee; }
  .home-day.st-assigned { background: #e8eeff; color: var(--accent-dark); border-color: #3867ff; }
  .home-day.st-upcoming { background: #f3f0ff; color: #5b4b8a; border-color: #ddd4f7; }
  .home-day.is-today { box-shadow: 0 0 0 2px #1d2433; }
  .home-legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 10px; font-size: .72em; color: var(--muted); font-weight: 700; }
  .home-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .home-legend .sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .home-legend .graded { background: #2f6fed; }
  .home-legend .sent { background: #f0d48a; }
  .home-legend .miss { background: #d5dbe6; }
  .home-legend .go { background: #e8eeff; box-shadow: inset 0 0 0 2px #3867ff; }
  .home-legend .soon { background: #ddd4f7; }
  .home-skill-group { margin-top: 12px; }
  .home-skill-list { list-style: none; margin: 0; padding: 0; }
  .home-skill-list li { padding: 8px 0; border-top: 1px solid var(--line); }
  .home-skill-top { display: flex; justify-content: space-between; gap: 8px; }
  .home-track { height: 10px; background: #e3e8f5; border-radius: 99px; overflow: hidden; margin: 4px 0; }
  .home-fill { height: 100%; border-radius: 99px; }
  .home-skill-list small { color: var(--muted); font-size: .75em; }
  .home-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .home-chip { font: inherit; font-weight: 800; font-size: .8em; min-height: 44px; padding: 6px 12px; border-radius: 999px;
    border: 2px solid #c5d3fb; background: #fff; color: var(--ink); cursor: pointer; touch-action: manipulation; }
  .home-chip[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }

  var RIO_API_URL = "https://script.google.com/macros/s/AKfycbwsufZ6Nh4q3j03LZHJXVIo0did9KHo8RUI-QhP5EVnQGPVDXji1ZW3xWzcHAA7B1WZ/exec";

  /* No cookies ever go to Google: credentials 'omit', no referrer. GET for the test; POST with a text/plain

     script.googleusercontent.com, which fetch follows; both send Access-Control-Allow-Origin: *. */

<script>
/* ==== RIO-MATH-CORE START (pure functions, no DOM; unit-tested by dev/unit-test.js) ==== */
var RioMath = (function () {
  'use strict';
  function MathError(msg) { var e = new Error(msg); e.friendly = true; return e; }

  /** Turns the fancy characters phones and the calculator use into plain ones. */
  function normalize(s) {
    return String(s == null ? '' : s)
      .replace(/[\u2212\u2012\u2013\u2014\uFE63\uFF0D]/g, '-')
      .replace(/[\u00D7\u22C5\u00B7\u2219\u2217]/g, '*')
      .replace(/[\u00F7\u2215\u2044]/g, '/')
      .replace(/[\uFF08\[{]/g, '(').replace(/[\uFF09\]}]/g, ')')
      .replace(/\uFF1D/g, '=').replace(/\uFF0C/g, ',')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function tokenize(src) {
    var s = normalize(src), toks = [], i = 0, m;
    while (i < s.length) {
      var ch = s.charAt(i);
      if (ch === ' ') { i++; continue; }
      if (/[0-9.]/.test(ch)) {
        m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
        if (!m) throw MathError('A "." needs a number next to it.');
        if (s.charAt(i + m[0].length) === '.') throw MathError('One number has two decimal points.');
        toks.push({ t: 'num', v: parseFloat(m[0]) }); i += m[0].length; continue;
      }
      if (ch === '\u03C0') { toks.push({ t: 'num', v: Math.PI, pi: true }); i++; continue; }
      if (/[a-zA-Z]/.test(ch)) {
        var rest = s.slice(i).toLowerCase();
        if (rest.slice(0, 4) === 'sqrt') { toks.push({ t: 'sqrt' }); i += 4; continue; }
        if (rest.slice(0, 2) === 'pi') { toks.push({ t: 'num', v: Math.PI, pi: true }); i += 2; continue; }
        toks.push({ t: 'var', n: ch.toLowerCase() }); i++; continue;
      }
      if (ch === '\u221A') { toks.push({ t: 'sqrt' }); i++; continue; }
      if (ch === '\u00B2' || ch === '\u00B3') { toks.push({ t: 'sq', p: ch === '\u00B2' ? 2 : 3 }); i++; continue; }
      if ('+-*/^()'.indexOf(ch) >= 0) { toks.push({ t: 'op', v: ch }); i++; continue; }
      throw MathError('I don\'t understand "' + ch + '".');
    }
    return toks;
  }

  /**
   * Safe recursive-descent parser (no eval, no Function constructor).
   * Precedence: + -  <  * / and implicit multiplication (left to right, so 1/2x = (1/2)x)  <  unary -  <  ^ (right assoc)  <  ² ³
   * opts.autoClose: missing ")" at the very end are OK (calculator style).
   */
  function parse(src, opts) {
    opts = opts || {};
    var toks = tokenize(src), pos = 0;
    if (!toks.length) throw MathError('Type something first.');
    function peek() { return toks[pos]; }
    function isOp(t, v) { return !!t && t.t === 'op' && t.v === v; }
    function startsPrimary(t) { return !!t && (t.t === 'num' || t.t === 'var' || t.t === 'sqrt' || isOp(t, '(')); }
    function parseExpr() {
      var node = parseTerm();
      while (isOp(peek(), '+') || isOp(peek(), '-')) {
        var op = toks[pos++].v;
        node = { t: op === '+' ? 'add' : 'sub', a: node, b: parseTerm() };
      }
      return node;
    }
    function parseTerm() {
      var node = parseUnary();
      for (;;) {
        var t = peek();
        if (isOp(t, '*') || isOp(t, '/')) { pos++; node = { t: t.v === '*' ? 'mul' : 'div', a: node, b: parseUnary() }; }
        else if (startsPrimary(t)) node = { t: 'mul', a: node, b: parsePower(), implicit: true };
        else return node;
      }
    }
    function parseUnary() {
      var t = peek();
      if (isOp(t, '-')) { pos++; return { t: 'neg', a: parseUnary() }; }
      if (isOp(t, '+')) { pos++; return parseUnary(); }
      return parsePower();
    }
    function parsePower() {
      var base = parsePostfix();
      if (isOp(peek(), '^')) { pos++; return { t: 'pow', a: base, b: parseUnary() }; }
      return base;
    }
    function parsePostfix() {
      var node = parsePrimary();
      while (peek() && peek().t === 'sq') node = { t: 'pow', a: node, b: { t: 'num', v: toks[pos++].p } };
      return node;
    }

      var t = toks[pos];
      if (!t) throw MathError('Something is missing at the end.');
      if (t.t === 'num') { pos++; return { t: 'num', v: t.v }; }
      if (t.t === 'var') { pos++; return { t: 'var', n: t.n }; }
      if (t.t === 'sqrt') { pos++; return { t: 'sqrt', a: isOp(peek(), '-') ? parseUnary() : parsePower() }; }
      if (isOp(t, '(')) {
        pos++;
        if (isOp(peek(), ')')) throw MathError('There is nothing inside the ( ).');
        var inner = parseExpr();
        if (isOp(peek(), ')')) pos++;
        else if (!peek() && opts.autoClose) { /* fine: closed automatically */ }
        else if (!peek()) throw MathError('A "(" is missing its ")".');
        else throw MathError('Check your parentheses.');
        return inner;
      }
      if (isOp(t, ')')) throw MathError('There is an extra ")" or something missing before it.');
      if (t.t === 'sq') throw MathError('Put a number before the \u00B2.');
      throw MathError('Something is missing before "' + t.v + '".');
    }
    var ast = parseExpr();
    if (pos < toks.length) {
      if (isOp(toks[pos], ')')) throw MathError('There is an extra ")".');
      throw MathError('Check that part again.');

  }

  function collectVars(node, out) {
    out = out || [];
    if (!node) return out;
    if (node.t === 'var') { if (out.indexOf(node.n) < 0) out.push(node.n); return out; }
    collectVars(node.a, out); collectVars(node.b, out);

    if (!node) return node;
    if (node.t === 'var') return { t: 'var', n: map[node.n] || node.n };

      case 'div':
        a = evaluate(node.a, env); b = evaluate(node.b, env);
        if (b === 0) throw MathError('You can\'t divide by 0.');
        return a / b;
      case 'pow':
        a = evaluate(node.a, env); b = evaluate(node.b, env);
        if (a === 0 && b < 0) throw MathError('You can\'t divide by 0.');
        r = Math.pow(a, b);
        if (isNaN(r)) throw MathError('That power doesn\'t have a real-number answer.');
        return r;
      case 'sqrt':
        a = evaluate(node.a, env);
        if (a < 0) throw MathError('\u221A of a negative number isn\'t a real number.');

    if (currentTest && byDate[currentTest.date]) {
      if (!byDate[currentTest.date].title) byDate[currentTest.date].title = currentTest.title || '';
      if (currentTest.skills && currentTest.skills.length) byDate[currentTest.date].skills = currentTest.skills;
    }
    var buckets = {};
    scores.forEach(function (s) {
      var id = slug(s.topic || 'General');
      if (!buckets[id]) buckets[id] = { id: id, label: s.topic || 'General', points: 0, max: 0 };
      buckets[id].points += Number(s.score) || 0;
      buckets[id].max += Number(s.total) || 0;
    });
    var skills = Object.keys(buckets).map(function (id) {
      var b = buckets[id];
      return { id: id, label: b.label, points: b.points, max: b.max, percent: b.max ? Math.round(100 * b.points / b.max) : null };
    });
    var latest = scores.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; })[0] || null;
    var day = data.today || today;
    return {
      full: false,
      name: data.name || 'Rio',
      today: day,
      todayTest: currentTest,
      streak: streakOf(scores.map(function (s) { return s.date; }), day),
      average: scores.length ? Math.round(scores.reduce(function (n, s) { return n + (Number(s.percent) || 0); }, 0) / scores.length) : null,
      completed: scores.length,
      assigned: null,
      latest: latest,
      days: Object.keys(byDate).sort().map(function (d) { return byDate[d]; }),
      skills: skills,
      certificates: data.certificates || [],
    };
  }

  function labelMap(m) {
    var map = {};
    (m.skills || []).forEach(function (s) { map[s.id] = s.label || skillLabel(s.id); });
    return map;
  }

  function draw() {
    if (!root) return;
    var m = (rio && rio.home) ? fromHome(rio) : fromFallback(rio);
    if (!viewY) {
      var t = parseIso(m.today) || { y: 2026, m: 8 };
      viewY = t.y; viewM = t.m;
    }
    root.innerHTML = '';
    root.appendChild(hero(m));
    root.appendChild(tiles(m));
    root.appendChild(calendar(m));
    root.appendChild(stats(m));
    root.appendChild(strengths(m));
    root.appendChild(certs(m));
    root.appendChild(tests(m));
    if (!m.full) {
      root.appendChild(el('p', { class: 'home-note', text: 'The color calendar and skill scores fill in after the math server is updated. Today\'s test still works.' }));
    }
  }

  function hero(m) {
    var t = m.todayTest;
    var sub = t ? ((t.title || 'Math practice') + ' · ' + prettyDate(t.date)) : 'No test posted yet.';
    var btn = el('button', {
      type: 'button', class: 'home-today', id: 'homeToday',
      'aria-label': t ? ('Today\'s test, ' + (t.title || '') + ', ' + (t.date || '')) : 'Today\'s test is not posted yet',
      onclick: function () { if (t && t.date) go(t.date); },
    }, [
      el('div', { class: 'k', text: '📝  TODAY\'S TEST' }),
      el('div', { class: 't', text: t ? 'Let\'s go!' : 'Check back soon' }),
      el('div', { class: 's', text: sub }),
    ]);
    if (!t) btn.disabled = true;
    return el('section', { class: 'home-hero', id: 'homeHero' }, [
      el('h1', { text: 'Hi, ' + (m.name || 'Rio') + '!' }),
      el('p', { class: 'home-date', text: prettyDate(m.today) || 'Ready to practice?' }),
      btn,
    ]);
  }

  function tile(k, v, s, extra) {
    return el('div', { class: 'home-tile' + (extra || '') }, [
      el('div', { class: 'k', text: k }),
      el('div', { class: 'v', text: v }),
      s ? el('div', { class: 's', text: s }) : null,
    ]);
  }
  function tiles(m) {
    var latest = m.latest;
    var latestV = latest ? (num(latest.percent) + '%') : '—';
    var latestS = latest ? (num(latest.score) + '/' + num(latest.total) + ' · ' + shortDay(latest.date)) : 'After your first grade';
    var turned = m.assigned == null ? String(m.completed) : (m.completed + ' / ' + m.assigned);
    var turnedS = m.assigned == null ? 'graded so far' : 'tests turned in';
    return el('section', { class: 'home-tiles', id: 'homeTiles', 'aria-label': 'Your numbers' }, [
      tile('🔥 Streak', m.streak ? (m.streak + (m.streak === 1 ? ' day' : ' days')) : '0', m.streak ? 'in a row' : 'Start one today!'),
      tile('Average', m.average == null ? '—' : (m.average + '%'), m.average == null ? 'No grades yet' : 'of graded tests'),
      tile('Turned in', turned, turnedS),
      tile('Latest', latestV, latestS, latest && Number(latest.percent) >= 90 ? ' good' : ''),
    ]);
  }

  function bounds(m) {
    var dates = (m.days || []).map(function (d) { return d.date; }).concat(m.today ? [m.today] : []);
    var min = null, max = null;
    dates.forEach(function (d) {
      var p = parseIso(d); if (!p) return;
      var key = p.y * 12 + p.m;
      if (min == null || key < min) min = key;
      if (max == null || key > max) max = key;
    });
    if (min == null) { var t = parseIso(m.today) || { y: viewY, m: viewM }; min = max = t.y * 12 + t.m; }
    return { min: min - 1, max: max };
  }

  function calendar(m) {
    var b = bounds(m);
    var key = viewY * 12 + viewM;
    var days = {};
    (m.days || []).forEach(function (d) { days[d.date] = d; });
    var firstDow = new Date(Date.UTC(viewY, viewM, 1, 12)).getUTCDay();
    var dim = new Date(Date.UTC(viewY, viewM + 1, 0, 12)).getUTCDate();
    var names = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
    var grid = el('div', { class: 'home-cal-grid', id: 'calGrid' });
    names.forEach(function (n) { grid.appendChild(el('div', { class: 'home-dow', text: n })); });
    var i;
    for (i = 0; i < firstDow; i++) grid.appendChild(el('div', { class: 'home-day empty' }));
    for (var d = 1; d <= dim; d++) {
      var date = isoOf(viewY, viewM, d);
      var info = days[date];
      var status = info ? info.status : 'none';
      var isToday = date === m.today;
      var cls = 'home-day st-' + status + (isToday ? ' is-today' : '');
      var label = dayLabel(date, info, isToday);
      var canOpen = info && info.hasTest !== false && status !== 'none';
      if (canOpen) {
        var btn = el('button', { type: 'button', class: cls, 'aria-label': label, onclick: (function (dt) { return function () { go(dt); }; })(date) });
        fillDay(btn, d, info);
        grid.appendChild(btn);
      } else {
        var cell = el('div', { class: cls, 'aria-hidden': status === 'none' ? 'true' : 'false' });
        fillDay(cell, d, info);
        grid.appendChild(cell);
      }
    }
    var prev = el('button', { type: 'button', class: 'home-nav', id: 'calPrev', 'aria-label': 'Previous month', text: '‹', onclick: function () {
      if (key <= b.min) return;
      viewM--; if (viewM < 0) { viewM = 11; viewY--; }
      draw();
    } });
    var next = el('button', { type: 'button', class: 'home-nav', id: 'calNext', 'aria-label': 'Next month', text: '›', onclick: function () {
      if (key >= b.max) return;
      viewM++; if (viewM > 11) { viewM = 0; viewY++; }
      draw();
    } });
    if (key <= b.min) prev.disabled = true;
    if (key >= b.max) next.disabled = true;
    return el('section', { class: 'home-card', id: 'homeCal' }, [
      el('div', { class: 'home-cal-head' }, [
        prev,
        el('h2', { id: 'calLabel', text: monthName(viewY, viewM) }),
        next,
      ]),
      grid,
      legend(),
    ]);
  }
  function fillDay(node, d, info) {
    node.appendChild(el('span', { class: 'dn', text: String(d) }));
    if (!info || info.status === 'none') return;
    var cap = { graded: info.percent == null ? '✓' : (num(info.percent)), awaiting: 'sent', missed: 'miss', assigned: 'go', upcoming: 'soon' }[info.status] || '';
    if (info.status === 'graded') node.style.background = scoreColor(info.percent);
    node.appendChild(el('span', { class: 'ds', text: cap }));
  }
  function dayLabel(date, info, isToday) {
    var nice = prettyDate(date);
    if (!info || info.status === 'none') return nice + ', no test';
    var bit = { graded: (info.percent == null ? 'graded' : info.percent + ' percent'), awaiting: 'turned in, waiting for a grade', missed: 'missed', assigned: 'assigned', upcoming: 'coming up' }[info.status] || info.status;
    return nice + (isToday ? ', today' : '') + ', ' + bit + (info.title ? ', ' + info.title : '') + ', open this test';
  }
  function legend() {
    return el('div', { class: 'home-legend' }, [
      el('span', null, [el('i', { class: 'sw graded' }), ' score']),
      el('span', null, [el('i', { class: 'sw sent' }), ' sent']),
      el('span', null, [el('i', { class: 'sw miss' }), ' missed']),
      el('span', null, [el('i', { class: 'sw go' }), ' to do']),
      el('span', null, [el('i', { class: 'sw soon' }), ' soon']),
    ]);
  }

  function stats(m) {
    return el('section', { class: 'home-card', id: 'homeStats' }, [
      el('h2', { text: '📈 Scores' }),
      chart(m),
    ]);
  }
  function chart(m) {
    var rows = (m.days || []).filter(function (d) { return d.status === 'graded' && d.percent != null; })
      .slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (rows.length > 14) rows = rows.slice(rows.length - 14);
    if (!rows.length) return el('p', { class: 'muted', text: 'Your chart starts after the first test is graded.' });
    var W = 360, H = 168, padL = 32, padR = 8, padT = 14, padB = 32;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var gap = rows.length > 10 ? 3 : 6;
    var bw = Math.min(36, (innerW - gap * (rows.length - 1)) / rows.length);
    var used = rows.length * bw + (rows.length - 1) * gap;
    var x0 = padL + Math.max(0, (innerW - used) / 2);
    var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', role: 'img', 'aria-label': 'Bar chart of your score percent on each graded test' });
    [0, 50, 100].forEach(function (p) {
      var y = padT + innerH - (p / 100) * innerH;
      svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: '#e3e8f5', 'stroke-width': '1' }));
      var t = svgEl('text', { x: padL - 6, y: y + 4, 'text-anchor': 'end', fill: '#5b6475', 'font-size': '11', 'font-family': 'system-ui, sans-serif' });
      t.textContent = String(p);
      svg.appendChild(t);
    });
    var pts = [];
    rows.forEach(function (d, i) {
      var pct = Math.max(0, Math.min(100, Number(d.percent) || 0));
      var h = Math.max(3, (pct / 100) * innerH);
      var x = x0 + i * (bw + gap);
      var y = padT + innerH - h;
      svg.appendChild(svgEl('rect', { x: x, y: y, width: bw, height: h, rx: '5', fill: scoreColor(pct) }));
      pts.push((x + bw / 2) + ',' + y);
      var lab = svgEl('text', { x: x + bw / 2, y: H - 10, 'text-anchor': 'middle', fill: '#5b6475', 'font-size': '10', 'font-family': 'system-ui, sans-serif' });
      lab.textContent = shortDay(d.date);
      svg.appendChild(lab);
    });
    if (pts.length > 1) svg.appendChild(svgEl('polyline', { points: pts.join(' '), fill: 'none', stroke: '#1d2433', 'stroke-width': '2', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    return svg;
  }

  function strengths(m) {
    var ranked = (m.skills || []).filter(function (s) { return s && s.max > 0 && s.percent != null; });
    var strong = ranked.filter(function (s) { return s.percent >= 80; }).sort(function (a, b) { return b.percent - a.percent; }).slice(0, 4);
    var weak = ranked.filter(function (s) { return s.percent < 70; }).sort(function (a, b) { return a.percent - b.percent; }).slice(0, 4);
    var mid = ranked.filter(function (s) { return s.percent >= 70 && s.percent < 80; }).sort(function (a, b) { return a.percent - b.percent; }).slice(0, 4);
    var box = el('section', { class: 'home-card', id: 'homeSkills' }, [
      el('h2', { text: '💪 Skills' }),
    ]);
    if (!m.full) box.appendChild(el('p', { class: 'muted home-skill-note', text: 'Grouped by the test name until each question has a skill.' }));
    if (!ranked.length) {
      box.appendChild(el('p', { class: 'muted', text: 'Skill scores show up after a test is graded.' }));
      return box;
    }
    box.appendChild(skillGroup('🌟 Strong areas', strong, 'Nothing here yet — keep practicing and they will show up.', 'strong'));
    box.appendChild(skillGroup('🎯 Practice these', weak, 'No problem areas right now. Nice!', 'weak'));
    if (mid.length) box.appendChild(skillGroup('👍 Getting there', mid, '', 'mid'));
    return box;
  }
  function skillGroup(title, list, empty, kind) {
    var body = list.length ? el('ul', { class: 'home-skill-list' }, list.map(function (s) { return skillRow(s, kind); }))
      : el('p', { class: 'muted', text: empty });
    return el('div', { class: 'home-skill-group ' + kind }, [el('h3', { text: title }), body]);
  }
  function skillRow(s, kind) {
    var pct = Math.max(0, Math.min(100, Number(s.percent) || 0));
    return el('li', null, [
      el('div', { class: 'home-skill-top' }, [
        el('b', { text: s.label || skillLabel(s.id) }),
        el('span', { text: pct + '%' }),
      ]),
      el('div', { class: 'home-track' }, [el('div', { class: 'home-fill ' + kind, style: 'width:' + pct + '%;background:' + scoreColor(pct) })]),
      el('small', { text: num(s.points) + ' of ' + num(s.max) + ' points' }),
    ]);
  }

  function certs(m) {
    var list = m.certificates || [];
    var seen = seenCerts();
    var shelf = el('div', { class: 'rio-shelf', id: 'homeCertShelf' });
    list.forEach(function (c) {
      var isNew = seen.indexOf(c.id) === -1;
      var fig = el('button', {
        type: 'button', class: 'rio-cert-thumb', 'aria-label': 'Open certificate ' + (c.title || ''),
        onclick: function () { if (window.RioInbox && RioInbox.openCert) RioInbox.openCert(c); },
      });
      if (window.RioCert && RioCert.svg) fig.appendChild(RioCert.svg(c));
      fig.appendChild(el('span', { class: 'cap', text: c.title || 'Certificate' }));
      if (isNew) fig.appendChild(el('b', { class: 'rio-badge new', text: 'NEW' }));
      shelf.appendChild(fig);
    });
    var all = el('button', { type: 'button', class: 'btn secondary home-cert-all', id: 'homeCertAll', text: 'Open my certificates', onclick: function () {
      if (window.RioInbox && RioInbox.open) RioInbox.open('certs');
    } });
    return el('section', { class: 'home-card', id: 'homeCerts' }, [
      el('h2', { text: '🏅 Certificates' }),
      list.length ? shelf : el('p', { class: 'muted', text: 'When Dad gives you a certificate, it shows up here. You can print it or save the picture.' }),
      list.length ? all : null,
    ]);
  }

  function tests(m) {
    var labels = labelMap(m);
    var allSkills = [];
    (m.days || []).forEach(function (d) {
      (d.skills || []).forEach(function (id) { if (allSkills.indexOf(id) === -1) allSkills.push(id); });
    });
    allSkills.sort(function (a, b) { return (labels[a] || skillLabel(a)) < (labels[b] || skillLabel(b)) ? -1 : 1; });
    picked = picked.filter(function (id) { return allSkills.indexOf(id) !== -1; });
    var chips = el('div', { class: 'home-chips', id: 'homeSkillFilters' });
    var allBtn = el('button', { type: 'button', class: 'home-chip', 'aria-pressed': picked.length ? 'false' : 'true', text: 'All', onclick: function () { picked = []; draw(); } });
    chips.appendChild(allBtn);
    allSkills.forEach(function (id) {
      var on = picked.indexOf(id) !== -1;
      chips.appendChild(el('button', {
        type: 'button', class: 'home-chip', 'aria-pressed': on ? 'true' : 'false', 'data-skill': id,
        text: labels[id] || skillLabel(id),
        onclick: function () {
          var i = picked.indexOf(id);
          if (i === -1) picked.push(id); else picked.splice(i, 1);
          draw();
        },
      }));
    });
    var rows = (m.days || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).filter(function (d) {
      if (!picked.length) return true;
      return picked.some(function (id) { return (d.skills || []).indexOf(id) !== -1; });
    });
    var list = el('div', { class: 'home-tests', id: 'homeTestList' });
    if (!rows.length) list.appendChild(el('p', { class: 'muted', text: 'No tests for those skills. Try another one!' }));
    rows.forEach(function (d) {
      var can = d.hasTest !== false && d.status !== 'none';
      var pill = statusPill(d);
      var skillBits = (d.skills || []).slice(0, 3).map(function (id) { return labels[id] || skillLabel(id); }).join(' · ');
      var row = el(can ? 'button' : 'div', {
        type: can ? 'button' : null,
        class: 'home-test',
        onclick: can ? function () { go(d.date); } : null,
      }, [
        el('div', { class: 'home-test-top' }, [
          el('b', { text: prettyDate(d.date) }),
          pill,
        ]),
        el('div', { class: 'home-test-title', text: d.title || 'Math practice' }),
        skillBits ? el('div', { class: 'home-test-skills', text: skillBits }) : null,
      ]);
      list.appendChild(row);
    });
    var hint = picked.length
      ? ('Showing tests that practice ' + (picked.length === 1 ? 'this skill' : 'any of these skills') + '.')
      : (allSkills.length ? 'Tap a skill to filter the list.' : '');
    return el('section', { class: 'home-card', id: 'homeTests' }, [
      el('h2', { text: '📚 Tests' }),
      allSkills.length ? chips : null,
      hint ? el('p', { class: 'home-filter-hint', id: 'homeFilterHint', text: hint }) : null,
      list,
    ]);
  }
  function statusPill(d) {
    var text = { graded: d.percent == null ? 'Graded' : (num(d.percent) + '%'), awaiting: 'Sent', missed: 'Missed', assigned: 'To do', upcoming: 'Soon', none: '' }[d.status] || '';
    if (!text) return null;
    var node = el('span', { class: 'home-pill st-' + d.status, text: text });
    if (d.status === 'graded' && d.percent != null) node.style.background = scoreColor(d.percent);
    return node;
  }

  function mount(container, opts) {
    opts = opts || {};
    rio = opts.rio || null;
    today = opts.today || (rio && rio.today) || '';
    baseUrl = opts.baseUrl || '';
    recent = Array.isArray(opts.recent) ? opts.recent : [];
    root = el('div', { class: 'home', id: 'home' });
    container.appendChild(root);
    draw();
    if (!(rio && rio.home) && typeof rioFetchJSON === 'function' && typeof RIO_API_URL === 'string') {
      rioFetchJSON(RIO_API_URL + '?format=json', { method: 'GET' }, 30000).then(function (res) {
        if (res && res.test) currentTest = { date: res.test.date, title: res.test.title || '', skills: skillsOfTest(res.test) };
        if (res && Array.isArray(res.recent)) recent = res.recent;
        if (res && res.today && !today) today = res.today;
        draw();
      }, function () {});
    }
  }
  return { mount: mount };
})();

<script>
window.__rioStart = function () {

  var startedAt = new Date().toISOString();
  var storeKey = test ? ('rio-math-draft-' + test.date) : null;
  var M = RioMath;
  var MAX_PICTURES = 8;   // Code.gs keeps at most CONFIG.MAX_PHOTOS = 8 pictures per submission
  var partById = {};      // partId -> { part, q }
  var fieldInfo = {};     // fieldId -> "1b · TechBus:"
  var paperRefresh = {};  // partId -> function that redraws the attached-graph preview

  function el(tag, attrs, children) {

    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);

    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // Must mirror fieldsForPart_() in Code.gs
  function fieldsForPart(p) {
    if (p.type === 'info') return [];

  }
  function allFields() {

    }); });

  }
  function prettyDate(iso) {
    var p = iso.split('-');
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12));

  }

  function saveDraft() {
    if (!storeKey) return;
    localStorage.setItem(storeKey, JSON.stringify({ answers: answers, photos: photos, graphs: graphs }));
    updateProgress();
  }

  function table(t) {
    if (!t || !t.columns) return null;
    return el('table', { class: 'vals' }, [
      el('thead', null, [el('tr', null, t.columns.map(function (c) { return el('th', { text: c }); }))]),
      el('tbody', null, (t.rows || []).map(function (r) {
        return el('tr', null, r.map(function (c) { return el('td', { text: c }); }));
      }))

  }

  function fieldEl(f) {

      var box = el('div', { class: 'choices', role: 'group' });
      (f.options || []).forEach(function (opt) {
        var b = el('button', { type: 'button', 'aria-pressed': String(answers[f.id] === opt), text: opt });
        b.addEventListener('click', function () {
          answers[f.id] = answers[f.id] === opt ? '' : opt;

        : el('input', { id: inputId, type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'Your answer' });

  function resizeImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function () { alertModal('😕', 'Hmm', 'That picture could not be opened. Try taking the photo again.'); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  /** Answers + pictures exactly as they are sent. Graph-tool graphs go in as a PNG "photo" of their part
   *  (same path as camera photos, first so the 8-picture limit never drops them) plus a text description
   *  appended to that part's notes answer, so the grader can read the settings without opening the picture. */
  function buildSubmission() {
    var sendAnswers = {}, photoList = [], graphCount = 0;
    Object.keys(answers).forEach(function (k) { sendAnswers[k] = answers[k]; });
    Object.keys(graphs).forEach(function (pid) {
      var g = graphs[pid];
      if (!g || !partById[pid]) return;
      var png = null;
      try { png = graphPNG(g, graphTitle(pid)); } catch (e) {}
      if (png) photoList.push({ partId: pid, dataUrl: png });
      var key = pid + '-notes', notes = String(answers[key] || '').trim(), desc = M.describeGraph(g);
      if (!png) desc = desc.replace(' \u2014 picture attached', ' \u2014 picture could not be made');
      sendAnswers[key] = notes ? notes + '\n\n' + desc : desc;
      graphCount++;
    });
    Object.keys(photos).forEach(function (pid) { (photos[pid] || []).forEach(function (d) { photoList.push({ partId: pid, dataUrl: d }); }); });
    return { answers: sendAnswers, photos: photoList.slice(0, MAX_PICTURES), graphCount: graphCount };
  }

  /* =====================================================================

  function copyText(text, btn, label) {

    }

  /* ------------------------------ graph drawing ------------------------------ */
  var DEFAULT_AXES = { xmin: -10, xmax: 10, xstep: 1, ymin: -10, ymax: 10, ystep: 1 };
  var AXIS_KEYS = ['xmin', 'xmax', 'xstep', 'ymin', 'ymax', 'ystep'];

  function withParsed(items) {
    return (items || []).map(function (it) {
      var p = null;
      try { p = M.parseGraphInput(it.input); } catch (e) {}
      return { input: it.input, label: it.label, color: it.color, p: p };
    });
  }
  function itemName(it) { return it.p ? uni(it.p.text) : it.input; }

  /**
   * Draws axes, grid, tick numbers and items on a 2D context (W x H in CSS px).
   * o: { font, pad, lineW, dot, axisW, title, titleH, legend, legendH }
   * Returns the view transform (used for taps).
   */
  function drawGraph(ctx, W, H, axes, items, o) {
    o = o || {};
    var fs = o.font || 13, pad = o.pad || 8;
    var xt = M.ticks(axes.xmin, axes.xmax, axes.xstep), yt = M.ticks(axes.ymin, axes.ymax, axes.ystep);
    function lab(v) { return uni(M.formatNumber(v)); }
    function setFont(w, size) { ctx.font = w + ' ' + (size || fs) + 'px ' + FONT; }
    setFont(600);
    var yLabW = 0, xLabW = 0;
    yt.forEach(function (t) { yLabW = Math.max(yLabW, ctx.measureText(lab(t.v)).width); });
    xt.forEach(function (t) { xLabW = Math.max(xLabW, ctx.measureText(lab(t.v)).width); });
    var yAxisIn = axes.xmin < 0 && axes.xmax > 0, xAxisIn = axes.ymin < 0 && axes.ymax > 0;
    var top = pad + (o.titleH || 0) + fs * 0.4, right = W - pad - fs * 0.3, bottom = H - pad - (o.legendH || 0), left = pad;
    if (!yAxisIn) left += yLabW + 8;
    if (!xAxisIn) bottom -= fs + 8;
    var pw = right - left, ph = bottom - top;
    function sx(x) { return left + (x - axes.xmin) / (axes.xmax - axes.xmin) * pw; }
    function sy(y) { return bottom - (y - axes.ymin) / (axes.ymax - axes.ymin) * ph; }
    function seg(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
    function halo(text, x, y, color, w) {
      ctx.lineJoin = 'round'; ctx.lineWidth = w || Math.max(3, fs / 4); ctx.strokeStyle = 'rgba(255,255,255,.95)';
      ctx.strokeText(text, x, y); ctx.fillStyle = color; ctx.fillText(text, x, y);
    }

    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    if (o.title) {
      setFont(800, fs * 1.1); ctx.fillStyle = '#1d2433'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillText(o.title, pad, pad + o.titleH / 2);
    }
    var everyX = M.labelEvery(pw / ((axes.xmax - axes.xmin) / axes.xstep), xLabW + fs * 0.6);
    var everyY = M.labelEvery(ph / ((axes.ymax - axes.ymin) / axes.ystep), fs * 1.5);
    // grid: light lines at every interval, a bit darker where there is a number
    ctx.lineWidth = 1;
    [false, true].forEach(function (strong) {
      ctx.strokeStyle = strong ? '#b9c5de' : '#dfe6f3';
      ctx.beginPath();
      xt.forEach(function (t) { if ((t.k % everyX === 0) !== strong) return; var X = Math.round(sx(t.v)) + 0.5; ctx.moveTo(X, top); ctx.lineTo(X, bottom); });

    });
    ctx.strokeStyle = '#9aa7c2'; ctx.lineWidth = 1.5; ctx.strokeRect(left, top, pw, ph);
    // bold axes
    var yAxisVis = axes.xmin <= 0 && axes.xmax >= 0, xAxisVis = axes.ymin <= 0 && axes.ymax >= 0;

    ctx.strokeStyle = '#1d2433'; ctx.lineWidth = o.axisW || 2.5;

    setFont(600);
    var tick = Math.max(4, fs * 0.35);
    var xLabY, xBase = 'top', xAlong = xAxisIn;
    if (xAxisIn) { xLabY = ay0 + tick + 2; if (xLabY + fs > bottom) { xLabY = ay0 - tick - 2; xBase = 'bottom'; } }
    else xLabY = bottom + 5;
    ctx.textAlign = 'center'; ctx.textBaseline = xBase;
    xt.forEach(function (t) {
      if (t.k % everyX !== 0) return;
      if (t.v === 0 && xAxisIn && yAxisIn) return;
      var X = sx(t.v), s = lab(t.v), w = ctx.measureText(s).width;
      if (xAxisVis) { ctx.strokeStyle = '#1d2433'; ctx.lineWidth = 1.5; seg(X, ay0 - tick, X, ay0 + tick); }
      X = Math.max(w / 2 + 2, Math.min(W - w / 2 - 2, X));

    });
    var yLabX, yAlign = 'right', yAlong = yAxisIn;
    if (yAxisIn) { yLabX = ax0 - tick - 3; if (yLabX - yLabW < left) { yLabX = ax0 + tick + 3; yAlign = 'left'; } }
    else yLabX = left - 5;
    ctx.textAlign = yAlign; ctx.textBaseline = 'middle';
    yt.forEach(function (t) {
      if (t.k % everyY !== 0) return;

      var Y = sy(t.v), s = lab(t.v);
      if (yAxisVis) { ctx.strokeStyle = '#1d2433'; ctx.lineWidth = 1.5; seg(ax0 - tick, Y, ax0 + tick, Y); }
      Y = Math.max(fs / 2 + 1, Math.min(H - fs / 2 - 1, Y));
      if (yAlong) halo(s, yLabX, Y, '#1d2433'); else { ctx.fillStyle = '#1d2433'; ctx.fillText(s, yLabX, Y); }
    });
    if (xAxisIn && yAxisIn) { ctx.textAlign = 'right'; ctx.textBaseline = 'top'; halo('0', ax0 - 4, ay0 + 3, '#1d2433'); }
    setFont('italic 800', fs * 1.1);
    if (xAxisVis) { ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; halo('x', right - 3, ay0 - 3, '#1d2433'); }
    if (yAxisVis) { ctx.textAlign = 'left'; ctx.textBaseline = 'top'; halo('y', ax0 + 5, top + 2, '#1d2433'); }

    // the things he graphed
    var box = { xmin: axes.xmin, xmax: axes.xmax, ymin: axes.ymin, ymax: axes.ymax }, labels = [], shapes = [];
    var SPOTS = [0.85, 0.7, 0.55, 0.4, 0.25, 0.95, 0.1];

        shapes.push({ line: p });
        labels.push({ text: text, color: it.color, anchors: spots.map(function (t) {
          return [sx(s[0][0] + (s[1][0] - s[0][0]) * t), sy(s[0][1] + (s[1][1] - s[0][1]) * t)];
        }) });
      } else if (p.kind === 'curve') {
        var runs = M.sampleCurve(p, box, Math.max(200, Math.min(900, Math.round(pw)))), visible = [];
        runs.forEach(function (run) {
          ctx.beginPath();
          run.forEach(function (pt, i) {
            if (i) ctx.lineTo(sx(pt[0]), sy(pt[1])); else ctx.moveTo(sx(pt[0]), sy(pt[1]));
            if (pt[1] >= box.ymin && pt[1] <= box.ymax) visible.push([sx(pt[0]), sy(pt[1])]);
          });
          ctx.stroke();
        });
        shapes.push({ pts: visible });
        if (visible.length) labels.push({ text: text, color: it.color, anchors: spots.map(function (t) { return visible[Math.floor((visible.length - 1) * t)]; }) });
      } else if (p.kind === 'points') {
        var r = o.dot || 6, firstPt = true;
        p.points.forEach(function (pt) {
          if (pt.x < box.xmin || pt.x > box.xmax || pt.y < box.ymin || pt.y > box.ymax) return;
          var X = sx(pt.x), Y = sy(pt.y);
          ctx.beginPath(); ctx.arc(X, Y, r, 0, Math.PI * 2); ctx.fillStyle = it.color; ctx.fill();
          ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
          shapes.push({ pts: [[X, Y]], r: r + 2 });
          var coords = (pt.name ? pt.name : '') + '(' + uni(M.formatNumber(pt.x)) + ', ' + uni(M.formatNumber(pt.y)) + ')';
          labels.push({ text: (firstPt && it.label ? it.label + ' ' : '') + coords, color: it.color, anchors: [[X, Y]], gap: r });
          firstPt = false;
        });
      }
    });
    ctx.restore();

    // Labels: try spots along each line (and sides of it) until one doesn't cover another label, a line, or the axis numbers.
    var taken = [];
    if (xAxisVis && xAlong) taken.push({ x: left, y: xBase === 'top' ? ay0 - 2 : ay0 - tick - fs - 4, w: pw, h: tick + fs + 6 });
    if (yAxisVis && yAlong) taken.push({ x: yAlign === 'right' ? yLabX - yLabW - 2 : ax0 - tick, y: top, w: yLabW + tick + 8, h: ph });
    setFont('italic 800', fs * 1.1);
    if (xAxisVis) taken.push({ x: right - fs * 1.2, y: ay0 - fs * 1.4, w: fs * 1.2, h: fs * 1.4 });
    if (yAxisVis) taken.push({ x: ax0, y: top, w: fs * 1.6, h: fs * 1.4 });
    function overlaps(a, b) { return a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h; }

        ymin: axes.ymin + (bottom - rc.y - rc.h) / ph * (axes.ymax - axes.ymin), ymax: axes.ymin + (bottom - rc.y) / ph * (axes.ymax - axes.ymin) };
      return shapes.some(function (sh) {
        if (sh.line) return !!M.clipLine(sh.line.a, sh.line.b, sh.line.c, dbox);
        var pad2 = sh.r || 2;

    labels.forEach(function (L) {
      var w = ctx.measureText(L.text).width + 4, h = fs + 4, g = (L.gap || 0) + 5, best = null, found = false;

  /** The picture that gets sent with the answer (fixed size, same on every device). */
  function graphPNG(spec, title) {

  }
  function graphTitle(pid) {

  }

  /* ------------------------------ graph tool ------------------------------ */
  var G = { mode: 'free', part: null, ws: null, axes: DEFAULT_AXES, axesOk: true, view: null, tap: null };
  var gReady = false;

  function wsKey(mode) { return mode === 'free' ? 'rio-math-graph-free' : 'rio-math-graph-' + (test ? test.date : 'none') + '-' + mode; }
  function axesToText(ax) { var t = {}; AXIS_KEYS.forEach(function (k) { t[k] = M.formatNumber(ax[k]); }); return t; }
  function loadWs(mode, part) {

      var w = JSON.parse(load(wsKey(mode)) || 'null');
      if (w && w.axesText && Array.isArray(w.items)) return w;
    } catch (e) {}
    if (part && graphs[part.id]) return { axesText: axesToText(graphs[part.id].axes), items: graphs[part.id].items.slice() };
    return { axesText: axesToText((part && M.suggestedAxes(part.prompt)) || DEFAULT_AXES), items: [] };
  }
  function saveWs() { if (G.ws) store(wsKey(G.mode), JSON.stringify(G.ws)); }

  function ensureGraphReady() {
    if (gReady) return;

    AXIS_KEYS.forEach(function (k) {
      var inp = $('ax-' + k);
      inp.addEventListener('input', function () { G.ws.axesText[k] = inp.value; applyAxes(); saveWs(); });
    });
    ['x', 'y', '=', '(', ')', '/', '-', ',', '.'].forEach(function (ch) {
      var b = el('button', { type: 'button', text: ch === '-' ? '\u2212' : ch, 'aria-label': 'Type ' + ch });
      b.addEventListener('mousedown', function (e) { e.preventDefault(); });   // keep the text box focused
      b.addEventListener('click', function () {
        var inp = $('gInput'), v = inp.value;
        var s = typeof inp.selectionStart === 'number' ? inp.selectionStart : v.length, e2 = typeof inp.selectionEnd === 'number' ? inp.selectionEnd : v.length;
        var add = ch === '=' ? ' = ' : ch === ',' ? ', ' : ch;
        inp.value = v.slice(0, s) + add + v.slice(e2);
        try { inp.setSelectionRange(s + add.length, s + add.length); } catch (x) {}

      $('gKeys').appendChild(b);
    });
    $('gAdd').addEventListener('click', addItem);
    [$('gInput'), $('gLabel')].forEach(function (inp) {
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });
    });
    $('gResetAxes').addEventListener('click', function () { setAxesText(axesToText(DEFAULT_AXES)); });
    $('gSuggest').addEventListener('click', function () { var s = G.part && M.suggestedAxes(G.part.prompt); if (s) setAxesText(axesToText(s)); });
    $('gClear').addEventListener('click', function () {

  }

  function openGraph(partId) {

    ensureGraphReady();

    G.mode = info ? info.part.id : 'free';
    G.ws = loadWs(G.mode, G.part);
    G.tap = null;

    tgt.innerHTML = '';

      tgt.appendChild(document.createTextNode(info.part.prompt || ''));

    show(tgt, !!info);
    show($('gSuggest'), !!(G.part && M.suggestedAxes(G.part.prompt)));
    $('gUse').textContent = info && graphs[info.part.id] ? '✅ Update the graph in my answer' : '✅ Use this graph in my answer';
    $('gFootNote').textContent = info ? 'The picture and the settings go in with your answer for ' + info.q.number + (info.part.label || '') + '.' : '';

    applyAxes(true);

  }

  function setAxesText(t) {
    G.ws.axesText = t;
    AXIS_KEYS.forEach(function (k) { $('ax-' + k).value = t[k]; });
    applyAxes(); saveWs();
  }
  function applyAxes(noDraw) {
    var r = M.validateAxes(G.ws.axesText), msg = $('gAxisMsg');
    AXIS_KEYS.forEach(function (k) { $('ax-' + k).classList.toggle('bad', !!r.bad[k]); });
    G.axesOk = r.ok;
    if (r.ok) { G.axes = r.axes; msg.hidden = true; }
    else {
      msg.innerHTML = '';
      r.errors.forEach(function (e) { msg.appendChild(el('div', { text: '⚠️ ' + e })); });
      msg.appendChild(el('div', { class: 'muted', text: 'The graph shows your last good settings until this is fixed.' }));
      msg.hidden = false;
    }
    $('gUse').disabled = !r.ok;
    if (!noDraw) drawScreen();
  }

  function addMsg(text, bad) {
    var m = $('gAddMsg');
    m.textContent = text; m.classList.toggle('bad', !!bad); m.hidden = !text;
  }

  function isVisible(p, a) {
    var box = { xmin: a.xmin, xmax: a.xmax, ymin: a.ymin, ymax: a.ymax };
    if (p.kind === 'line') return !!M.clipLine(p.a, p.b, p.c, box);
    if (p.kind === 'points') return p.points.some(function (q) { return q.x >= a.xmin && q.x <= a.xmax && q.y >= a.ymin && q.y <= a.ymax; });
    return M.sampleCurve(p, box, 200).some(function (run) { return run.some(function (q) { return q[1] >= a.ymin && q[1] <= a.ymax; }); });
  }

  function addItem() {
    var inp = $('gInput'), raw = inp.value.trim(), p;
    if (!raw) { addMsg('Type something to graph first, like y = 2x + 3 or (3, 5).', true); return; }
    try { p = M.parseGraphInput(raw); } catch (e) {
      addMsg((e.friendly ? e.message : 'I couldn\'t read that.') + ' Examples: y = 2x + 3,  x = -2,  3x - y = -6,  (3, 5)', true);
      return;
    }
    if (G.ws.items.length >= 12) { addMsg('That\'s a lot! Take something off the list first (12 at most).', true); return; }
    var item = { input: raw, label: $('gLabel').value.trim().slice(0, 40), color: M.nextColor(G.ws.items) };
    G.ws.items.push(item);
    inp.value = ''; $('gLabel').value = '';
    var notes = [];
    if (p.note) notes.push('I graphed it with ' + p.note + '.');
    if (!isVisible(p, G.axes)) notes.push('It\'s outside this graph window, so change the axes to see it.');
    addMsg(notes.length ? 'Added! ' + notes.join(' ') : '', false);
    saveWs(); renderList(); drawScreen();
  }

  function renderList() {
    var ul = $('gList');

      ul.appendChild(el('li', { class: 'empty', text: 'Nothing on the graph yet. Try y = 2x + 3 or (3, 5).' }));
      return;
    }
    withParsed(G.ws.items).forEach(function (it, i) {
      var kind = it.p ? (it.p.kind === 'points' ? (it.p.points.length === 1 ? 'point' : it.p.points.length + ' points') : it.p.kind === 'curve' ? 'curve' : 'line') : 'can\'t read this one';
      ul.appendChild(el('li', null, [
        el('span', { class: 'swatch', style: 'background:' + it.color }),
        el('div', { class: 'txt' }, [el('b', { text: itemName(it) }), el('small', { text: (it.label ? it.label + ' · ' : '') + kind + ' · ' + M.colorName(it.color) })]),
        el('button', { type: 'button', class: 'rm', 'aria-label': 'Remove ' + itemName(it), text: '✕', onclick: function () {

  }

  function drawScreen() {
    if (!gReady || currentTool !== 'graph' || toolEl.hidden || !G.ws) return;
    var c = $('gCanvas'), wrap = $('gWrap');
    var cssW = Math.max(220, Math.floor(wrap.clientWidth - 4));
    var cssH = Math.round(Math.min(cssW * (window.innerWidth >= 760 ? 0.9 : 1), Math.max(240, window.innerHeight * 0.6)));
    var dpr = Math.min(3, window.devicePixelRatio || 1);

    var coord = $('gCoord');

      ctx.moveTo(X, Y - 14); ctx.lineTo(X, Y - 5); ctx.moveTo(X, Y + 5); ctx.lineTo(X, Y + 14); ctx.stroke();
      coord.textContent = '📍 (' + uni(M.formatNumber(G.tap.x)) + ', ' + uni(M.formatNumber(G.tap.y)) + ')';

  }

  function onCanvasTap(e) {

    if (X < v.left - 2 || X > v.left + v.pw + 2 || Y < v.top - 2 || Y > v.top + v.ph + 2) { G.tap = null; drawScreen(); return; }
    var x = a.xmin + (X - v.left) / v.pw * (a.xmax - a.xmin), y = a.ymax - (Y - v.top) / v.ph * (a.ymax - a.ymin);
    var gx = Math.round(x / a.xstep) * a.xstep, gy = Math.round(y / a.ystep) * a.ystep;
    var rx = Math.min(12, 0.3 * v.pw * a.xstep / (a.xmax - a.xmin)), ry = Math.min(12, 0.3 * v.ph * a.ystep / (a.ymax - a.ymin));

      var dy = Math.max(0, Math.min(4, Math.floor(-Math.log((a.ymax - a.ymin) / v.ph) / Math.LN10)));
      x = Math.round(x * Math.pow(10, dx)) / Math.pow(10, dx); y = Math.round(y * Math.pow(10, dy)) / Math.pow(10, dy);

    drawScreen();
  }

  function useGraph() {

    graphs[pid] = {

      items: G.ws.items.map(function (it) { return { input: it.input, label: it.label || '', color: it.color }; }),

  /* ------------------------------ calculator ------------------------------ */
  var C = { expr: '', done: false, ans: '', frac: null, error: '' };
  var calcBuilt = false;
  var CALC_KEYS = [
    ['C', 'clear', 'fn', 'Clear'], ['⌫', 'back', 'fn', 'Backspace'], ['(', '(', ''], [')', ')', ''], ['÷', '÷', 'op', 'Divide'],
    ['x²', '²', '', 'Squared'], ['√', '√(', '', 'Square root'], ['^', '^', '', 'Power'], ['π', 'π', '', 'Pi'], ['×', '×', 'op', 'Times'],
    ['7', '7', 'd'], ['8', '8', 'd'], ['9', '9', 'd'], ['±', 'neg', '', 'Change sign'], ['−', '−', 'op', 'Minus'],
    ['4', '4', 'd'], ['5', '5', 'd'], ['6', '6', 'd'], ['a/b', '/', 'small', 'Fraction bar'], ['+', '+', 'op', 'Plus'],
    ['1', '1', 'd'], ['2', '2', 'd'], ['3', '3', 'd'], ['.', '.', 'd', 'Decimal point'], ['=', 'eq', 'eq', 'Equals'],
    ['0', '0', 'd wide'], ['Ans', 'ans', 'small wide', 'Last answer']
  ];
  var calcBtns = {};

  function buildCalc() {
    if (calcBuilt) return;
    calcBuilt = true;
    CALC_KEYS.forEach(function (k) {
      var b = el('button', { type: 'button', class: k[2], text: k[0], 'aria-label': k[3] || k[0] });
      b.addEventListener('click', function () { calcPress(k[1]); });
      calcBtns[k[1]] = b;
      $('cKeys').appendChild(b);
    });
    $('cCopy').addEventListener('click', function () { var t = calcOutput(); if (t) copyText(t, $('cCopy'), '📋 Copy'); });
    $('cInsert').addEventListener('click', function () {
      var t = calcOutput();
      if (t && !insertIntoAnswer(t)) renderCalc();
    });
  }
  function ansForExpr() {
    if (!C.ans) return '';
    var a = uni(C.ans);
    return C.ans.charAt(0) === '-' ? '(' + a + ')' : a;
  }
  function calcPress(k) {
    C.error = '';
    if (k === 'clear') { C.expr = ''; C.done = false; }
    else if (k === 'back') { if (C.done) C.done = false; else C.expr = C.expr.slice(0, -1); }
    else if (k === 'eq') {
      if (!C.expr) return renderCalc();
      var open = (C.expr.match(/\(/g) || []).length - (C.expr.match(/\)/g) || []).length;
      try {
        var r = M.calc(C.expr);
        for (var i = 0; i < open; i++) C.expr += ')';
        C.ans = r.text; C.frac = r.fraction; C.done = true;
      } catch (e) { C.error = e.friendly ? e.message : 'Hmm, check that again.'; C.done = false; }
    } else if (k === 'neg') {
      if (C.done) { C.expr = C.ans.charAt(0) === '-' ? C.ans.slice(1) : '\u2212' + C.ans; C.expr = uni(C.expr); C.done = false; }
      else {
        var m = /(\d+\.?\d*|\.\d+|π)$/.exec(C.expr);
        if (!m) C.expr += '\u2212';
        else {
          var before = C.expr.slice(0, m.index), num = m[0];
          if (/\(\u2212$/.test(before)) C.expr = before.slice(0, -2) + num;
          else if (/(^|[×÷\/^(])\u2212$/.test(before)) C.expr = before.slice(0, -1) + num;
          else if (before === '' || /[×÷\/^(]$/.test(before)) C.expr = before + '\u2212' + num;
          else C.expr = before + '(\u2212' + num;
        }
      }
    } else {
      var s = k === 'ans' ? ansForExpr() : k;
      if (!s) return renderCalc();
      if (C.done) { C.expr = /^[+\u2212×÷\/^²]/.test(s) ? ansForExpr() : ''; C.done = false; }
      if (C.expr.length < 150) C.expr += s;
    }
    renderCalc();
  }
  function calcPreview() {
    if (!C.expr || C.done) return null;
    try { return M.calc(C.expr); } catch (e) { return null; }
  }
  /** What Copy / Put-in-my-answer use: the answer after "=", or the live preview. Plain "-" minus. */
  function calcOutput() {
    if (C.done) return C.ans;
    var p = calcPreview();
    return p ? p.text : '';
  }
  function renderCalc() {
    var res = $('cRes'), pv = calcPreview();
    $('cExpr').textContent = C.expr ? C.expr + (C.done ? ' =' : '') : '';
    res.className = 'cres';
    if (C.error) { res.textContent = '⚠️ ' + C.error; res.classList.add('err'); }
    else if (C.done) res.textContent = uni(C.ans);
    else if (pv && /[^\d.]/.test(C.expr)) { res.textContent = '= ' + uni(pv.text); res.classList.add('preview'); }
    else res.textContent = C.expr ? '' : '0';
    var frac = C.done ? C.frac : (pv && !C.error ? pv.fraction : null);
    $('cFrac').textContent = frac ? '= ' + uni(frac) + ' as a fraction' : '';
    var out = calcOutput(), target = lastField && document.body.contains(lastField) ? fieldInfo[lastField.id.slice(2)] : '';
    $('cCopy').disabled = !out;
    $('cInsert').disabled = !out || !target;
    $('cHint').textContent = target ? 'Put in my answer → ' + target
      : 'Tip: tap an answer box first, then open the calculator, and "Put in my answer" will type the result there for you.';
  }

  document.addEventListener('keydown', function (e) {
    if (toolEl.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closeTool(); return; }
    if (currentTool !== 'calc' || e.ctrlKey || e.metaKey || e.altKey) return;
    var a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type === 'text'))) return;
    var map = { '+': '+', '-': '\u2212', '*': '×', 'x': '×', 'X': '×', '/': '/', '÷': '÷', '^': '^', '(': '(', ')': ')', '.': '.', ',': '.',
      'p': 'π', 'P': 'π', 'r': '√(', 's': '√(', '²': '²', 'Enter': 'eq', '=': 'eq', 'Backspace': 'back', 'Delete': 'clear', 'c': 'clear', 'C': 'clear' };
    var k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
    if (!k) return;
    e.preventDefault();
    calcPress(k);
    var b = calcBtns[k === '/' ? '/' : k];
    if (b) { b.classList.add('hit'); setTimeout(function () { b.classList.remove('hit'); }, 120); }
  });

  document.getElementById('submitBtn').addEventListener('click', trySubmit);
  document.getElementById('overlay').addEventListener('click', function (e) { if (e.target.id === 'overlay') closeModal(); });
  render();
  // Handy for local tests only (dev/browser-test.js); harmless on the live page.
  window.__rio = { buildSubmission: buildSubmission, openGraph: openGraph, view: function () { return G.view; } };
};
</script>
<script>
/* Loader. No ?date= opens Rio's home screen (calendar, scores, skills). ?date=YYYY-MM-DD fetches that
   day's questions-only test. Every call omits cookies. */
(function () {
  'use strict';
  var app = document.getElementById('app');
  function tokyoToday() {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) { return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10); }
  }
  var requested = '';
  try { requested = (new URLSearchParams(location.search).get('date') || '').trim(); } catch (e) {}
  var baseUrl = location.origin + location.pathname;
  function node(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
  function showLoading() {
    app.innerHTML = '';
    var box = node('div', 'loading'); box.appendChild(node('div', 'spin')); box.appendChild(node('div', '', 'Loading your math practice…'));
    app.appendChild(box);
  }
  function showError(msg) {
    app.innerHTML = '';
    var h = node('header', 'top'); h.appendChild(node('h1', '', 'Math practice')); app.appendChild(h);
    var c = node('div', 'card error');
    c.appendChild(node('p', '', '😕 ' + msg));
    c.appendChild(node('p', 'muted', 'Check the internet connection and try again.'));
    var b = node('button', 'btn', 'Try again'); b.type = 'button'; b.addEventListener('click', load);
    var a = node('div', 'actions'); a.style.margin = '6px 0 14px'; a.appendChild(b); c.appendChild(a);
    app.appendChild(c);
  }
  function load() {
    showLoading();
    var url = RIO_API_URL + '?format=json&date=' + encodeURIComponent(requested);
    rioFetchJSON(url, { method: 'GET' }, 45000).then(function (res) {
      if (!res || (!res.test && !res.error)) throw new Error('The math server sent something unexpected.');
      DATA = {
        mode: 'test',
        test: res.test || null,
        error: res.error || null,
        requested: requested,
        today: res.today || tokyoToday(),
        recent: Array.isArray(res.recent) ? res.recent : [],
        baseUrl: baseUrl
      };
      document.title = DATA.test ? ('Math practice ' + DATA.test.date) : 'Math practice';
      app.innerHTML = '';
      window.__rioStart();
    }).catch(function (e) { showError(String(e && e.message || e)); });
  }
  function startHome(rio, day) {
    DATA = {
      mode: 'home',
      test: null,
      error: null,
      requested: '',
      today: day || tokyoToday(),
      recent: [],
      rio: rio,
      baseUrl: baseUrl
    };
    document.title = "Rio's math";
    app.innerHTML = '';
    window.__rioStart();
  }
  function loadHome() {
    showLoading();
    rioFetchJSON(RIO_API_URL + '?format=json&api=rio', { method: 'GET' }, 45000).then(function (res) {
      var inbox = (res && res.ok === true && res.api === 'rio') ? res : null;
      startHome(inbox, (inbox && inbox.today) || tokyoToday());
    }, function () { startHome(null, tokyoToday()); });
  }
  if (requested) load(); else loadHome();
})();
</script>
