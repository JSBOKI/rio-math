      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // Must mirror fieldsForPart_() in Code.gs
  function fieldsForPart(p) {
    if (p.type === 'info') return [];
    if (p.type === 'paper') return [{ id: p.id + '-notes', label: 'Notes (optional)', type: 'paper' }];
    if (p.fields && p.fields.length) return p.fields;
    return [{ id: p.id, label: '', type: p.type || 'long' }];
  }
  function allFields() {
    var out = [];
    (test.questions || []).forEach(function (q) { if (lockedQ[q.id]) return; (q.parts || []).forEach(function (p) {
      fieldsForPart(p).forEach(function (f) { out.push(f); });
    }); });
    return out;
  }
  function prettyDate(iso) {
    var p = iso.split('-');
    var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2], 12));
    return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
  }

  function saveDraft() {
    if (!storeKey) return;
    localStorage.setItem(storeKey, JSON.stringify({ answers: answers, photos: photos, graphs: graphs, scratchOn: scratchOn }));
    updateProgress();
  }

  function table(t) {
    if (!t || !t.columns) return null;
    return el('table', { class: 'vals' }, [
      el('thead', null, [el('tr', null, t.columns.map(function (c) { return el('th', { text: c }); }))]),
      el('tbody', null, (t.rows || []).map(function (r) {
        return el('tr', null, r.map(function (c) { return el('td', { text: c }); }));
      }))
    ]);
  }

  function fieldEl(f) {
    var wrap = el('div', { class: 'field' });
    var inputId = 'f-' + f.id;
    if (f.type === 'choice') {
      if (f.label) wrap.appendChild(el('label', { text: f.label }));
      var box = el('div', { class: 'choices', role: 'group' });
      (f.options || []).forEach(function (opt) {
        var b = el('button', { type: 'button', 'aria-pressed': String(answers[f.id] === opt), text: opt });
        b.addEventListener('click', function () {
          answers[f.id] = answers[f.id] === opt ? '' : opt;
          Array.prototype.forEach.call(box.children, function (c) { c.setAttribute('aria-pressed', String(answers[f.id] === c.textContent)); });
          wrap.classList.toggle('filled', !!answers[f.id]);
          saveDraftSafe();
        });
        box.appendChild(b);
      });
      wrap.appendChild(box);
    } else {
      if (f.label) wrap.appendChild(el('label', { for: inputId, text: f.label }));
      var isLong = f.type === 'long' || f.type === 'paper';
      var input = isLong
        ? el('textarea', { id: inputId, rows: f.type === 'paper' ? '2' : '4', placeholder: f.type === 'paper' ? 'Anything you want to say about your graph' : 'Type your answer and show your work\u2026' })
        : el('input', { id: inputId, type: 'text', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: 'Your answer' });
      if (f.type === 'paper') input.style.minHeight = '70px';
      input.value = answers[f.id] || '';
      input.addEventListener('input', function () {
        answers[f.id] = input.value;
        wrap.classList.toggle('filled', !!input.value.trim());
        saveDraftSafe();
      });
      if (f.suffix) wrap.appendChild(el('div', { class: 'row' }, [input, el('span', { class: 'suffix', text: f.suffix })]));
      else wrap.appendChild(input);
    }
    wrap.classList.toggle('filled', !!(answers[f.id] || '').trim());
    return wrap;
  }

  function resizeImage(file, cb) {
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 1600, w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
        var c = document.createElement('canvas');
        c.width = Math.round(w * s); c.height = Math.round(h * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        cb(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function () { alertModal('\uD83D\uDE15', 'Hmm', 'That picture could not be opened. Try taking the photo again.'); };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function pictureCount() {
    var n = 0;
    Object.keys(photos).forEach(function (k) { n += (photos[k] || []).length; });
    Object.keys(graphs).forEach(function (k) { if (graphs[k]) n++; });
    Object.keys(scratchOn).forEach(function (k) { if (scratchOn[k] && test && RioScratch.has(test.date, k)) n++; });
    return n;
  }
  function tooManyPictures() {
    alertModal('\uD83D\uDDBC\uFE0F', 'That\'s a lot of pictures', 'You can send up to ' + MAX_PICTURES + ' pictures (photos, graphs, and scratch paper) at once. Remove one first.');
  }

  function paperEl(p) {
    var box = el('div', { class: 'paper' }, [
      el('div', { class: 'big', text: '\u270F\uFE0F Do this one on graph paper, or use the graph tool.' }),
      el('div', { class: 'muted', text: 'Add a photo of your paper, or put your graph from the tool in your answer. (Optional)' })
    ]);
    var thumbs = el('div', { class: 'thumbs' });
    function drawThumbs() {
      thumbs.innerHTML = '';
      (photos[p.id] || []).forEach(function (src, i) {
        thumbs.appendChild(el('div', { class: 'thumb' }, [
          el('img', { src: src, alt: 'Photo ' + (i + 1) }),
          el('button', { type: 'button', 'aria-label': 'Remove photo', text: '\u00D7', onclick: function () {
            photos[p.id].splice(i, 1); saveDraftSafe(); drawThumbs();
          } })
        ]));
      });
    }
    var fileInput = el('input', { type: 'file', accept: 'image/*' });
    fileInput.addEventListener('change', function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      fileInput.value = '';
      if (pictureCount() >= MAX_PICTURES) { tooManyPictures(); return; }
      resizeImage(f, function (dataUrl) {
        (photos[p.id] = photos[p.id] || []).push(dataUrl);
        saveDraftSafe(); drawThumbs();
      });
    });
    box.appendChild(el('div', { class: 'paper-btns' }, [
      el('button', { type: 'button', class: 'photo-btn graph', text: '\uD83D\uDCC8 Open graph tool', onclick: function () { openGraph(p.id); } }),
      el('label', { class: 'photo-btn' }, ['\uD83D\uDCF7 Add a photo', fileInput])
    ]));
    var att = el('div', { class: 'graph-att', id: 'graph-att-' + p.id });
    function drawAttached() {
      att.innerHTML = '';
      var g = graphs[p.id];
      if (!g) return;
      var src = null;
      try { src = graphPNG(g, graphTitle(p.id)); } catch (e) {}
      att.appendChild(el('div', { class: 'att-head', text: '\uD83D\uDCC8 Your graph is in your answer' }));
      if (src) att.appendChild(el('img', { src: src, alt: 'Your graph for ' + graphTitle(p.id) }));
      att.appendChild(el('div', { class: 'att-desc', text: M.describeGraph(g).split('\n').slice(1).join('\n') }));
      att.appendChild(el('div', { class: 'paper-btns' }, [
        el('button', { type: 'button', class: 'photo-btn graph', text: '\u270F\uFE0F Change graph', onclick: function () { openGraph(p.id); } }),
        el('button', { type: 'button', class: 'photo-btn', text: '\uD83D\uDDD1\uFE0F Take it out', onclick: function () {
          delete graphs[p.id]; saveDraftSafe(); drawAttached();
        } })
      ]));
    }
    paperRefresh[p.id] = drawAttached;
    box.appendChild(att);
    box.appendChild(thumbs);
    drawThumbs();
    drawAttached();
    return box;
  }
  function saveDraftSafe() {
    try { saveDraft(); } catch (e) { // photos may be too big for localStorage; keep answers (and graph settings) at least
      store(storeKey, JSON.stringify({ answers: answers, photos: {}, graphs: graphs, scratchOn: scratchOn })); updateProgress();
    }
  }

  function tableText(t) {
    if (!t || !t.columns) return '';
    var lines = [t.columns.join('  |  ')];
    (t.rows || []).forEach(function (r) { lines.push((r || []).join('  |  ')); });
    return lines.join('\n');
  }
  function scratchHeading(q, p) {
    var h = 'Question ' + q.number;
    if (p && p.label) h += ' \u00B7 ' + p.label;
    if (q.title) h += ' \u2014 ' + q.title;
    return h;
  }
  function scratchText(q, p) {
    var bits = [];
    if (q.prompt) bits.push(q.prompt);
    var qt = tableText(q.table); if (qt) bits.push(qt);
    if (p && p.prompt) bits.push((p.label ? p.label + '. ' : '') + p.prompt);
    var pt = p ? tableText(p.table) : ''; if (pt) bits.push(pt);
    return bits.join('\n\n');
  }
  function scratchSlot(q, p) {
    var id = p ? p.id : ('q' + q.number);
    var btn = el('button', { type: 'button', class: 'scratch-open', 'data-scratch': id, text: '\uD83D\uDCDD Scratch paper' });
    var row = el('div', { id: 'scratch-att-' + id });
    function paint() {
      var saved = test && RioScratch.has(test.date, id);
      btn.textContent = saved ? '\uD83D\uDCDD Scratch paper \u00B7 saved' : '\uD83D\uDCDD Scratch paper';
      btn.classList.toggle('has', !!saved);
      row.innerHTML = '';
      row.className = '';
      if (scratchOn[id] && !saved) { delete scratchOn[id]; saveDraftSafe(); }
      if (!(scratchOn[id] && saved)) return;
      var jpeg = null;
      try { jpeg = RioScratch.exportJpeg(test.date, id); } catch (e) {}
      row.className = 'scratch-att';
      row.appendChild(el('div', { class: 'att-head', text: '\uD83D\uDCDD Scratch paper is in your answer' }));
      if (jpeg) row.appendChild(el('img', { src: jpeg, alt: 'Scratch paper for ' + scratchHeading(q, p) }));
      row.appendChild(el('button', { type: 'button', class: 'photo-btn', text: 'Take it out', onclick: function () {
        delete scratchOn[id]; saveDraftSafe(); paint();
      } }));
    }
    btn.addEventListener('click', function () {
      RioScratch.open({
        date: test.date,
        id: id,
        heading: scratchHeading(q, p),
        text: scratchText(q, p),
        attached: !!scratchOn[id],
        onAttach: function () {
          if (scratchOn[id]) return true;
          if (!RioScratch.has(test.date, id)) return false;
          if (pictureCount() >= MAX_PICTURES) { tooManyPictures(); return false; }
          scratchOn[id] = true;
          saveDraftSafe();
          return true;
        },
        onDetach: function () { delete scratchOn[id]; saveDraftSafe(); },
        onClose: paint
      });
    });
    paint();
    return el('div', { class: 'scratch-slot' }, [btn, row]);
  }

  function render() {
    RioInbox.mount(app);   // header strip: messages from Dad, tokens, certificates (stays hidden if the backend doesn't have it)
    if (DATA && DATA.mode === 'quiz') {
      document.body.classList.add('is-home');
      document.getElementById('bar').hidden = true;
      RioQuiz.mount(app, { skill: DATA.quiz || '', today: DATA.today, baseUrl: DATA.baseUrl || '' });
      return;
    }
    if (DATA && DATA.mode === 'home') {
      document.body.classList.add('is-home');
      document.getElementById('bar').hidden = true;
      RioHome.mount(app, { today: DATA.today, baseUrl: DATA.baseUrl || '', rio: DATA.rio || null, recent: DATA.recent || [] });
      return;
    }
    if (!test) {
      var homeLink = DATA.baseUrl ? String(DATA.baseUrl).split('?')[0] : '';
      app.appendChild(el('header', { class: 'top' }, [
        isBonus && homeLink ? el('a', { class: 'back-home', href: homeLink, text: '\uD83C\uDFE0 Home' }) : null,
        el('h1', { text: isBonus ? '\u2B50 Bonus round' : 'Math practice' })]));
      app.appendChild(el('div', { class: 'card error' }, [
        el('p', { text: '\uD83D\uDE34 ' + (DATA.error || (isBonus ? 'This bonus round is not ready yet.' : 'No test is ready yet.')) }),
        el('p', { class: 'muted', text: isBonus ? 'Bonus rounds show up after Dad checks your test. Use the link in Dad\'s email, or try again a bit later.'
          : 'New tests show up every morning around 7:30. Check the link in today\'s email.' })
      ]));
      if (!isBonus) app.appendChild(otherDays());
      return;
    }
    if (isBonus) {
      document.body.classList.add('is-bonus');
      ((bonusState && bonusState.items) || []).forEach(function (it) { if (it && (it.status === 'correct' || it.status === 'wrong')) lockedQ[it.id] = true; });
    }
    try {
      var saved = JSON.parse(load(storeKey) || 'null');
      if (saved) { answers = saved.answers || {}; photos = saved.photos || {}; graphs = saved.graphs || {}; scratchOn = saved.scratchOn || {}; }
    } catch (e) {}

    (test.questions || []).forEach(function (q) { (q.parts || []).forEach(function (p) {
      partById[p.id] = { part: p, q: q };
      fieldsForPart(p).forEach(function (f) {
        fieldInfo[f.id] = String(q.number) + (p.label || '') + (f.label ? ' \u00B7 ' + f.label : '');
      });
    }); });
    Object.keys(graphs).forEach(function (pid) { if (!partById[pid] || !graphs[pid] || !graphs[pid].axes) delete graphs[pid]; });

    var homeUrl = DATA.baseUrl ? String(DATA.baseUrl).split('?')[0] : '';
    app.appendChild(el('header', { class: 'top' }, [
      homeUrl ? el('a', { class: 'back-home', href: homeUrl, text: '\uD83C\uDFE0 Home' }) : null,
      el('h1', { text: isBonus ? '\u2B50 Bonus round' : (test.title || 'Math practice') }),
      el('div', { class: 'date', text: '\uD83D\uDCC5 ' + (isBonus ? 'For your test on ' : '') + prettyDate(test.date) }),
      test.instructions ? el('div', { class: 'instructions', text: test.instructions }) : null
    ]));
    if (isBonus) app.appendChild(bonusSummary());

    app.appendChild(el('div', { class: 'sent-banner', id: 'sentBanner' }));
    var last = load('rio-math-sent-' + tag);
    if (last) showSentBanner(last);

    var nameInput = el('input', { type: 'text', id: 'name', autocomplete: 'name', value: load('rio-math-name') || 'Rio' });
    nameInput.addEventListener('input', function () { store('rio-math-name', nameInput.value); });
    app.appendChild(el('div', { class: 'card' }, [el('div', { class: 'stamp' }, [
      el('div', null, [el('label', { for: 'name', text: 'Your name' }), nameInput]),
      el('div', null, [el('label', { text: 'Today' }), el('div', { style: 'padding:12px 0;font-weight:700', text: DATA.today })])
    ]), el('div', { style: 'height:10px' })]));

    (test.questions || []).forEach(function (q) {
      var card = el('section', { class: 'card' + (lockedQ[q.id] ? ' bonus-locked' : ''), id: 'q' + q.number }, [
        el('div', { class: 'qhead' }, [el('div', { class: 'qnum', text: String(q.number) }), el('div', { class: 'qtitle', text: q.title || ('Question ' + q.number) }),
          isBonus ? bonusBadge(q) : null]),
        q.prompt ? el('div', { class: 'qprompt', text: q.prompt }) : null,
        table(q.table)
      ]);
      (q.parts || []).forEach(function (p) {
        var partEl = el('div', { class: 'part', id: 'p-' + p.id }, [
          el('div', null, [p.label ? el('span', { class: 'plabel', text: p.label }) : null, el('span', { class: 'pprompt', text: p.prompt || '' })]),
          table(p.table)
        ]);
        partEl.appendChild(scratchSlot(q, p));
        if (p.type === 'info') partEl.appendChild(el('div', { class: 'info', text: 'Nothing to type here \u2014 just read it.' }));
        if (p.type === 'paper') partEl.appendChild(paperEl(p));
        fieldsForPart(p).forEach(function (f) { partEl.appendChild(fieldEl(f)); });
        card.appendChild(partEl);
      });
      if (!(q.parts || []).length) card.appendChild(scratchSlot(q, null));
      if (lockedQ[q.id]) Array.prototype.forEach.call(card.querySelectorAll('input, textarea, .choices button'), function (n) { n.disabled = true; });
      app.appendChild(card);
    });
    if (!isBonus) app.appendChild(otherDays());
    document.getElementById('bar').hidden = false;
    if (isBonus && bonusState && bonusState.open === false) document.getElementById('submitBtn').hidden = true;
    updateProgress();
  }

  /* ---- bonus round helpers (statuses/points come from the server; answers never do) ---- */
  function ptsText(x) {
    x = Math.round(Number(x || 0) * 100) / 100;
    var whole = Math.floor(x), frac = Math.round((x - whole) * 100) / 100;
    if (frac === 0.5) return (whole ? String(whole) : '') + '\u00BD';
    return String(x);
  }
  function bonusEach() { return Number(bonusState && bonusState.pointsEach) || Number(test && test.pointsEach) || 0.5; }
  function bonusStatusOf(id) {
    var it = ((bonusState && bonusState.items) || []).filter(function (x) { return x && x.id === id; })[0];
    return it ? it.status : 'open';
  }
  function bonusBadge(q) {
    var st = bonusStatusOf(q.id);
    if (st === 'correct') return el('div', { class: 'bonus-badge st-correct', text: '\u2705 Right! +' + ptsText(bonusEach()) });
    if (st === 'wrong') return el('div', { class: 'bonus-badge st-wrong', text: '\u274C Not quite' });
    return null;
  }
  function whenText(iso) {
    try {
      return new Date(iso).toLocaleString('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Tokyo' });
    } catch (e) { return ''; }
  }
  function bonusSummary() {
    var s = bonusState || {}, n = (test.questions || []).length, each = bonusEach();
    var right = 0, wrong = 0;
    (test.questions || []).forEach(function (q) { var st = bonusStatusOf(q.id); if (st === 'correct') right++; else if (st === 'wrong') wrong++; });
    var open = n - right - wrong;
    var kids = [el('div', { class: 'bonus-big', text: n + ' question' + (n === 1 ? '' : 's') + ' \u00B7 +' + ptsText(each) + ' point each' })];
    if (right + wrong) {
      kids.push(el('div', { class: 'bonus-res', id: 'bonusResult', text: '\u2705 ' + right + ' right (+' + ptsText(right * each) + ')' +
        (wrong ? ' \u00B7 \u274C ' + wrong + ' not quite' : '') + (open ? ' \u00B7 \u23F3 ' + open + ' not checked yet' : '') }));
      if (s.baseScore != null && s.scoreWithBonus != null) {
        kids.push(el('div', { class: 'bonus-line', text: 'Your score for that test: ' + ptsText(s.baseScore) + ' \u2192 ' + ptsText(s.scoreWithBonus) + ' / ' + s.testTotal }));
      }
    } else if (s.submitted) {
      kids.push(el('div', { class: 'bonus-line', id: 'bonusResult', text: '\u2705 Sent' + (s.submittedAt ? ' ' + whenText(s.submittedAt) : '') + '. Dad will check it soon.' }));
    } else {
      kids.push(el('div', { class: 'bonus-line', text: 'Get all ' + n + ' right for +' + ptsText(n * each) + ' point' + (n * each === 1 ? '' : 's') + '.' }));
    }
    if (s.open === false) kids.push(el('div', { class: 'bonus-finished', text: '\uD83C\uDF89 This bonus round is finished. Great job trying it!' }));
    return el('div', { class: 'card bonus-summary', id: 'bonusSummary' }, kids);
  }

  function otherDays() {
    var dates = DATA.recent || [];
    if (dates.length < 2 && test) return el('div');
    var sel = el('select', { 'aria-label': 'Other days' }, [el('option', { value: '', text: 'Pick a day\u2026' })].concat(
      dates.map(function (d) { return el('option', { value: d, text: d + (test && d === test.date ? ' (this one)' : '') }); })));
    sel.addEventListener('change', function () {
      if (sel.value && DATA.baseUrl) window.top.location.href = DATA.baseUrl + '?date=' + encodeURIComponent(sel.value);
    });
    return el('div', { class: 'card other-days' }, [el('p', null, ['Other days\' tests: ', sel])]);
  }

  function counts() {
    var fields = allFields();
    var done = fields.filter(function (f) { return (answers[f.id] || '').trim(); }).length;
    var required = fields.filter(function (f) { return f.type !== 'paper'; });
    var blanks = required.filter(function (f) { return !(answers[f.id] || '').trim(); });
    return { done: done, total: fields.length, blanks: blanks, requiredTotal: required.length };
  }
  function updateProgress() {
    var c = counts();
    var reqDone = c.requiredTotal - c.blanks.length;
    document.getElementById('progressTxt').textContent = reqDone + ' of ' + c.requiredTotal + ' boxes filled';
    document.getElementById('progressFill').style.width = (c.requiredTotal ? Math.round(100 * reqDone / c.requiredTotal) : 0) + '%';
  }

  function openModal(children) {
    var m = document.getElementById('modal');
    m.innerHTML = '';
    children.forEach(function (c) { if (c) m.appendChild(c); });
    document.getElementById('overlay').classList.add('show');
  }
  function closeModal() { document.getElementById('overlay').classList.remove('show'); }
  function alertModal(emoji, title, msg) {
    openModal([el('div', { class: 'emoji', text: emoji }), el('h2', { text: title }), el('p', { text: msg }),
      el('div', { class: 'actions' }, [el('button', { class: 'btn', type: 'button', text: 'OK', onclick: closeModal })])]);
  }

  function showSentBanner(when) {
    var b = document.getElementById('sentBanner');
    if (!b) return;
    b.textContent = '\u2705 Sent at ' + when + '. You can fix answers and press Submit again \u2014 the newest one counts.';
    b.classList.add('show');
  }

  function trySubmit() {
    var c = counts();
    if (c.blanks.length) {
      var first = c.blanks[0];
      openModal([
        el('div', { class: 'emoji', text: '\uD83E\uDD14' }),
        el('h2', { text: c.blanks.length + ' box' + (c.blanks.length === 1 ? ' is' : 'es are') + ' empty' }),
        el('p', { text: 'Do you want to go back and try them, or send it now?' }),
        el('div', { class: 'actions' }, [
          el('button', { class: 'btn secondary', type: 'button', text: 'Go back', onclick: function () {
            closeModal();
            var n = document.getElementById('f-' + first.id) || document.querySelector('[id="f-' + first.id + '"]');
            var target = n || document.body;
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            if (n && n.focus) setTimeout(function () { n.focus(); }, 400);
          } }),
          el('button', { class: 'btn', type: 'button', text: 'Send it', onclick: function () { closeModal(); doSubmit(); } })
        ])
      ]);
    } else {
      doSubmit();
    }
  }

  /** Answers + pictures exactly as they are sent. Graph-tool graphs go in as a PNG "photo" of their part
   *  (same path as camera photos, first so the 8-picture limit never drops them) plus a text description
   *  appended to that part's notes answer, so the grader can read the settings without opening the picture.
   *  Attached scratch-paper drawings go next, as a JPEG of that problem, on the same photo path. */
  function scratchJpegBytes(url) {
    var b64 = String(url || '').split(',')[1] || '';

  }

    AXIS_KEYS.forEach(function (k) {
      var inp = $('ax-' + k);
      inp.addEventListener('input', function () { G.ws.axesText[k] = inp.value; applyAxes(); saveWs(); });
    });
    ['x', 'y', '=', '(', ')', '/', '-', ',', '.'].forEach(function (ch) {
      var b = el('button', { type: 'button', text: ch === '-' ? '\u2212' : ch, 'aria-label': 'Type ' + ch });
      b.addEventListener('mousedown', function (e) { e.preventDefault(); });   // keep the text box focused
      b.addEventListener('click', function () {
        var inp = $('gInput'), v = inp.value;
        var s = typeof inp.selectionStart === 'number' ? inp.selectionStart : v.length, e2 = typeof inp.selectionEnd === 'number' ? inp.selectionEnd : v.length;
        var add = ch === '=' ? ' = ' : ch === ',' ? ', ' : ch;
        inp.value = v.slice(0, s) + add + v.slice(e2);
        try { inp.setSelectionRange(s + add.length, s + add.length); } catch (x) {}
      });
      $('gKeys').appendChild(b);
    });
    $('gAdd').addEventListener('click', addItem);
    [$('gInput'), $('gLabel')].forEach(function (inp) {
      inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); addItem(); } });
    });
    $('gResetAxes').addEventListener('click', function () { setAxesText(axesToText(DEFAULT_AXES)); });
    $('gSuggest').addEventListener('click', function () { var s = G.part && M.suggestedAxes(G.part.prompt); if (s) setAxesText(axesToText(s)); });
    $('gClear').addEventListener('click', function () {
      if (!G.ws.items.length) return;
      G.ws.items = []; G.tap = null; saveWs(); renderList(); drawScreen(); addMsg('Cleared. The axes are still the same.', false);
    });
    $('gCanvas').addEventListener('click', onCanvasTap);
    $('gUse').addEventListener('click', useGraph);
    window.addEventListener('resize', function () { if (currentTool === 'graph') drawScreen(); });
  }

  function openGraph(partId) {
    var info = partId ? partById[partId] : null;
    ensureGraphReady();
    G.part = info ? info.part : null;
    G.mode = info ? info.part.id : 'free';
    G.ws = loadWs(G.mode, G.part);
    G.tap = null;
    AXIS_KEYS.forEach(function (k) { $('ax-' + k).value = G.ws.axesText[k] == null ? '' : G.ws.axesText[k]; });
    var tgt = $('gTarget');
    tgt.innerHTML = '';
    if (info) {
      tgt.appendChild(el('b', { text: '\u270F\uFE0F For question ' + info.q.number + (info.part.label || '') + ': ' }));
      tgt.appendChild(document.createTextNode(info.part.prompt || ''));
    }
    show(tgt, !!info);
    show($('gSuggest'), !!(G.part && M.suggestedAxes(G.part.prompt)));
    $('gUse').textContent = info && graphs[info.part.id] ? '\u2705 Update the graph in my answer' : '\u2705 Use this graph in my answer';
    $('gFootNote').textContent = info ? 'The picture and the settings go in with your answer for ' + info.q.number + (info.part.label || '') + '.' : '';
    addMsg('', false);
    applyAxes(true);
    renderList();
    openTool('graph');
  }

  function setAxesText(t) {
    G.ws.axesText = t;
    AXIS_KEYS.forEach(function (k) { $('ax-' + k).value = t[k]; });
    applyAxes(); saveWs();
  }
  function applyAxes(noDraw) {
    var r = M.validateAxes(G.ws.axesText), msg = $('gAxisMsg');
    AXIS_KEYS.forEach(function (k) { $('ax-' + k).classList.toggle('bad', !!r.bad[k]); });
    G.axesOk = r.ok;
    if (r.ok) { G.axes = r.axes; msg.hidden = true; }
    else {
      msg.innerHTML = '';
      r.errors.forEach(function (e) { msg.appendChild(el('div', { text: '\u26A0\uFE0F ' + e })); });
      msg.appendChild(el('div', { class: 'muted', text: 'The graph shows your last good settings until this is fixed.' }));
      msg.hidden = false;
    }
    $('gUse').disabled = !r.ok;
    if (!noDraw) drawScreen();
  }

  function addMsg(text, bad) {
    var m = $('gAddMsg');
    m.textContent = text; m.classList.toggle('bad', !!bad); m.hidden = !text;
  }

  function isVisible(p, a) {
    var box = { xmin: a.xmin, xmax: a.xmax, ymin: a.ymin, ymax: a.ymax };
    if (p.kind === 'line') return !!M.clipLine(p.a, p.b, p.c, box);
    if (p.kind === 'points') return p.points.some(function (q) { return q.x >= a.xmin && q.x <= a.xmax && q.y >= a.ymin && q.y <= a.ymax; });
    return M.sampleCurve(p, box, 200).some(function (run) { return run.some(function (q) { return q[1] >= a.ymin && q[1] <= a.ymax; }); });
  }

  function addItem() {
    var inp = $('gInput'), raw = inp.value.trim(), p;
    if (!raw) { addMsg('Type something to graph first, like y = 2x + 3 or (3, 5).', true); return; }
    try { p = M.parseGraphInput(raw); } catch (e) {
      addMsg((e.friendly ? e.message : 'I couldn\'t read that.') + ' Examples: y = 2x + 3,  x = -2,  3x - y = -6,  (3, 5)', true);
      return;
    }
    if (G.ws.items.length >= 12) { addMsg('That\'s a lot! Take something off the list first (12 at most).', true); return; }
    var item = { input: raw, label: $('gLabel').value.trim().slice(0, 40), color: M.nextColor(G.ws.items) };
    G.ws.items.push(item);
    inp.value = ''; $('gLabel').value = '';
    var notes = [];
    if (p.note) notes.push('I graphed it with ' + p.note + '.');
    if (!isVisible(p, G.axes)) notes.push('It\'s outside this graph window, so change the axes to see it.');
    addMsg(notes.length ? 'Added! ' + notes.join(' ') : '', false);
    saveWs(); renderList(); drawScreen();
  }

  function renderList() {
    var ul = $('gList');
    ul.innerHTML = '';
    if (!G.ws.items.length) {
      ul.appendChild(el('li', { class: 'empty', text: 'Nothing on the graph yet. Try y = 2x + 3 or (3, 5).' }));
      return;
    }
    withParsed(G.ws.items).forEach(function (it, i) {
      var kind = it.p ? (it.p.kind === 'points' ? (it.p.points.length === 1 ? 'point' : it.p.points.length + ' points') : it.p.kind === 'curve' ? 'curve' : 'line') : 'can\'t read this one';
      ul.appendChild(el('li', null, [
        el('span', { class: 'swatch', style: 'background:' + it.color }),
        el('div', { class: 'txt' }, [el('b', { text: itemName(it) }), el('small', { text: (it.label ? it.label + ' \u00B7 ' : '') + kind + ' \u00B7 ' + M.colorName(it.color) })]),
        el('button', { type: 'button', class: 'rm', 'aria-label': 'Remove ' + itemName(it), text: '\u2715', onclick: function () {
          G.ws.items.splice(i, 1); saveWs(); renderList(); drawScreen();
        } })
      ]));
    });
  }

  function drawScreen() {
    if (!gReady || currentTool !== 'graph' || toolEl.hidden || !G.ws) return;
    var c = $('gCanvas'), wrap = $('gWrap');
    var cssW = Math.max(220, Math.floor(wrap.clientWidth - 4));
    var cssH = Math.round(Math.min(cssW * (window.innerWidth >= 760 ? 0.9 : 1), Math.max(240, window.innerHeight * 0.6)));
    var dpr = Math.min(3, window.devicePixelRatio || 1);
    c.style.height = cssH + 'px';
    c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr);
    var ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var fs = cssW < 400 ? 12 : 14;
    G.view = drawGraph(ctx, cssW, cssH, G.axes, withParsed(G.ws.items), { font: fs, lineW: 3, dot: 6 });
    var coord = $('gCoord');
    if (G.tap && G.tap.x >= G.axes.xmin && G.tap.x <= G.axes.xmax && G.tap.y >= G.axes.ymin && G.tap.y <= G.axes.ymax) {
      var X = G.view.sx(G.tap.x), Y = G.view.sy(G.tap.y);
      ctx.strokeStyle = '#1d2433'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X, Y, 9, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X - 14, Y); ctx.lineTo(X - 5, Y); ctx.moveTo(X + 5, Y); ctx.lineTo(X + 14, Y);
      ctx.moveTo(X, Y - 14); ctx.lineTo(X, Y - 5); ctx.moveTo(X, Y + 5); ctx.lineTo(X, Y + 14); ctx.stroke();
      coord.textContent = '\uD83D\uDCCD (' + uni(M.formatNumber(G.tap.x)) + ', ' + uni(M.formatNumber(G.tap.y)) + ')';
      coord.hidden = false;
    } else coord.hidden = true;
  }

  function onCanvasTap(e) {
    var v = G.view;
    if (!v) return;
    var r = $('gCanvas').getBoundingClientRect(), X = e.clientX - r.left, Y = e.clientY - r.top, a = G.axes;
    if (X < v.left - 2 || X > v.left + v.pw + 2 || Y < v.top - 2 || Y > v.top + v.ph + 2) { G.tap = null; drawScreen(); return; }
    var x = a.xmin + (X - v.left) / v.pw * (a.xmax - a.xmin), y = a.ymax - (Y - v.top) / v.ph * (a.ymax - a.ymin);
    var gx = Math.round(x / a.xstep) * a.xstep, gy = Math.round(y / a.ystep) * a.ystep;
    var rx = Math.min(12, 0.3 * v.pw * a.xstep / (a.xmax - a.xmin)), ry = Math.min(12, 0.3 * v.ph * a.ystep / (a.ymax - a.ymin));
    if (Math.abs(v.sx(gx) - X) <= rx && Math.abs(v.sy(gy) - Y) <= ry) { x = gx; y = gy; }   // snap to a grid corner
    else {
      var dx = Math.max(0, Math.min(4, Math.floor(-Math.log((a.xmax - a.xmin) / v.pw) / Math.LN10)));
      var dy = Math.max(0, Math.min(4, Math.floor(-Math.log((a.ymax - a.ymin) / v.ph) / Math.LN10)));
      x = Math.round(x * Math.pow(10, dx)) / Math.pow(10, dx); y = Math.round(y * Math.pow(10, dy)) / Math.pow(10, dy);
    }
    G.tap = { x: Math.max(a.xmin, Math.min(a.xmax, x)), y: Math.max(a.ymin, Math.min(a.ymax, y)) };
    drawScreen();
  }

  function useGraph() {
    if (!G.part) return;
    if (!G.axesOk) { addMsg('Fix the axes first (see the red message).', true); return; }
    if (!G.ws.items.length) { addMsg('Add at least one line or point first, then press the green button.', true); return; }
    var pid = G.part.id;
    if (!graphs[pid] && pictureCount() >= MAX_PICTURES) { closeTool(); tooManyPictures(); return; }
    graphs[pid] = {
      axes: { xmin: G.axes.xmin, xmax: G.axes.xmax, xstep: G.axes.xstep, ymin: G.axes.ymin, ymax: G.axes.ymax, ystep: G.axes.ystep },
      items: G.ws.items.map(function (it) { return { input: it.input, label: it.label || '', color: it.color }; }),
      savedAt: new Date().toISOString()
    };
    saveDraftSafe();
    if (paperRefresh[pid]) paperRefresh[pid]();
    closeTool();
    var att = $('graph-att-' + pid);
    if (att) { att.scrollIntoView({ block: 'center' }); flashEl(att.querySelector('img') || att); }
  }

  /* ------------------------------ calculator ------------------------------ */
  var C = { expr: '', done: false, ans: '', frac: null, error: '' };
  var calcBuilt = false;
  var CALC_KEYS = [
    ['C', 'clear', 'fn', 'Clear'], ['\u232B', 'back', 'fn', 'Backspace'], ['(', '(', ''], [')', ')', ''], ['\u00F7', '\u00F7', 'op', 'Divide'],
    ['x\u00B2', '\u00B2', '', 'Squared'], ['\u221A', '\u221A(', '', 'Square root'], ['^', '^', '', 'Power'], ['\u03C0', '\u03C0', '', 'Pi'], ['\u00D7', '\u00D7', 'op', 'Times'],
    ['7', '7', 'd'], ['8', '8', 'd'], ['9', '9', 'd'], ['\u00B1', 'neg', '', 'Change sign'], ['\u2212', '\u2212', 'op', 'Minus'],
    ['4', '4', 'd'], ['5', '5', 'd'], ['6', '6', 'd'], ['a/b', '/', 'small', 'Fraction bar'], ['+', '+', 'op', 'Plus'],
    ['1', '1', 'd'], ['2', '2', 'd'], ['3', '3', 'd'], ['.', '.', 'd', 'Decimal point'], ['=', 'eq', 'eq', 'Equals'],
    ['0', '0', 'd wide'], ['Ans', 'ans', 'small wide', 'Last answer']
  ];
  var calcBtns = {};

  function buildCalc() {
    if (calcBuilt) return;
    calcBuilt = true;
    CALC_KEYS.forEach(function (k) {
      var b = el('button', { type: 'button', class: k[2], text: k[0], 'aria-label': k[3] || k[0] });
      b.addEventListener('click', function () { calcPress(k[1]); });
      calcBtns[k[1]] = b;
      $('cKeys').appendChild(b);
    });
    $('cCopy').addEventListener('click', function () { var t = calcOutput(); if (t) copyText(t, $('cCopy'), '\uD83D\uDCCB Copy'); });
    $('cInsert').addEventListener('click', function () {
      var t = calcOutput();
      if (t && !insertIntoAnswer(t)) renderCalc();
    });
  }
  function ansForExpr() {
    if (!C.ans) return '';
    var a = uni(C.ans);
    return C.ans.charAt(0) === '-' ? '(' + a + ')' : a;
  }
  function calcPress(k) {
    C.error = '';
    if (k === 'clear') { C.expr = ''; C.done = false; }
    else if (k === 'back') { if (C.done) C.done = false; else C.expr = C.expr.slice(0, -1); }
    else if (k === 'eq') {
      if (!C.expr) return renderCalc();
      var open = (C.expr.match(/\(/g) || []).length - (C.expr.match(/\)/g) || []).length;
      try {
        var r = M.calc(C.expr);
        for (var i = 0; i < open; i++) C.expr += ')';
        C.ans = r.text; C.frac = r.fraction; C.done = true;
      } catch (e) { C.error = e.friendly ? e.message : 'Hmm, check that again.'; C.done = false; }
    } else if (k === 'neg') {
      if (C.done) { C.expr = C.ans.charAt(0) === '-' ? C.ans.slice(1) : '\u2212' + C.ans; C.expr = uni(C.expr); C.done = false; }
      else {
        var m = /(\d+\.?\d*|\.\d+|\u03C0)$/.exec(C.expr);
        if (!m) C.expr += '\u2212';
        else {
          var before = C.expr.slice(0, m.index), num = m[0];
          if (/\(\u2212$/.test(before)) C.expr = before.slice(0, -2) + num;
          else if (/(^|[\u00D7\u00F7\/^(])\u2212$/.test(before)) C.expr = before.slice(0, -1) + num;
          else if (before === '' || /[\u00D7\u00F7\/^(]$/.test(before)) C.expr = before + '\u2212' + num;
          else C.expr = before + '(\u2212' + num;
        }
      }
    } else {
      var s = k === 'ans' ? ansForExpr() : k;
      if (!s) return renderCalc();
      if (C.done) { C.expr = /^[+\u2212\u00D7\u00F7\/^\u00B2]/.test(s) ? ansForExpr() : ''; C.done = false; }
      if (C.expr.length < 150) C.expr += s;
    }
    renderCalc();
  }
  function calcPreview() {
    if (!C.expr || C.done) return null;
    try { return M.calc(C.expr); } catch (e) { return null; }
  }
  /** What Copy / Put-in-my-answer use: the answer after "=", or the live preview. Plain "-" minus. */
  function calcOutput() {
    if (C.done) return C.ans;
    var p = calcPreview();
    return p ? p.text : '';
  }
  function renderCalc() {
    var res = $('cRes'), pv = calcPreview();
    $('cExpr').textContent = C.expr ? C.expr + (C.done ? ' =' : '') : '';
    res.className = 'cres';
    if (C.error) { res.textContent = '\u26A0\uFE0F ' + C.error; res.classList.add('err'); }
    else if (C.done) res.textContent = uni(C.ans);
    else if (pv && /[^\d.]/.test(C.expr)) { res.textContent = '= ' + uni(pv.text); res.classList.add('preview'); }
    else res.textContent = C.expr ? '' : '0';
    var frac = C.done ? C.frac : (pv && !C.error ? pv.fraction : null);
    $('cFrac').textContent = frac ? '= ' + uni(frac) + ' as a fraction' : '';
    var out = calcOutput(), target = lastField && document.body.contains(lastField) ? fieldInfo[lastField.id.slice(2)] : '';
    $('cCopy').disabled = !out;
    $('cInsert').disabled = !out || !target;
    $('cHint').textContent = target ? 'Put in my answer \u2192 ' + target
      : 'Tip: tap an answer box first, then open the calculator, and "Put in my answer" will type the result there for you.';
  }

  document.addEventListener('keydown', function (e) {
    if (toolEl.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closeTool(); return; }
    if (currentTool !== 'calc' || e.ctrlKey || e.metaKey || e.altKey) return;
    var a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type === 'text'))) return;
    var map = { '+': '+', '-': '\u2212', '*': '\u00D7', 'x': '\u00D7', 'X': '\u00D7', '/': '/', '\u00F7': '\u00F7', '^': '^', '(': '(', ')': ')', '.': '.', ',': '.',
      'p': '\u03C0', 'P': '\u03C0', 'r': '\u221A(', 's': '\u221A(', '\u00B2': '\u00B2', 'Enter': 'eq', '=': 'eq', 'Backspace': 'back', 'Delete': 'clear', 'c': 'clear', 'C': 'clear' };
    var k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
    if (!k) return;
    e.preventDefault();
    calcPress(k);
    var b = calcBtns[k === '/' ? '/' : k];
    if (b) { b.classList.add('hit'); setTimeout(function () { b.classList.remove('hit'); }, 120); }
  });

  document.getElementById('submitBtn').addEventListener('click', trySubmit);
  document.getElementById('overlay').addEventListener('click', function (e) { if (e.target.id === 'overlay') closeModal(); });
  render();
  // Handy for local tests only (dev/browser-test.js); harmless on the live page.
  window.__rio = { buildSubmission: buildSubmission, openGraph: openGraph, view: function () { return G.view; } };
};
</script>
<script>
/* Loader. No ?date= opens Rio's home screen (calendar, scores, skills). ?date=YYYY-MM-DD fetches that
   day's questions-only test. ?quiz=skill opens a mini quiz made in the page (not a daily test).
   ?bonus=YYYY-MM-DD opens that day's bonus round (questions only + each item's status).
   Priority: quiz, then bonus, then date. Every call omits cookies. */
(function () {
  'use strict';
  var app = document.getElementById('app');
  function tokyoToday() {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) { return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10); }
  }
  var requested = '', quizSkill = '', bonusDate = '';
  try {
    var qs = new URLSearchParams(location.search);
    requested = (qs.get('date') || '').trim();
    quizSkill = (qs.get('quiz') || '').trim();
    bonusDate = (qs.get('bonus') || '').trim();
  } catch (e) {}
  var baseUrl = location.origin + location.pathname;
  function node(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
  function showLoading() {
    app.innerHTML = '';
    var box = node('div', 'loading'); box.appendChild(node('div', 'spin')); box.appendChild(node('div', '', 'Loading your math practice\u2026'));
    app.appendChild(box);
  }
  function showError(msg) {
    app.innerHTML = '';
    var h = node('header', 'top'); h.appendChild(node('h1', '', 'Math practice')); app.appendChild(h);
    var c = node('div', 'card error');
    c.appendChild(node('p', '', '\ud83d\ude15 ' + msg));
    c.appendChild(node('p', 'muted', 'Check the internet connection and try again.'));
    var b = node('button', 'btn', 'Try again'); b.type = 'button'; b.addEventListener('click', function () { retry(); });
    var a = node('div', 'actions'); a.style.margin = '6px 0 14px'; a.appendChild(b); c.appendChild(a);
    app.appendChild(c);
  }
  function load() {
    showLoading();
    var url = RIO_API_URL + '?format=json&date=' + encodeURIComponent(requested);
    rioFetchJSON(url, { method: 'GET' }, 45000).then(function (res) {
      if (!res || (!res.test && !res.error)) throw new Error('The math server sent something unexpected.');
      DATA = {
        mode: 'test',
        test: res.test || null,
        error: res.error || null,
        requested: requested,
        today: res.today || tokyoToday(),
        recent: Array.isArray(res.recent) ? res.recent : [],
        baseUrl: baseUrl
      };
      document.title = DATA.test ? ('Math practice ' + DATA.test.date) : 'Math practice';
      app.innerHTML = '';
      window.__rioStart();
    }).catch(function (e) { showError(String(e && e.message || e)); });
  }
  function startHome(rio, day) {
    DATA = {
      mode: 'home',
      test: null,
      error: null,
      requested: '',
      today: day || tokyoToday(),
      recent: [],
      rio: rio,
      baseUrl: baseUrl
    };
    document.title = "Rio's math";
    app.innerHTML = '';
    window.__rioStart();
  }
  function loadHome() {
    showLoading();
    rioFetchJSON(RIO_API_URL + '?format=json&api=rio', { method: 'GET' }, 45000).then(function (res) {
      var inbox = (res && res.ok === true && res.api === 'rio') ? res : null;
      startHome(inbox, (inbox && inbox.today) || tokyoToday());
    }, function () { startHome(null, tokyoToday()); });
  }
  function startQuiz(rio, day) {
    DATA = {
      mode: 'quiz',
      quiz: quizSkill,
      test: null,
      error: null,
      requested: '',
      today: day || tokyoToday(),
      recent: [],
      rio: rio,
      baseUrl: baseUrl
    };
    document.title = 'Mini quiz';
    app.innerHTML = '';
    window.__rioStart();
  }
  function loadQuiz() {
    showLoading();
    rioFetchJSON(RIO_API_URL + '?format=json&api=rio', { method: 'GET' }, 45000).then(function (res) {
      var inbox = (res && res.ok === true && res.api === 'rio') ? res : null;
      startQuiz(inbox, (inbox && inbox.today) || tokyoToday());
    }, function () { startQuiz(null, tokyoToday()); });
  }
  function loadBonus() {
    showLoading();
    rioFetchJSON(RIO_API_URL + '?format=json&bonus=' + encodeURIComponent(bonusDate), { method: 'GET' }, 45000).then(function (res) {
      // An older backend without bonus rounds answers with the plain test JSON (no api:'bonus').
      var isBonusApi = !!(res && res.api === 'bonus');
      DATA = {
        mode: 'bonus',
        test: isBonusApi && res.ok === true && res.bonus ? res.bonus : null,
        error: isBonusApi ? (res.error || null) : 'Bonus rounds are not turned on yet. Try again later.',
        requested: bonusDate,
        today: (res && res.today) || tokyoToday(),
        recent: [],
        bonusState: isBonusApi ? (res.state || null) : null,
        baseUrl: baseUrl
      };
      document.title = 'Bonus round' + (DATA.test ? ' ' + DATA.test.date : '');
      app.innerHTML = '';
      window.__rioStart();
    }).catch(function (e) { showError(String(e && e.message || e)); });
  }
  function retry() { if (quizSkill) loadQuiz(); else if (bonusDate) loadBonus(); else if (requested) load(); else loadHome(); }
  if (quizSkill) loadQuiz();
  else if (bonusDate) loadBonus();
  else if (requested) load();
  else loadHome();
})();
</script>
