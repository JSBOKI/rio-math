<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Math practice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f3f7ff; --card: #ffffff; --ink: #1d2433; --muted: #5b6475;
    --accent: #3867ff; --accent-dark: #2447c7; --good: #1f9d55; --warn: #d97706; --line: #d6def0;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 20px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body.tool-open { overflow: hidden; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 14px 200px; }
  header.top { background: linear-gradient(135deg, #3867ff, #7b5cff); color: #fff; border-radius: 22px;
    padding: 20px 20px 18px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(56,103,255,.25); }
  header.top h1 { margin: 0 0 4px; font-size: 1.5em; line-height: 1.2; }
  header.top .date { font-size: 1.05em; opacity: .95; }
  header.top .instructions { margin-top: 10px; font-size: .95em; background: rgba(255,255,255,.15);
    border-radius: 12px; padding: 10px 12px; }
  .card { background: var(--card); border-radius: 20px; padding: 18px 18px 8px; margin: 0 0 16px;
    box-shadow: 0 2px 8px rgba(29,36,51,.06); border: 1px solid var(--line); }
  .stamp { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .stamp label { font-weight: 600; font-size: .9em; color: var(--muted); display: block; margin-bottom: 4px; }
  .qhead { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .qnum { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.15em; }
  .qtitle { font-weight: 800; font-size: 1.1em; line-height: 1.25; }
  .qprompt { margin: 6px 0 10px; }
  body.is-bonus .qprompt, body.is-bonus .pprompt { white-space: pre-line; }
  body.is-bonus header.top { background: linear-gradient(135deg, #f59e0b, #7b5cff); }
  .bonus-summary { border: 2px dashed var(--accent); background: #f4f7ff; padding-bottom: 14px; }
  .bonus-summary .bonus-big { font-weight: 900; font-size: 1.15em; margin: 0 0 4px; }
  .bonus-summary .bonus-res { font-weight: 800; margin: 6px 0 2px; }
  .bonus-summary .bonus-line { color: var(--muted); font-weight: 600; margin-top: 4px; }
  .bonus-summary .bonus-finished { margin-top: 8px; font-weight: 800; color: #145c33; }
  .bonus-badge { margin-left: auto; flex: 0 0 auto; font-weight: 800; font-size: .8em; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .bonus-badge.st-correct { background: #e7f8ee; color: #145c33; border: 2px solid #8fd3ab; }
  .bonus-badge.st-wrong { background: #fdecec; color: #9b1c1c; border: 2px solid #f3b4b4; }
  section.card.bonus-locked input, section.card.bonus-locked textarea { background: #f3f4f7; }
  .part { border-top: 2px dashed var(--line); padding: 14px 0 12px; }
  .part:first-of-type { border-top: none; }
  .plabel { display: inline-block; min-width: 38px; padding: 2px 10px; margin-right: 6px; border-radius: 10px;
    background: #e8eeff; color: var(--accent-dark); font-weight: 800; text-align: center; }
  .pprompt { font-weight: 600; }
  .field { margin-top: 10px; }
  .field > label { display: block; font-weight: 600; color: var(--muted); font-size: .92em; margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .suffix { color: var(--muted); white-space: nowrap; }
  input[type=text], textarea { width: 100%; font: inherit; font-size: 1.05em; color: var(--ink); padding: 12px 14px;
    border: 2px solid #b9c6e6; border-radius: 14px; background: #fbfcff; outline: none; }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(56,103,255,.15); }
  textarea { min-height: 110px; resize: vertical; }
  .filled input[type=text], .filled textarea { border-color: #8fd3ab; }
  .choices { display: flex; gap: 10px; flex-wrap: wrap; }
  .choices button { font: inherit; font-weight: 700; padding: 12px 20px; border-radius: 14px; border: 2px solid #b9c6e6;
    background: #fff; color: var(--ink); cursor: pointer; min-width: 130px; }
  .choices button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .paper { background: #fff8e6; border: 2px solid #f6d58a; border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
  .paper .big { font-weight: 800; }
  .paper-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .photo-btn { display: inline-block; margin-top: 10px; font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 12px;
    background: #fff; border: 2px solid #f0c052; cursor: pointer; color: var(--ink); min-height: 48px; }
  .paper-btns .photo-btn { margin-top: 0; }
  .photo-btn.graph { border-color: var(--accent); color: var(--accent-dark); }
  .photo-btn input { display: none; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .thumb { position: relative; }
  .thumb img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 2px solid #f0c052; }
  .thumb button { position: absolute; top: -8px; right: -8px; width: 30px; height: 30px; border-radius: 50%; border: none;
    background: #d33; color: #fff; font-weight: 800; cursor: pointer; }
  .graph-att { margin-top: 10px; }
  .graph-att:empty { display: none; }
  .graph-att .att-head { font-weight: 800; color: #145c33; }
  .graph-att img { display: block; width: 100%; max-width: 360px; border-radius: 12px; border: 3px solid #8fd3ab; background: #fff; margin: 6px 0; }
  .graph-att .att-desc { white-space: pre-wrap; font-size: .8em; line-height: 1.4; background: #fff; border-radius: 10px;
    padding: 8px 10px; margin: 6px 0; border: 1px solid #f0dca6; overflow-wrap: anywhere; }
  table.vals { border-collapse: collapse; margin: 8px 0 12px; font-variant-numeric: tabular-nums; }
  table.vals th, table.vals td { border: 2px solid var(--line); padding: 6px 16px; text-align: center; }
  table.vals th { background: #eef2ff; }
  .info { color: var(--muted); font-style: italic; margin-top: 6px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.97); border-top: 1px solid var(--line);
    padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(29,36,51,.08); z-index: 5; }
  .bar-inner { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .tools { display: flex; gap: 8px; width: 100%; }
  .tool-btn { flex: 1 1 0; font: inherit; font-weight: 800; font-size: .92em; min-height: 46px; padding: 6px 10px; border-radius: 14px;
    border: 2px solid #c5d3fb; background: #eef2ff; color: var(--accent-dark); cursor: pointer; white-space: nowrap; touch-action: manipulation; }
  .tool-btn:active { background: #dbe4ff; }
  .progress { flex: 1; min-width: 0; }
  .progress .txt { font-size: .85em; color: var(--muted); font-weight: 600; }
  .progress .track { height: 12px; background: #e3e8f5; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .progress .fill { height: 100%; width: 0; background: linear-gradient(90deg, #34c77b, #1f9d55); transition: width .3s; }
  .btn { font: inherit; font-weight: 800; font-size: 1.05em; padding: 14px 26px; border-radius: 16px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(56,103,255,.3); touch-action: manipulation; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.secondary { background: #fff; color: var(--accent-dark); border: 2px solid var(--accent); box-shadow: none; }
  .btn.good { background: var(--good); box-shadow: 0 4px 12px rgba(31,157,85,.3); }
  .overlay { position: fixed; inset: 0; background: rgba(20,26,40,.55); display: none; align-items: center; justify-content: center;
    padding: 18px; z-index: 30; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 24px; padding: 26px 22px; max-width: 460px; width: 100%; text-align: center; }
  .modal h2 { margin: 0 0 8px; font-size: 1.6em; }
  .modal .emoji { font-size: 3.2em; line-height: 1; margin-bottom: 8px; }
  .modal .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .sent-banner { display: none; background: #e7f8ee; border: 2px solid #8fd3ab; color: #145c33; border-radius: 16px;
    padding: 12px 14px; margin-bottom: 16px; font-weight: 700; }
  .sent-banner.show { display: block; }
  .error { background: #fff1f0; border: 2px solid #f5b5ae; color: #8a1c12; }
  .other-days { font-size: .9em; color: var(--muted); }
  .other-days select { font: inherit; font-size: 1em; padding: 6px 8px; border-radius: 10px; }
  .muted { color: var(--muted); }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 6px rgba(31,157,85,.45); border-color: var(--good); } 100% { box-shadow: none; } }

  /* ---------- tool popups (graph + calculator) ---------- */
  .tool-overlay { position: fixed; inset: 0; z-index: 20; background: rgba(20,26,40,.55); display: flex;
    align-items: center; justify-content: center; }
  .tool-overlay[hidden] { display: none; }
  .toolbox { background: #fff; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .toolhead { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 12px;
    border-bottom: 1px solid var(--line); background: #f7f9ff; }
  .tabs { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .tab { flex: 1 1 0; position: relative; min-width: 0; }
  .tab input { position: absolute; opacity: 0; pointer-events: none; }
  .tab span { display: flex; align-items: center; justify-content: center; min-height: 50px; padding: 4px 6px; border-radius: 14px;
    border: 2px solid #b9c6e6; background: #fff; font-weight: 800; font-size: .88em; cursor: pointer; white-space: nowrap;
    touch-action: manipulation; overflow: hidden; }
  .tab input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab input:focus-visible + span { outline: 3px solid rgba(56,103,255,.45); outline-offset: 2px; }
  .close-x { flex: 0 0 auto; min-width: 54px; min-height: 54px; padding: 0 14px; border-radius: 14px; border: none; background: #1d2433;
    color: #fff; font: inherit; font-weight: 800; font-size: 1.05em; cursor: pointer; touch-action: manipulation; }
  .close-x .wide-only { display: none; }
  .toolbody { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; overscroll-behavior: contain; }
  .toolfoot { flex: 0 0 auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #f7fff9; }
  .toolfoot .btn { width: 100%; }
  .toolfoot .muted { font-size: .8em; text-align: center; margin-top: 4px; }
  .gtarget { background: #fff8e6; border: 2px solid #f6d58a; border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; font-size: .9em; }
  .glayout { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .canvas-wrap { position: relative; width: 100%; }
  .canvas-wrap canvas { display: block; width: 100%; border-radius: 12px; border: 2px solid var(--line); touch-action: manipulation; cursor: crosshair; background: #fff; }
  .gbelow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 40px; margin-top: 6px; }
  .gbelow .hint { margin-top: 0; }
  .coord { background: #1d2433; color: #fff; font-weight: 800; padding: 4px 14px; border-radius: 99px; font-size: 1em; }
  .coord[hidden] { display: none; }
  .hint { color: var(--muted); font-size: .8em; margin-top: 4px; }
  .gsec { background: #f7f9ff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; margin-bottom: 12px; }
  .gsec-title { display: block; font-weight: 800; margin-bottom: 6px; }
  .axrow { display: grid; grid-template-columns: 20px auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: center;
    gap: 5px; margin: 6px 0; }
  .axrow b { font-size: 1.1em; font-style: italic; }
  .axrow span { color: var(--muted); font-size: .8em; }
  .axrow input[type=text] { padding: 8px 4px; text-align: center; font-size: 18px; border-radius: 12px; min-width: 0; }
  input[type=text].bad { border-color: #e5484d; background: #fff5f5; }
  .gmsg { border-radius: 12px; padding: 8px 12px; margin: 8px 0; font-size: .88em; font-weight: 600; background: #e7f8ee; color: #145c33; }
  .gmsg.bad { background: #fff1f0; color: #8a1c12; border: 2px solid #f5b5ae; }
  .gmsg[hidden] { display: none; }
  .gbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip-btn { font: inherit; font-size: .85em; font-weight: 700; min-height: 44px; padding: 6px 12px; border-radius: 12px; border: 2px solid #b9c6e6;
    background: #fff; color: var(--ink); cursor: pointer; touch-action: manipulation; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .keys button { font: inherit; font-weight: 800; min-width: 44px; min-height: 44px; border-radius: 12px; border: 2px solid #c5d3fb;
    background: #eef2ff; color: var(--accent-dark); cursor: pointer; touch-action: manipulation; }
  #gLabel { margin-top: 2px; font-size: 1em; }
  .add-btn { width: 100%; margin-top: 10px; }
  .glist { list-style: none; margin: 10px 0 4px; padding: 0; }
  .glist li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .glist li:first-child { border-top: none; }
  .glist li.empty { color: var(--muted); font-size: .88em; }
  .swatch { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; }
  .glist .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
  .glist .txt b { font-weight: 800; }
  .glist .txt small { display: block; color: var(--muted); font-size: .8em; }
  .glist .rm { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 12px; border: 2px solid #f5c2bc; background: #fff1f0; color: #b42318;
    font: inherit; font-weight: 800; cursor: pointer; touch-action: manipulation; }
  .linkish { font: inherit; font-size: .85em; background: none; border: none; color: #b42318; text-decoration: underline; cursor: pointer; padding: 8px 0; }
  .calc { max-width: 480px; margin: 0 auto; }
  .cdisplay { background: #1d2433; color: #fff; border-radius: 18px; padding: 10px 16px 12px; text-align: right; min-height: 118px; }
  .cexpr { font-size: 1.1em; opacity: .85; overflow-wrap: anywhere; min-height: 1.5em; }
  .cres { font-size: 2.2em; font-weight: 800; overflow-wrap: anywhere; line-height: 1.2; }
  .cres.preview { opacity: .55; font-size: 1.5em; }
  .cres.err { color: #ffb4a8; font-size: 1em; font-weight: 700; padding-top: 6px; }
  .cfrac { font-size: 1em; opacity: .85; min-height: 1.2em; }
  .ckeys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 8px; margin-top: 12px; }
  .ckeys button { min-height: 56px; font: inherit; font-size: 1.25em; font-weight: 700; border-radius: 14px; border: 2px solid #d6def0;
    background: #fff; color: var(--ink); cursor: pointer; padding: 0; touch-action: manipulation; }
  .ckeys button:active, .ckeys button.hit { transform: scale(.96); filter: brightness(.93); }
  .ckeys .d { background: #f3f6fd; }
  .ckeys .op { background: #e8eeff; color: var(--accent-dark); border-color: #c5d3fb; font-size: 1.6em; }
  .ckeys .fn { background: #fff1f0; color: #b42318; border-color: #f5c2bc; }
  .ckeys .eq { background: var(--accent); color: #fff; border-color: var(--accent); grid-row: span 2; font-size: 1.6em; }
  .ckeys .wide { grid-column: span 2; }
  .ckeys .small { font-size: 1em; }
  .cactions { display: flex; gap: 10px; margin-top: 12px; }
  .cactions .btn { flex: 1 1 0; padding: 12px 10px; font-size: .95em; }
  .cactions .btn:disabled { cursor: not-allowed; opacity: .45; }
  @media (min-width: 640px) {
    main { padding-bottom: 140px; }
    .bar-inner { flex-wrap: nowrap; }
    .tools { width: auto; flex: 0 0 auto; }
    .tool-btn { flex: 0 0 auto; }
  }
  @media (min-width: 760px) {
    .tool-overlay { padding: 20px; }
    .toolbox { max-width: 1000px; height: auto; max-height: calc(100vh - 40px); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    .close-x .wide-only { display: inline; }
    .toolbody { padding: 18px; }
    .glayout { grid-template-columns: minmax(0, 1.3fr) minmax(300px, 1fr); align-items: start; }
    .tab span { font-size: .95em; }
  }
  @media (max-width: 480px) {
    body { font-size: 19px; }
    .stamp { grid-template-columns: 1fr; }
    .btn { padding: 14px 18px; }
  }
  /* ---------- Rio's home screen ---------- */
  body.is-home main { padding-bottom: 28px; }
  .home h1 { margin: 2px 0 0; font-size: 1.7em; line-height: 1.15; }
  .home-date { margin: 2px 0 12px; color: var(--muted); font-weight: 700; }
  .home-today { display: block; width: 100%; text-align: left; border: none; border-radius: 22px; padding: 16px 16px 14px;
    color: #fff; cursor: pointer; touch-action: manipulation; background: linear-gradient(135deg, #3867ff, #7b5cff);
    box-shadow: 0 8px 20px rgba(56,103,255,.28); }
  .home-today:disabled { opacity: .65; cursor: default; }
  .home-today .k { font-size: .75em; font-weight: 800; letter-spacing: .06em; opacity: .92; }
  .home-today .t { font-size: 1.55em; font-weight: 900; line-height: 1.1; margin: 2px 0 4px; }
  .home-today .s { font-size: .88em; font-weight: 700; line-height: 1.3; }
  .home-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
  .home-tile { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-height: 88px; }
  .home-tile .k { font-size: .72em; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .home-tile .v { font-size: 1.35em; font-weight: 900; line-height: 1.15; margin-top: 2px; }
  .home-tile .s { font-size: .75em; color: var(--muted); margin-top: 2px; }
  .home-tile.good { background: #effaf3; border-color: #b7e4c7; }
  .home-card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 14px 12px 12px; margin: 0 0 14px;
    box-shadow: 0 2px 8px rgba(29,36,51,.05); }
  .home-card h2 { margin: 0 0 10px; font-size: 1.15em; }
  .home-card h3 { margin: 0 0 6px; font-size: .95em; }
  .home-cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .home-cal-head h2 { flex: 1; text-align: center; margin: 0; font-size: 1.1em; }
  .home-nav { width: 44px; height: 44px; border-radius: 12px; border: 2px solid #c5d3fb; background: #fff; font: inherit;
    font-size: 1.4em; font-weight: 800; color: var(--accent-dark); cursor: pointer; touch-action: manipulation; }
  .home-nav:disabled { opacity: .35; cursor: default; }
  .home-cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
  .home-dow { text-align: center; font-size: .68em; font-weight: 800; color: var(--muted); padding-bottom: 2px; }
  .home-day { min-height: 52px; border-radius: 12px; border: 1px solid transparent; background: #f4f7ff; display: flex;
    flex-direction: column; align-items: center; justify-content: center; font: inherit; font-weight: 800; color: var(--ink);
    padding: 2px 0 3px; line-height: 1.05; }
  button.home-day { cursor: pointer; touch-action: manipulation; }
  .home-day.empty { background: transparent; border-color: transparent; }
  .home-day .dn { font-size: .78em; }
  .home-day .ds { font-size: .62em; font-weight: 800; }
  .home-day.st-none { background: transparent; color: #b0b8c9; font-weight: 700; }
  .home-day.st-graded { color: #fff; }
  .home-day.st-awaiting { background: #fff4d6; color: #8a5a00; border-color: #f0d48a; }
  .home-day.st-missed { background: #eef0f4; color: #8b93a3; border-color: #e1e5ee; }
  .home-day.st-assigned { background: #e8eeff; color: var(--accent-dark); border-color: #3867ff; }
  .home-day.st-upcoming { background: #f3f0ff; color: #5b4b8a; border-color: #ddd4f7; }
  .home-day.is-today { box-shadow: 0 0 0 2px #1d2433; }
  .home-legend { display: flex; flex-wrap: wrap; gap: 6px 10px; margin-top: 10px; font-size: .72em; color: var(--muted); font-weight: 700; }
  .home-legend span { display: inline-flex; align-items: center; gap: 4px; }
  .home-legend .sw { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
  .home-legend .graded { background: #2f6fed; }
  .home-legend .sent { background: #f0d48a; }

<script>
  var RIO_API_URL = "https://script.google.com/macros/s/AKfycbwsufZ6Nh4q3j03LZHJXVIo0did9KHo8RUI-QhP5EVnQGPVDXji1ZW3xWzcHAA7B1WZ/exec";

  /* No cookies ever go to Google: credentials 'omit', no referrer. GET for the test; POST with a text/plain

     script.googleusercontent.com, which fetch follows; both send Access-Control-Allow-Origin: *. */
  function rioFetchJSON(url, opts, timeoutMs) {
    opts = opts || {};
    opts.credentials = 'omit'; opts.cache = 'no-store'; opts.redirect = 'follow'; opts.referrerPolicy = 'no-referrer';
    opts.mode = 'cors';

    if (ctl) { opts.signal = ctl.signal; timer = setTimeout(function () { ctl.abort(); }, timeoutMs || 30000); }
    return fetch(url, opts).then(function (r) {
      return r.text().then(function (t) {
        var j; try { j = JSON.parse(t); } catch (e) { throw new Error('The math server sent something unexpected (HTTP ' + r.status + ').'); }
        return j;

    }, function (e) {
      throw new Error(e && e.name === 'AbortError' ? 'The math server took too long to answer.' : 'Couldn\'t reach the math server.');
    }).finally(function () { if (timer) clearTimeout(timer); });
  }
  window.google = { script: {} };
  Object.defineProperty(window.google.script, 'run', { get: function () {
    var ok = function () {}, fail = function () {};
    var r = {
      withSuccessHandler: function (f) { ok = f; return r; },
      withFailureHandler: function (f) { fail = f; return r; },
      submitAnswers: function (payload) {
        rioFetchJSON(RIO_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload) }, 180000)
          .then(function (res) {
            if (!res || res.ok !== true) throw new Error((res && res.error) || 'The math server said no.');
            ok(res);
          })
          .catch(function (e) { fail(e); });
      },
      /* Bonus round answers: POST { action: 'bonus', bonusDate, answers, photos, ... } (text/plain, no cookies).
         Saved as submissions/BONUS_<date>_... by Code.gs submitBonus_. */
      submitBonus: function (payload) {
        rioFetchJSON(RIO_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(Object.assign({}, payload || {}, { action: 'bonus' })) }, 180000)
          .then(function (res) {
            if (!res || res.ok !== true) throw new Error((res && res.error) || 'The math server said no.');
            ok(res);
          })
          .catch(function (e) { fail(e); });
      },

      rioData: function () {
        rioFetchJSON(RIO_API_URL + '?format=json&api=rio', { method: 'GET' }, 30000)
          .then(function (res) {
            if (!res || res.ok !== true || res.api !== 'rio') throw new Error('No inbox on this server yet.');
            ok(res);
          })
          .catch(function (e) { fail(e); });
      },
      /* Public writes besides Submit: mark messages read, and save a finished mini quiz.
         A mini quiz is practice. It must not be sent as a daily-test submission. */
      rioMarkRead: function (ids) {
        rioFetchJSON(RIO_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'markRead', ids: ids }) }, 30000)
          .then(function (res) {
            if (!res || res.ok !== true) throw new Error((res && res.error) || 'Could not mark as read.');
            ok(res);
          })
          .catch(function (e) { fail(e); });

        rioFetchJSON(RIO_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(Object.assign({ action: 'miniquiz' }, payload || {})) }, 30000)
          .then(function (res) {
            if (!res || res.ok !== true) throw new Error((res && res.error) || 'Could not save the mini quiz.');
            ok(res);
          })
          .catch(function (e) { fail(e); });
      },

         The server checks every amount against his balance; the page only sends a number or a request id. */
      rioRedeem: function (tokens) { rioRedeemPost({ action: 'redeem', tokens: tokens }); },
      rioRedeemDone: function (id) { rioRedeemPost({ action: 'redeemDone', id: id }); },
      rioRedeemCancel: function (id) { rioRedeemPost({ action: 'redeemCancel', id: id }); }
    };
    function rioRedeemPost(body) {
      rioFetchJSON(RIO_API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }, 30000)
        .then(function (res) {
          if (!res || res.ok !== true) throw new Error((res && res.error) || 'The math server said no.');
          ok(res);
        })
        .catch(function (e) { fail(e); });
    }
    return r;
  } });

      var update = function () {
        var n = val(), good = n >= 1 && n <= avail;

        err.textContent = amt.value === '' || good ? '' : (n > avail ? 'You can redeem up to ' + avail + '.' : 'Type a whole number, like 50.');
        send.textContent = good ? 'Ask Dad for ' + yen(n * per) : 'Ask Dad';
        if (good) send.removeAttribute('disabled'); else send.setAttribute('disabled', '');
      };
      amt.addEventListener('input', update);
      var quick = [100, 500, 1000].filter(function (q) { return q < avail; }).map(function (q) {
        return el('button', { type: 'button', class: 'rio-quick', text: String(q), onclick: function () { amt.value = String(q); update(); } });
      });
      quick.push(el('button', { type: 'button', class: 'rio-quick', id: 'rioRedeemAll', text: 'All ' + avail, onclick: function () { amt.value = String(avail); update(); } }));
      send.addEventListener('click', function () {
        var n = val();
        if (!(n >= 1 && n <= avail)) return;
        send.setAttribute('disabled', ''); send.textContent = 'Sending\u2026'; err.textContent = '';
        api('rioRedeem', [n], function (res) {
          if (!res || res.ok !== true) { err.textContent = '\ud83d\ude15 ' + ((res && res.error) || 'That did not work. Try again.'); update(); return; }
          refresh(function () { showRedeem('\ud83d\udce8 Sent! Dad got a message about ' + yen(res.yen) + '. When he gives you the yen, press "I got the yen".'); });
        }, function (e) { err.textContent = '\ud83d\ude15 ' + (e && e.message || 'That did not work. Try again.'); update(); });
      });

        el('div', { class: 'rio-redeem-avail', id: 'rioRedeemAvail', text: 'You can redeem up to ' + avail + ' token' + (avail === 1 ? '' : 's') + '.' }),
        el('label', { class: 'rio-redeem-label', for: 'rioRedeemAmt', text: 'How many tokens?' }),

      body.push(el('h3', { class: 'rio-redeem-h', text: 'Done' }));
      body.push(el('ul', { class: 'rio-ledger rio-redeem-done' }, done.map(function (r) {
        var ok = r.status === 'complete';
        return el('li', null, [
          el('b', { class: ok ? 'plus' : 'muted', text: ok ? '\u2705' : '\u2716' }),
          el('span', { class: 'why', text: ok ? 'Got ' + yen(r.yen) + ' for ' + r.tokens + ' tokens' : 'Cancelled ' + yen(r.yen) }),
          el('small', { text: when(ok ? r.completedAt : (r.cancelledAt || r.requestedAt)) })
        ]);
      })));
    }
    frame('\ud83d\udcb4 Redeem tokens', body, showTokens);
    var a = document.getElementById('rioRedeemAmt');
    if (a && !note) try { a.focus({ preventScroll: true }); } catch (e) {}
  }

  function showShelf() {
    var certs = data.certificates || [], s = seen();
    var items = certs.map(function (c) {
      var isNew = s.indexOf(c.id) === -1;
      var fig = el('button', { type: 'button', class: 'rio-cert-thumb', 'aria-label': 'Open certificate ' + c.title, onclick: function () { showCert(c); } }, [
        isNew ? el('b', { class: 'rio-badge new', text: 'NEW' }) : null

      fig.insertBefore(RioCert.svg(c), fig.firstChild);

    });
    frame('\ud83c\udfc5 My certificates', items.length ? [el('div', { class: 'rio-shelf' }, items)]
      : [el('p', { class: 'muted', text: 'No certificates yet. They show up here when Dad gives you one!' })]);
  }

  function showCert(c) {
    markSeen([c.id]);
    var holder = el('div', { class: 'rio-cert-big', id: 'rioCertBig' });
    holder.appendChild(RioCert.svg(c));

      holder,
      el('div', { class: 'rio-cert-actions' }, [
        el('button', { type: 'button', class: 'btn secondary', text: '\ud83d\udda8\ufe0f Print', onclick: function () { printCert(c); } }),
        el('button', { type: 'button', class: 'btn', id: 'rioSaveCert', text: '\ud83d\udcbe Save picture', onclick: function () { savePicture(c, out); } })

  }

  function printCert(c) {
    var p = document.getElementById('rioPrint');

    p.innerHTML = '';
    p.appendChild(RioCert.svg(c));
    document.body.classList.add('print-cert');
    var done = function () { document.body.classList.remove('print-cert'); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done);

  }

  function savePicture(c, out) {
    out.innerHTML = '';
    out.appendChild(el('p', { class: 'muted', text: 'Making the picture\u2026' }));
    RioCert.toPng(c, 2, function (err, url) {
      out.innerHTML = '';
      if (err) { out.appendChild(el('p', { class: 'muted', text: '\ud83d\ude15 ' + err.message })); return; }
      var file = 'certificate-' + String(c.title || 'award').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.png';
      out.appendChild(el('img', { src: url, alt: 'Certificate picture', class: 'rio-cert-png' }));
      out.appendChild(el('p', { class: 'muted', text: 'On an iPad or iPhone: press and hold the picture, then "Save to Photos".' }));
      var a = el('a', { href: url, download: file, class: 'btn good', text: '\u2b07\ufe0f Download ' + file });
      out.appendChild(el('div', { class: 'rio-cert-actions' }, [a]));
      try { a.click(); } catch (e) {}
    });
  }

  function showScores() {
    var sc = data.scores || [];
    var label = { partial: 'only part done', not_submitted: 'not turned in' };
    var rows = sc.map(function (g) {
      var pct = Math.max(0, Math.min(100, Number(g.percent) || 0));
      return el('li', null, [
        el('div', { class: 'top' }, [el('b', { text: shortDate(g.date) }), el('span', { text: g.score + ' / ' + g.total + ' \u00b7 ' + pct + '%' })]),
        el('div', { class: 'track' }, [el('div', { class: 'fill' + (pct >= 80 ? ' good' : ''), style: 'width:' + pct + '%' })]),
        el('small', { class: 'muted', text: (g.topic || '') + (label[g.status] ? ' \u00b7 ' + label[g.status] : '') })
      ]);
    });
    frame('\u2b50 My scores', rows.length ? [el('ul', { class: 'rio-scores' }, rows)] : [el('p', { class: 'muted', text: 'Scores show up here after a test is checked.' })]);
  }

  function load() {
    lastLoad = Date.now();
    api('rioData', [], function (res) {
      if (!res || res.ok !== true || res.api !== 'rio') { data = null; drawStrip(); return; }
      data = res;
      drawStrip();
    }, function () { if (!data) drawStrip(); });
  }
  function mount(container) {
    if (container && !stripEl) container.appendChild(strip());
    load();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && Date.now() - lastLoad > 60000 && !current) load();
    });
  }
  /** Opens one certificate in the same viewer as the shelf (print + save picture). Pass the certificate object or its id. */
  function openCert(idOrCert) {
    var c = idOrCert && typeof idOrCert === 'object' ? idOrCert : null;
    if (!c && data) {
      c = (data.certificates || []).filter(function (x) { return x.id === idOrCert; })[0] || null;
    }
    if (!c) { open('certs'); return; }

    overlay.hidden = false;
    document.body.classList.add('tool-open');
    showCert(c);
  }
  return { mount: mount, load: load, open: open, openCert: openCert, close: close, redeem: function () { if (!data) return; ensureOverlay(); current = 'redeem'; overlay.hidden = false; document.body.classList.add('tool-open'); showRedeem(); }, state: function () { return data; } };
})();

<script>
/* ==== RIO-HOME START (Rio's opening home screen \u2014 edit src/home-block.js, then node dev/sync-blocks.js) ==== */
var RioHome = (function () {
  'use strict';
  var root = null, rio = null, today = '', baseUrl = '', currentTest = null, recent = [], viewY = 0, viewM = 0, picked = [];

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (attrs[k] == null) return;
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function svgEl(tag, attrs) {
    var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attrs || {}).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    return n;
  }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function parseIso(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
    return m ? { y: +m[1], m: +m[2] - 1, d: +m[3] } : null;
  }
  function isoOf(y, m, d) { return y + '-' + pad(m + 1) + '-' + pad(d); }
  function addDays(iso, n) {
    var p = parseIso(iso); if (!p) return iso;
    var dt = new Date(Date.UTC(p.y, p.m, p.d + n, 12));
    return dt.toISOString().slice(0, 10);
  }
  function prettyDate(iso) {
    var p = parseIso(iso); if (!p) return iso || '';
    var dt = new Date(Date.UTC(p.y, p.m, p.d, 12));
    try { return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' }); }
    catch (e) { return iso; }
  }
  function monthName(y, m) {
    try { return new Date(Date.UTC(y, m, 1, 12)).toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' }); }
    catch (e) { return (m + 1) + ' ' + y; }
  }
  function shortDay(iso) {
    var p = parseIso(iso); if (!p) return iso || '';
    return (p.m + 1) + '/' + p.d;
  }
  function slug(s) {
    return String(s || '').trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'general';
  }
  function skillLabel(id) {
    return String(id || '').split('-').filter(Boolean).map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
  }
  function num(n) {
    var x = Math.round(Number(n) * 10) / 10;
    if (!isFinite(x)) return '0';
    return Math.abs(x - Math.round(x)) < 0.05 ? String(Math.round(x)) : String(x);
  }
  function scoreColor(pct) {
    pct = Number(pct);
    if (pct >= 90) return '#1f9d55';
    if (pct >= 75) return '#2f6fed';
    if (pct >= 60) return '#d97706';
    return '#e5484d';
  }
  function seenCerts() { try { return JSON.parse(localStorage.getItem('rio-math-certs-seen') || '[]'); } catch (e) { return []; } }

  function go(date) {
    if (!date) return;
    var base = String(baseUrl || '').split('?')[0];
    if (!base) {
      try { base = location.origin + location.pathname; } catch (e) { base = ''; }
    }
    window.top.location.href = base + '?date=' + encodeURIComponent(date);
  }
  function goBonus(date) {
    if (!date) return;
    var base = String(baseUrl || '').split('?')[0];
    if (!base) {
      try { base = location.origin + location.pathname; } catch (e) { base = ''; }
    }
    window.top.location.href = base + '?bonus=' + encodeURIComponent(date);
  }
  function goQuiz(id) {
    if (!id) return;
    var base = String(baseUrl || '').split('?')[0];
    if (!base) {
      try { base = location.origin + location.pathname; } catch (e) { base = ''; }
    }
    window.top.location.href = base + '?quiz=' + encodeURIComponent(id);
  }

  function skillsOfTest(test) {
    var ids = [];
    function add(list) {
      (Array.isArray(list) ? list : (list ? [list] : [])).forEach(function (s) {
        var id = slug(s);
        if (id && ids.indexOf(id) === -1) ids.push(id);
      });
    }
    if (test) {
      add(test.skills);
      (test.questions || []).forEach(function (q) { (q.parts || []).forEach(function (p) { add(p.skills); }); });
      if (!ids.length && test.title) ids.push(slug(test.title));
    }
    return ids.slice(0, 24);
  }

  function streakOf(dates, day) {
    var set = {};
    dates.forEach(function (d) { set[d] = true; });
    var cursor = set[day] ? day : addDays(day, -1), n = 0;
    while (set[cursor]) { n++; cursor = addDays(cursor, -1); }
    return n;
  }

  function fromHome(data) {
    var h = data.home;
    return {
      full: true,
      name: data.name || 'Rio',
      today: data.today || today,
      todayTest: h.todayTest || null,
      streak: h.streak || 0,
      average: h.average == null ? null : h.average,
      completed: h.completed || 0,
      assigned: h.assigned || 0,
      latest: h.latest || null,
      days: h.days || [],
      skills: h.skills || [],
      certificates: data.certificates || [],
    };
  }

  /** Older backend: scores + the current test only. No missed/awaiting split and no per-question skills. */
  function fromFallback(data) {
    data = data || {};
    var scores = (data.scores || []).filter(function (s) { return s && s.status !== 'not_submitted'; });
    var byDate = {};
    scores.forEach(function (s) {
      byDate[s.date] = {
        date: s.date, title: s.topic || '', skills: [slug(s.topic || 'General')], status: 'graded', hasTest: true,
        percent: s.percent, score: s.score, total: s.total,
      };
    });
    recent.forEach(function (d) {
      if (byDate[d]) return;
      byDate[d] = { date: d, title: '', skills: [], status: d === (data.today || today) ? 'assigned' : 'assigned', hasTest: true };
    });
    if (currentTest && currentTest.date && !byDate[currentTest.date]) {
      byDate[currentTest.date] = { date: currentTest.date, title: currentTest.title || '', skills: currentTest.skills || [], status: 'assigned', hasTest: true };
    }
    if (currentTest && byDate[currentTest.date]) {
      if (!byDate[currentTest.date].title) byDate[currentTest.date].title = currentTest.title || '';
      if (currentTest.skills && currentTest.skills.length) byDate[currentTest.date].skills = currentTest.skills;
    }
    var buckets = {};
    scores.forEach(function (s) {
      var id = slug(s.topic || 'General');
      if (!buckets[id]) buckets[id] = { id: id, label: s.topic || 'General', points: 0, max: 0 };
      buckets[id].points += Number(s.score) || 0;
      buckets[id].max += Number(s.total) || 0;
    });
    var skills = Object.keys(buckets).map(function (id) {
      var b = buckets[id];
      return { id: id, label: b.label, points: b.points, max: b.max, percent: b.max ? Math.round(100 * b.points / b.max) : null };
    });
    var latest = scores.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; })[0] || null;
    var day = data.today || today;
    return {
      full: false,
      name: data.name || 'Rio',
      today: day,
      todayTest: currentTest,
      streak: streakOf(scores.map(function (s) { return s.date; }), day),
      average: scores.length ? Math.round(scores.reduce(function (n, s) { return n + (Number(s.percent) || 0); }, 0) / scores.length) : null,
      completed: scores.length,
      assigned: null,
      latest: latest,
      days: Object.keys(byDate).sort().map(function (d) { return byDate[d]; }),
      skills: skills,
      certificates: data.certificates || [],
    };
  }

  function labelMap(m) {
    var map = {};
    (m.skills || []).forEach(function (s) { map[s.id] = s.label || skillLabel(s.id); });
    return map;
  }

  function draw() {
    if (!root) return;
    var m = (rio && rio.home) ? fromHome(rio) : fromFallback(rio);
    if (!viewY) {
      var t = parseIso(m.today) || { y: 2026, m: 8 };
      viewY = t.y; viewM = t.m;
    }
    root.innerHTML = '';
    root.appendChild(hero(m));
    var bc = bonusCard(m);
    if (bc) root.appendChild(bc);
    root.appendChild(tiles(m));
    if (window.RioQuiz && RioQuiz.practiceCard) root.appendChild(RioQuiz.practiceCard(m, goQuiz));
    root.appendChild(calendar(m));
    root.appendChild(stats(m));
    if (window.RioQuiz && RioQuiz.historyCard) {
      var quizHist = RioQuiz.historyCard();
      if (quizHist) root.appendChild(quizHist);
    }
    root.appendChild(strengths(m));
    root.appendChild(certs(m));
    root.appendChild(tests(m));
    if (!m.full) {
      root.appendChild(el('p', { class: 'home-note', text: 'The color calendar and skill scores fill in after the math server is updated. Today\'s test still works.' }));
    }
  }

  function hero(m) {
    var t = m.todayTest;
    var sub = t ? ((t.title || 'Math practice') + ' \u00b7 ' + prettyDate(t.date)) : 'No test posted yet.';
    var btn = el('button', {
      type: 'button', class: 'home-today', id: 'homeToday',
      'aria-label': t ? ('Today\'s test, ' + (t.title || '') + ', ' + (t.date || '')) : 'Today\'s test is not posted yet',
      onclick: function () { if (t && t.date) go(t.date); },
    }, [
      el('div', { class: 'k', text: '\ud83d\udcdd  TODAY\'S TEST' }),
      el('div', { class: 't', text: t ? 'Let\'s go!' : 'Check back soon' }),
      el('div', { class: 's', text: sub }),
    ]);
    if (!t) btn.disabled = true;
    return el('section', { class: 'home-hero', id: 'homeHero' }, [
      el('h1', { text: 'Hi, ' + (m.name || 'Rio') + '!' }),
      el('p', { class: 'home-date', text: prettyDate(m.today) || 'Ready to practice?' }),
      btn,
    ]);
  }

  /* Bonus rounds (make-up questions after a graded test). rio.bonus comes from api=rio: dates, counts, and each
     item's status/points only. Shown while a round is open, and for 7 days after it is finished. */
  function half(x) {
    x = Math.round(Number(x || 0) * 100) / 100;
    var w = Math.floor(x), f = Math.round((x - w) * 100) / 100;
    return f === 0.5 ? ((w ? String(w) : '') + '\u00bd') : String(x);
  }
  function bonusCard(m) {
    var list = (rio && Array.isArray(rio.bonus)) ? rio.bonus : [];
    var day = m.today || today;
    var show = list.filter(function (b) {
      return b && b.date && b.count > 0 && (b.open || (day && b.date >= addDays(day, -7)));
    }).sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    if (!show.length) return null;
    var rows = show.map(function (b) {
      var status, cls;
      if (!b.open) { status = 'Done \u00b7 +' + half(b.earned); cls = 'done'; }
      else if (b.checked) { status = b.checked + '/' + b.count + ' checked \u00b7 +' + half(b.earned); cls = 'part'; }

      else { status = 'Start \u2192'; cls = 'start'; }
      return el('button', { type: 'button', class: 'home-bonus-row', 'data-date': b.date,
        'aria-label': 'Bonus round for ' + prettyDate(b.date) + ', ' + status,
        onclick: function () { goBonus(b.date); } }, [
        el('div', { class: 'home-bonus-main' }, [
          el('div', { class: 't', text: 'For ' + prettyDate(b.date) }),
          el('div', { class: 's', text: b.count + ' question' + (b.count === 1 ? '' : 's') + ' \u00b7 up to +' + half(b.possible) + ' point' + (b.possible === 1 ? '' : 's') }),
        ]),
        el('span', { class: 'home-bonus-pill st-' + cls, text: status }),
      ]);
    });
    var anyOpen = show.some(function (b) { return b.open && !b.submitted; });
    return el('section', { class: 'home-card home-bonus', id: 'homeBonus' }, [
      el('h2', { text: '\u2b50 Bonus round' }),
      el('p', { class: 'lead', text: anyOpen ? 'Win back points on a test you already took. Each right answer adds +\u00bd point.' : 'Your bonus answers are in. Dad checks them and your points show up here.' }),
    ].concat(rows));
  }

  function tile(k, v, s, extra) {
    return el('div', { class: 'home-tile' + (extra || '') }, [
      el('div', { class: 'k', text: k }),
      el('div', { class: 'v', text: v }),
      s ? el('div', { class: 's', text: s }) : null,
    ]);
  }
  function tiles(m) {
    var latest = m.latest;
    var latestV = latest ? (num(latest.percent) + '%') : '\u2014';
    var latestS = latest ? (num(latest.score) + '/' + num(latest.total) + ' \u00b7 ' + shortDay(latest.date)) : 'After your first grade';
    var turned = m.assigned == null ? String(m.completed) : (m.completed + ' / ' + m.assigned);
    var turnedS = m.assigned == null ? 'graded so far' : 'tests turned in';
    return el('section', { class: 'home-tiles', id: 'homeTiles', 'aria-label': 'Your numbers' }, [
      tile('\ud83d\udd25 Streak', m.streak ? (m.streak + (m.streak === 1 ? ' day' : ' days')) : '0', m.streak ? 'in a row' : 'Start one today!'),
      tile('Average', m.average == null ? '\u2014' : (m.average + '%'), m.average == null ? 'No grades yet' : 'of graded tests'),
      tile('Turned in', turned, turnedS),
      tile('Latest', latestV, latestS, latest && Number(latest.percent) >= 90 ? ' good' : ''),
    ]);
  }

  function bounds(m) {
    var dates = (m.days || []).map(function (d) { return d.date; }).concat(m.today ? [m.today] : []);
    var min = null, max = null;
    dates.forEach(function (d) {
      var p = parseIso(d); if (!p) return;
      var key = p.y * 12 + p.m;
      if (min == null || key < min) min = key;
      if (max == null || key > max) max = key;
    });
    if (min == null) { var t = parseIso(m.today) || { y: viewY, m: viewM }; min = max = t.y * 12 + t.m; }
    return { min: min - 1, max: max };
  }

  function calendar(m) {
    var b = bounds(m);
    var key = viewY * 12 + viewM;
    var days = {};
    (m.days || []).forEach(function (d) { days[d.date] = d; });
    var firstDow = new Date(Date.UTC(viewY, viewM, 1, 12)).getUTCDay();
    var dim = new Date(Date.UTC(viewY, viewM + 1, 0, 12)).getUTCDate();
    var names = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
    var grid = el('div', { class: 'home-cal-grid', id: 'calGrid' });
    names.forEach(function (n) { grid.appendChild(el('div', { class: 'home-dow', text: n })); });
    var i;
    for (i = 0; i < firstDow; i++) grid.appendChild(el('div', { class: 'home-day empty' }));
    for (var d = 1; d <= dim; d++) {
      var date = isoOf(viewY, viewM, d);
      var info = days[date];
      var status = info ? info.status : 'none';
      var isToday = date === m.today;
      var cls = 'home-day st-' + status + (isToday ? ' is-today' : '');
      var label = dayLabel(date, info, isToday);
      var canOpen = info && info.hasTest !== false && status !== 'none';
      if (canOpen) {
        var btn = el('button', { type: 'button', class: cls, 'aria-label': label, onclick: (function (dt) { return function () { go(dt); }; })(date) });
        fillDay(btn, d, info);
        grid.appendChild(btn);
      } else {
        var cell = el('div', { class: cls, 'aria-hidden': status === 'none' ? 'true' : 'false' });
        fillDay(cell, d, info);
        grid.appendChild(cell);
      }
    }
    var prev = el('button', { type: 'button', class: 'home-nav', id: 'calPrev', 'aria-label': 'Previous month', text: '\u2039', onclick: function () {
      if (key <= b.min) return;
      viewM--; if (viewM < 0) { viewM = 11; viewY--; }
      draw();
    } });
    var next = el('button', { type: 'button', class: 'home-nav', id: 'calNext', 'aria-label': 'Next month', text: '\u203a', onclick: function () {
      if (key >= b.max) return;
      viewM++; if (viewM > 11) { viewM = 0; viewY++; }
      draw();
    } });
    if (key <= b.min) prev.disabled = true;
    if (key >= b.max) next.disabled = true;
    return el('section', { class: 'home-card', id: 'homeCal' }, [
      el('div', { class: 'home-cal-head' }, [
        prev,
        el('h2', { id: 'calLabel', text: monthName(viewY, viewM) }),
        next,
      ]),
      grid,
      legend(),
    ]);
  }
  function fillDay(node, d, info) {
    node.appendChild(el('span', { class: 'dn', text: String(d) }));
    if (!info || info.status === 'none') return;
    var cap = { graded: info.percent == null ? '\u2713' : (num(info.percent)), awaiting: 'sent', missed: 'miss', assigned: 'go', upcoming: 'soon' }[info.status] || '';
    if (info.status === 'graded') node.style.background = scoreColor(info.percent);
    node.appendChild(el('span', { class: 'ds', text: cap }));
  }
  function dayLabel(date, info, isToday) {
    var nice = prettyDate(date);
    if (!info || info.status === 'none') return nice + ', no test';
    var bit = { graded: (info.percent == null ? 'graded' : info.percent + ' percent'), awaiting: 'turned in, waiting for a grade', missed: 'missed', assigned: 'assigned', upcoming: 'coming up' }[info.status] || info.status;
    return nice + (isToday ? ', today' : '') + ', ' + bit + (info.title ? ', ' + info.title : '') + ', open this test';
  }
  function legend() {
    return el('div', { class: 'home-legend' }, [
      el('span', null, [el('i', { class: 'sw graded' }), ' score']),
      el('span', null, [el('i', { class: 'sw sent' }), ' sent']),
      el('span', null, [el('i', { class: 'sw miss' }), ' missed']),
      el('span', null, [el('i', { class: 'sw go' }), ' to do']),
      el('span', null, [el('i', { class: 'sw soon' }), ' soon']),
    ]);
  }

  function stats(m) {
    return el('section', { class: 'home-card', id: 'homeStats' }, [
      el('h2', { text: '\ud83d\udcc8 Scores' }),
      chart(m),
    ]);
  }
  function chart(m) {
    var rows = (m.days || []).filter(function (d) { return d.status === 'graded' && d.percent != null; })
      .slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    if (rows.length > 14) rows = rows.slice(rows.length - 14);
    if (!rows.length) return el('p', { class: 'muted', text: 'Your chart starts after the first test is graded.' });
    var W = 360, H = 168, padL = 32, padR = 8, padT = 14, padB = 32;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var gap = rows.length > 10 ? 3 : 6;
    var bw = Math.min(36, (innerW - gap * (rows.length - 1)) / rows.length);
    var used = rows.length * bw + (rows.length - 1) * gap;
    var x0 = padL + Math.max(0, (innerW - used) / 2);
    var svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', role: 'img', 'aria-label': 'Bar chart of your score percent on each graded test' });
    [0, 50, 100].forEach(function (p) {
      var y = padT + innerH - (p / 100) * innerH;
      svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: '#e3e8f5', 'stroke-width': '1' }));
      var t = svgEl('text', { x: padL - 6, y: y + 4, 'text-anchor': 'end', fill: '#5b6475', 'font-size': '11', 'font-family': 'system-ui, sans-serif' });
      t.textContent = String(p);
      svg.appendChild(t);
    });
    var pts = [];
    rows.forEach(function (d, i) {
      var pct = Math.max(0, Math.min(100, Number(d.percent) || 0));
      var h = Math.max(3, (pct / 100) * innerH);
      var x = x0 + i * (bw + gap);
      var y = padT + innerH - h;
      svg.appendChild(svgEl('rect', { x: x, y: y, width: bw, height: h, rx: '5', fill: scoreColor(pct) }));
      pts.push((x + bw / 2) + ',' + y);
      var lab = svgEl('text', { x: x + bw / 2, y: H - 10, 'text-anchor': 'middle', fill: '#5b6475', 'font-size': '10', 'font-family': 'system-ui, sans-serif' });
      lab.textContent = shortDay(d.date);
      svg.appendChild(lab);
    });
    if (pts.length > 1) svg.appendChild(svgEl('polyline', { points: pts.join(' '), fill: 'none', stroke: '#1d2433', 'stroke-width': '2', 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    return svg;
  }

  function strengths(m) {
    var ranked = (m.skills || []).filter(function (s) { return s && s.max > 0 && s.percent != null; });
    var strong = ranked.filter(function (s) { return s.percent >= 80; }).sort(function (a, b) { return b.percent - a.percent; }).slice(0, 4);
    var weak = ranked.filter(function (s) { return s.percent < 70; }).sort(function (a, b) { return a.percent - b.percent; }).slice(0, 4);
    var mid = ranked.filter(function (s) { return s.percent >= 70 && s.percent < 80; }).sort(function (a, b) { return a.percent - b.percent; }).slice(0, 4);
    var box = el('section', { class: 'home-card', id: 'homeSkills' }, [
      el('h2', { text: '\ud83d\udcaa Skills' }),
    ]);
    if (!m.full) box.appendChild(el('p', { class: 'muted home-skill-note', text: 'Grouped by the test name until each question has a skill.' }));
    if (!ranked.length) {
      box.appendChild(el('p', { class: 'muted', text: 'Skill scores show up after a test is graded.' }));
      return box;
    }
    box.appendChild(skillGroup('\ud83c\udf1f Strong areas', strong, 'Nothing here yet \u2014 keep practicing and they will show up.', 'strong'));
    box.appendChild(skillGroup('\ud83c\udfaf Practice these', weak, 'No problem areas right now. Nice!', 'weak'));
    if (mid.length) box.appendChild(skillGroup('\ud83d\udc4d Getting there', mid, '', 'mid'));
    return box;
  }
  function skillGroup(title, list, empty, kind) {
    var body = list.length ? el('ul', { class: 'home-skill-list' }, list.map(function (s) { return skillRow(s, kind); }))
      : el('p', { class: 'muted', text: empty });
    return el('div', { class: 'home-skill-group ' + kind }, [el('h3', { text: title }), body]);
  }
  function skillRow(s, kind) {
    var pct = Math.max(0, Math.min(100, Number(s.percent) || 0));
    return el('li', null, [
      el('div', { class: 'home-skill-top' }, [
        el('b', { text: s.label || skillLabel(s.id) }),
        el('span', { text: pct + '%' }),
      ]),
      el('div', { class: 'home-track' }, [el('div', { class: 'home-fill ' + kind, style: 'width:' + pct + '%;background:' + scoreColor(pct) })]),
      el('small', { text: num(s.points) + ' of ' + num(s.max) + ' points' }),
    ]);
  }

  function certs(m) {
    var list = m.certificates || [];
    var seen = seenCerts();
    var shelf = el('div', { class: 'rio-shelf', id: 'homeCertShelf' });
    list.forEach(function (c) {
      var isNew = seen.indexOf(c.id) === -1;
      var fig = el('button', {
        type: 'button', class: 'rio-cert-thumb', 'aria-label': 'Open certificate ' + (c.title || ''),
        onclick: function () { if (window.RioInbox && RioInbox.openCert) RioInbox.openCert(c); },
      });
      if (window.RioCert && RioCert.svg) fig.appendChild(RioCert.svg(c));
      fig.appendChild(el('span', { class: 'cap', text: c.title || 'Certificate' }));
      if (isNew) fig.appendChild(el('b', { class: 'rio-badge new', text: 'NEW' }));
      shelf.appendChild(fig);
    });
    var all = el('button', { type: 'button', class: 'btn secondary home-cert-all', id: 'homeCertAll', text: 'Open my certificates', onclick: function () {
      if (window.RioInbox && RioInbox.open) RioInbox.open('certs');
    } });
    return el('section', { class: 'home-card', id: 'homeCerts' }, [
      el('h2', { text: '\ud83c\udfc5 Certificates' }),
      list.length ? shelf : el('p', { class: 'muted', text: 'When Dad gives you a certificate, it shows up here. You can print it or save the picture.' }),
      list.length ? all : null,
    ]);
  }

  function tests(m) {
    var labels = labelMap(m);
    var allSkills = [];
    (m.days || []).forEach(function (d) {
      (d.skills || []).forEach(function (id) { if (allSkills.indexOf(id) === -1) allSkills.push(id); });
    });
    allSkills.sort(function (a, b) { return (labels[a] || skillLabel(a)) < (labels[b] || skillLabel(b)) ? -1 : 1; });
    picked = picked.filter(function (id) { return allSkills.indexOf(id) !== -1; });
    var chips = el('div', { class: 'home-chips', id: 'homeSkillFilters' });
    var allBtn = el('button', { type: 'button', class: 'home-chip', 'aria-pressed': picked.length ? 'false' : 'true', text: 'All', onclick: function () { picked = []; draw(); } });
    chips.appendChild(allBtn);
    allSkills.forEach(function (id) {
      var on = picked.indexOf(id) !== -1;
      chips.appendChild(el('button', {
        type: 'button', class: 'home-chip', 'aria-pressed': on ? 'true' : 'false', 'data-skill': id,
        text: labels[id] || skillLabel(id),
        onclick: function () {
          var i = picked.indexOf(id);
          if (i === -1) picked.push(id); else picked.splice(i, 1);
          draw();
        },
      }));
    });
    var rows = (m.days || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; }).filter(function (d) {
      if (!picked.length) return true;
      return picked.some(function (id) { return (d.skills || []).indexOf(id) !== -1; });
    });
    var list = el('div', { class: 'home-tests', id: 'homeTestList' });
    if (!rows.length) list.appendChild(el('p', { class: 'muted', text: 'No tests for those skills. Try another one!' }));
    rows.forEach(function (d) {
      var can = d.hasTest !== false && d.status !== 'none';
      var pill = statusPill(d);
      var skillBits = (d.skills || []).slice(0, 3).map(function (id) { return labels[id] || skillLabel(id); }).join(' \u00b7 ');
      var row = el(can ? 'button' : 'div', {
        type: can ? 'button' : null,
        class: 'home-test',
        onclick: can ? function () { go(d.date); } : null,
      }, [
        el('div', { class: 'home-test-top' }, [
          el('b', { text: prettyDate(d.date) }),
          pill,
        ]),
        el('div', { class: 'home-test-title', text: d.title || 'Math practice' }),
        skillBits ? el('div', { class: 'home-test-skills', text: skillBits }) : null,
      ]);
      list.appendChild(row);
    });
    var hint = picked.length
      ? ('Showing tests that practice ' + (picked.length === 1 ? 'this skill' : 'any of these skills') + '.')
      : (allSkills.length ? 'Tap a skill to filter the list.' : '');
    return el('section', { class: 'home-card', id: 'homeTests' }, [
      el('h2', { text: '\ud83d\udcda Tests' }),
      allSkills.length ? chips : null,
      hint ? el('p', { class: 'home-filter-hint', id: 'homeFilterHint', text: hint }) : null,
      list,
    ]);
  }
  function statusPill(d) {
    var text = { graded: d.percent == null ? 'Graded' : (num(d.percent) + '%'), awaiting: 'Sent', missed: 'Missed', assigned: 'To do', upcoming: 'Soon', none: '' }[d.status] || '';
    if (!text) return null;
    var node = el('span', { class: 'home-pill st-' + d.status, text: text });
    if (d.status === 'graded' && d.percent != null) node.style.background = scoreColor(d.percent);
    return node;
  }

  function mount(container, opts) {
    opts = opts || {};
    rio = opts.rio || null;
    today = opts.today || (rio && rio.today) || '';
    baseUrl = opts.baseUrl || '';
    recent = Array.isArray(opts.recent) ? opts.recent : [];
    root = el('div', { class: 'home', id: 'home' });
    container.appendChild(root);
    draw();
    if (!(rio && rio.home) && typeof rioFetchJSON === 'function' && typeof RIO_API_URL === 'string') {
      rioFetchJSON(RIO_API_URL + '?format=json', { method: 'GET' }, 30000).then(function (res) {
        if (res && res.test) currentTest = { date: res.test.date, title: res.test.title || '', skills: skillsOfTest(res.test) };
        if (res && Array.isArray(res.recent)) recent = res.recent;
        if (res && res.today && !today) today = res.today;
        draw();
      }, function () {});
    }
  }
  return { mount: mount };
})();
/* ==== RIO-HOME END ==== */
</script>
<script>
/* ==== RIO-SCRATCH START (scratch paper \u2014 edit src/scratch-block.js, then node dev/sync-blocks.js) ==== */
var RioScratch = (function () {
  'use strict';
  var COLORS = [
    { id: 'black', hex: '#1d2433', label: 'Black' },
    { id: 'blue', hex: '#3867ff', label: 'Blue' },
    { id: 'red', hex: '#e5484d', label: 'Red' }
  ];
  var PEN_W = 0.009;
  var ERASER_W = 0.055;
  var MAX_STROKE_PTS = 4000;
  var openState = null;

  function ensureCss() {
    if (document.getElementById('rioScratchCss')) return;
    var s = document.createElement('style');
    s.id = 'rioScratchCss';
    s.textContent = [
      '.scratch-open{display:inline-flex;align-items:center;margin-top:10px;font:inherit;font-weight:800;font-size:.92em;min-height:48px;padding:8px 14px;border-radius:12px;border:2px solid #c5d3fb;background:#f4f7ff;color:#2447c7;cursor:pointer;touch-action:manipulation}',
      '.scratch-open.has{border-color:#8fd3ab;background:#f3fbf6;color:#145c33}',
      '.scratch-att{margin-top:8px}',
      '.scratch-att .att-head{font-weight:800;color:#145c33}',

      '.scratch-pad{position:fixed;inset:0;z-index:28;background:#efeae0;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);overscroll-behavior:none}',
      '.scratch-bar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid #e4dccd}',
      '.scratch-bar h2{flex:1;margin:0;font-size:1.02em;line-height:1.2;min-width:0}',
      '.scratch-x{width:48px;height:48px;border-radius:14px;border:2px solid #d6def0;background:#fff;font:inherit;font-weight:800;font-size:1.25em;cursor:pointer;touch-action:manipulation}',
      '.scratch-prob{flex:0 0 auto;max-height:22vh;overflow:auto;-webkit-overflow-scrolling:touch;background:#fffdf8;padding:8px 14px 10px;border-bottom:1px solid #e4dccd;touch-action:pan-y;overscroll-behavior:contain}',
      '.scratch-prob .h{font-weight:800}',
      '.scratch-prob .t{white-space:pre-wrap;font-size:.82em;line-height:1.35;margin-top:4px}',
      '.scratch-stage{flex:1 1 auto;min-height:120px;position:relative;background:#fffdf8;touch-action:none}',
      '.scratch-stage canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;background:#fffdf8}',
      '.scratch-tools{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid #e4dccd}',
      '.scratch-tools button{min-width:44px;min-height:44px;border-radius:12px;border:2px solid #d6def0;background:#fff;font:inherit;font-weight:800;font-size:.82em;padding:4px 10px;cursor:pointer;touch-action:manipulation;color:#1d2433}',
      '.scratch-swatch{width:44px;padding:0}',
      '.scratch-swatch[aria-pressed=true]{box-shadow:0 0 0 3px #1d2433}',
      '.scratch-tools button[aria-pressed=true].is-on{background:#fff4d6;border-color:#e0b000}',
      '.scratch-tools button:disabled{opacity:.4}',
      '.scratch-msg{flex:1 1 100%;font-size:.78em;color:#5b6475;min-height:1.2em}'
    ].join('');
    document.head.appendChild(s);
  }

  function storageKey(date, id) {
    return 'rio-math-scratch-' + String(date || '') + '-' + String(id || '').replace(/[^A-Za-z0-9_-]/g, '_');
  }
  function load(date, id) {
    try {
      var raw = localStorage.getItem(storageKey(date, id));
      if (!raw) return null;
      var o = JSON.parse(raw);
      if (!o || o.v !== 1 || !Array.isArray(o.strokes)) return null;
      return o;
    } catch (e) { return null; }
  }
  function has(date, id) {
    var d = load(date, id);
    return !!(d && d.strokes.length);
  }
  function saveDoc(date, id, doc) {
    try {
      var k = storageKey(date, id);
      if (!doc || !doc.strokes || !doc.strokes.length) { localStorage.removeItem(k); return true; }
      localStorage.setItem(k, JSON.stringify(doc));
      return true;
    } catch (e) { return false; }
  }
  function round4(n) { return Math.round(n * 10000) / 10000; }

  function drawLines(ctx, w, h) {
    ctx.save();
    ctx.strokeStyle = '#f3e6c8';
    ctx.lineWidth = 1;
    ctx.beginPath();
    var gap = Math.max(22, w * 0.07);
    for (var y = gap; y < h; y += gap) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();
    ctx.restore();
  }
  function drawStroke(ctx, s, w, h) {
    var pts = s.p;
    if (!pts || !pts.length) return;
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(1, (s.w || PEN_W) * w);
    ctx.strokeStyle = s.e ? '#fffdf8' : (s.c || COLORS[0].hex);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.globalCompositeOperation = 'source-over';
    var x = pts[0][0] * w, y = pts[0][1] * h;
    if (pts.length === 1) {
      ctx.beginPath();
      ctx.arc(x, y, ctx.lineWidth / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
      return;
    }
    ctx.beginPath();
    ctx.moveTo(x, y);
    if (pts.length === 2) ctx.lineTo(pts[1][0] * w, pts[1][1] * h);
    else {
      var i, mx, my, last;
      for (i = 1; i < pts.length - 1; i++) {
        mx = ((pts[i][0] + pts[i + 1][0]) / 2) * w;
        my = ((pts[i][1] + pts[i + 1][1]) / 2) * h;
        ctx.quadraticCurveTo(pts[i][0] * w, pts[i][1] * h, mx, my);
      }
      last = pts[pts.length - 1];
      ctx.lineTo(last[0] * w, last[1] * h);
    }
    ctx.stroke();
    ctx.restore();
  }
  function paintDoc(ctx, doc, w, h) {
    ctx.fillStyle = '#fffdf8';
    ctx.fillRect(0, 0, w, h);
    drawLines(ctx, w, h);
    (doc.strokes || []).forEach(function (s) { drawStroke(ctx, s, w, h); });
  }
  function exportJpeg(date, id) {

  function writeSlopeInt(r) {
    var m = pick(r, [-3, -2, -1, 1, 2, 3]);
    var b = irand(r, -5, 6);
    return q(
      'Write the equation of the line with slope ' + m + ' and y-intercept ' + b + '. Use y and x.',
      fmtLine(m, b),
      'Slope-intercept form is y = mx + b.',
      'm = ' + m + ' and b = ' + b + ', so ' + fmtLine(m, b) + '.',

    );
  }
  function writeFromPoint(r) {
    var m = pick(r, [-2, -1, 1, 2, 3]);

    var b = irand(r, -4, 4);
    var y = m * x + b;
    return q(
      'Write y = mx + b for the line with slope ' + m + ' through (' + x + ', ' + y + ').',
      fmtLine(m, b),
      'Find b from the point, then write y = mx + b.',
      y + ' = ' + m + '(' + x + ') + b gives b = ' + b + '. So ' + fmtLine(m, b) + '.',
      { kind: 'equation', line: { m: m, b: b } }

  }
  function writeFromTwo(r) {
    var m = pick(r, [-2, 1, 2, 3]);
    var b = irand(r, -3, 4);
    var x1 = 0, y1 = b;
    var x2 = 2, y2 = m * 2 + b;
    return q(
      'Write the slope-intercept equation of the line through (' + x1 + ', ' + y1 + ') and (' + x2 + ', ' + y2 + ').',
      fmtLine(m, b),
      'Find the slope, then the y-intercept.',
      'Slope = (' + y2 + ' \u2212 ' + y1 + ') / (' + x2 + ' \u2212 ' + x1 + ') = ' + m + '. The line crosses the y-axis at ' + b + '. ' + fmtLine(m, b) + '.',
      { kind: 'equation', line: { m: m, b: b } }

  function rewriteStandard(r) {
    var m = pick(r, [-3, -1, 2, 4]);
    var b = irand(r, -4, 5);
    var shown;
    if (m < 0) shown = ( -m) + 'x + y = ' + b;
    else shown = yOnLeft(m, b);
    function yOnLeft(mm, bb) {
      if (mm > 0) return 'y \u2212 ' + mm + 'x = ' + bb;
      return 'y + ' + (-mm) + 'x = ' + bb;
    }
    shown = yOnLeft(m, b);
    return q(
      'Write ' + shown + ' in slope-intercept form (y = mx + b).',
      fmtLine(m, b),
      'Get y by itself on one side.',
      'Solving for y gives ' + fmtLine(m, b) + '.',
      { kind: 'equation', line: { m: m, b: b } }
    );
  }

  function solveOne(r) {
    var kind = pick(r, ['add', 'sub', 'mul', 'div']);
    var x = irand(r, -8, 9);
    if (x === 0) x = 4;
    var a, prompt, steps;
    if (kind === 'add') {
      a = irand(r, -9, 9); if (a === 0) a = 3;
      var sum = x + a;
      prompt = 'Solve: x ' + (a < 0 ? '\u2212 ' + (-a) : '+ ' + a) + ' = ' + sum;
      steps = 'Subtract ' + a + ' from both sides. x = ' + x + '.';
    } else if (kind === 'sub') {
      a = irand(r, 1, 9);
      prompt = 'Solve: x \u2212 ' + a + ' = ' + (x - a);
      steps = 'Add ' + a + ' to both sides. x = ' + x + '.';
    } else if (kind === 'mul') {
      a = pick(r, [2, 3, 4, 5, -2, -3]);
      prompt = 'Solve: ' + a + 'x = ' + (a * x);
      steps = 'Divide both sides by ' + a + '. x = ' + x + '.';
    } else {
      a = pick(r, [2, 3, 4, 5]);
      var quot = irand(r, -6, 6); if (quot === 0) quot = 2;
      x = a * quot;
      prompt = 'Solve: x / ' + a + ' = ' + quot;
      steps = 'Multiply both sides by ' + a + '. x = ' + x + '.';
    }
    return q(prompt, numText(x), 'Do the opposite operation on both sides.', steps, { value: x, kind: 'number' });
  }
  function solveTwo(r) {
    var x = irand(r, -6, 7); if (x === 0) x = 3;
    var a = pick(r, [2, 3, 4, 5, -2, -3]);
    var b = irand(r, -8, 8); if (b === 0) b = 2;

    return q(
      'Solve: ' + linLeft(a, b) + ' = ' + c,
      numText(x),
      'Undo the addition or subtraction first, then divide.',
      'Subtract ' + b + ': ' + a + 'x = ' + (c - b) + '. Divide by ' + a + ': x = ' + x + '.',
      { value: x, kind: 'number' }
    );
  }

  function writeWord(r) {
    var rate = pick(r, [2, 3, 4, 5, 8, 10]);
    var fee = pick(r, [0, 5, 12, 15, 20, 25]);
    var thing = pick(r, [
      ['hours', 'the total cost in dollars'],
      ['tickets', 'the total cost in dollars'],
      ['miles', 'the total distance from home']
    ]);
    var story = fee
      ? 'A plan costs $' + fee + ' plus $' + rate + ' for each of the ' + thing[0] + '.'
      : 'Something grows by ' + rate + ' for each of the ' + thing[0] + ', starting at 0.';
    return q(
      story + ' Write an equation for ' + thing[1] + '. Use y for that total and x for the number of ' + thing[0] + '.',
      fmtLine(rate, fee),
      'The starting amount is b. The amount added each time is the slope.',
      'Start at ' + fee + ' and add ' + rate + ' each time: ' + fmtLine(rate, fee) + '.',
      { kind: 'equation', line: { m: rate, b: fee } }

  }
  function writeWordStart(r) {
    var start = pick(r, [20, 40, 50, 80]);
    var each = pick(r, [2, 3, 5, 6]);
    var down = r() < 0.5;
    var m = down ? -each : each;
    var story = down
      ? 'A phone starts with ' + start + ' songs and Rio deletes ' + each + ' songs every day.'
      : 'Rio has ' + start + ' cards and gets ' + each + ' more each week.';

    return q(
      story + ' Write y for how many are left, and x for the number of ' + unit + '.',
      fmtLine(m, start),
      down ? 'Deleting means the slope is negative.' : 'The pile starts at ' + start + ' and grows.',
      (down ? 'Start at ' + start + ' and subtract ' + each + ' each day: ' : 'Start at ' + start + ' and add ' + each + ' each week: ') + fmtLine(m, start) + '.',
      { kind: 'equation', line: { m: m, b: start } }
    );
  }

  function plans(r) {
    var rateB = pick(r, [2, 3, 4, 5]);
    var rateA = rateB + pick(r, [2, 3, 4, 5]);
    var gap = rateA - rateB;
    var k = pick(r, [2, 3, 4, 5, 6]);
    var fee = gap * k;
    var n = pick(r, [1, 2, 3, 8, 10].filter(function (v) { return v !== k; }));
    if (n === k) n = k + 2;
    var costA = rateA * n;
    var costB = rateB * n + fee;
    var cheaper = costA < costB ? 'Plan A' : costB < costA ? 'Plan B' : 'They cost the same';
    var which = r();
    if (which < 0.34) {
      return q(
        'Plan A costs $' + rateA + ' per student. Plan B costs $' + rateB + ' per student plus a $' + fee + ' fee. How much does Plan A cost for ' + n + ' students?',
        numText(costA),

    }
    if (which < 0.67) {
      return q(
        'Plan A: $' + rateA + ' per student. Plan B: $' + rateB + ' per student plus $' + fee + '. Which costs less for ' + n + ' students?',
        cheaper,
        'Work out both costs, then compare.',
        'Plan A: ' + costA + '. Plan B: ' + rateB + ' \u00d7 ' + n + ' + ' + fee + ' = ' + costB + '. ' + cheaper + (cheaper === 'They cost the same' ? '.' : ' costs less.'),
        { kind: 'choice', choices: ['Plan A', 'Plan B', 'They cost the same'] }
      );
    }
    return q(
      'Plan A costs $' + rateA + ' per student. Plan B costs $' + rateB + ' per student plus $' + fee + '. For how many students do the plans cost the same?',
      numText(k),
      'Set the two costs equal and solve for the number of students.',
      rateA + 'x = ' + rateB + 'x + ' + fee + '. Then ' + gap + 'x = ' + fee + ', so x = ' + k + '.',
      { value: k, kind: 'number' }
    );
  }

  function rateWord(r) {
    var per = pick(r, [2, 3, 4, 5]);
    var each = pick(r, [3, 4, 6, 8]);
    var times = pick(r, [2, 3, 4, 5]);
    var totalT = per * times;
    var total = each * times;
    var noun = pick(r, [['km', 'hours'], ['pages', 'minutes'], ['dollars', 'days']]);
    return q(
      'Rio covers ' + each + ' ' + noun[0] + ' every ' + per + ' ' + noun[1] + '. How many ' + noun[0] + ' in ' + totalT + ' ' + noun[1] + '?',
      numText(total),
      'How many groups of ' + per + ' fit into ' + totalT + '?',
      totalT + ' / ' + per + ' = ' + times + ' groups. ' + times + ' \u00d7 ' + each + ' = ' + total + '.',
      { value: total, kind: 'number' }
    );
  }
  function rateUnit(r) {

      'A line rises ' + rise + ' when x increases by ' + run + '. What is the rate of change per 1 x?',

      { value: m, kind: 'number' }
    );
  }
  function rateTable(r) {
    var m = pick(r, [2, 3, 4, 5]);
    var b = pick(r, [0, 1, 4]);
    return q(
      'What is the rate of change (slope) in this table?\nx | y\n1 | ' + (m + b) + '\n2 | ' + (2 * m + b) + '\n3 | ' + (3 * m + b),
      numText(m),
      'See how much y grows when x grows by 1.',
      'From x = 1 to x = 2, y changes by ' + m + '. The rate is ' + m + '.',
      { value: m, kind: 'number' }
    );
  }

  function graphSlope(r) {
    var m = pick(r, [-2, -1, 1, 2, 3]);

    var x2 = 2;
    var y2 = m * x2 + b;
    return q(
      'What is the slope of the line in the graph? It goes through (0, ' + b + ') and (' + x2 + ', ' + y2 + ').',
      numText(m),
      'From the left point to the right point, slope is rise over run.',
      'Rise = ' + y2 + ' \u2212 ' + b + ' = ' + (y2 - b) + '. Run = ' + x2 + '. Slope = ' + numText(m) + '.',
      { value: m, graph: { m: m, b: b, xmin: -1, xmax: 5, ymin: Math.min(-1, b, y2) - 1, ymax: Math.max(1, b, y2) + 1 } }
    );
  }
  function graphReadY(r) {
    var m = pick(r, [-1, 1, 2]);
    var b = pick(r, [0, 1, 2]);
    var x = pick(r, [2, 3]);

    return q(
      'On the graph, the line is ' + fmtLine(m, b) + '. What is y when x is ' + x + '?',

      'y = ' + m + '(' + x + ') + ' + b + ' = ' + y + '.',

    );

  function graphHorizontal(r) {
    var k = pick(r, [-3, -1, 2, 4]);

      'y = ' + k,

      'Every point has y = ' + k + ', so the equation is y = ' + k + '.',

    );
  }

  function pointOnLine(r) {
    var m = pick(r, [-2, 1, 2, 3]);
    var b = irand(r, -2, 4);
    var x = irand(r, -2, 4);
    var on = r() < 0.5;

      'Is the point (' + x + ', ' + y + ') on the line ' + fmtLine(m, b) + '?',

  }
  function missingY(r) {

  function missingTable(r) {
    var m = pick(r, [-2, 1, 2, 3, 4]);

      'The table is a straight line. What number replaces the question mark?\nx | y\n' + lines,

      'Find the pattern: how much y changes when x goes up by 1.',

    );
  }
  function tableMatch(r) {
    var m = pick(r, [-2, 1, 2, 3]);

    for (var i = choices.length - 1; i > 0; i--) {
      var j = Math.floor(r() * (i + 1));
      var t = choices[i]; choices[i] = choices[j]; choices[j] = t;

  function horizEq(r) {
    var k = pick(r, [-4, -3, -1, 2, 5]);

      'What is the equation of the horizontal line through (' + x + ', ' + k + ')?',
      'y = ' + k,
      'Horizontal lines are y = a number. The number is the y of any point on it.',
      'The y value stays ' + k + ', so the equation is y = ' + k + '.',

    );
  }
  function vertEq(r) {
    var k = pick(r, [-3, -1, 2, 4, 6]);
    var y = irand(r, -2, 3);
    return q(
      'What is the equation of the vertical line through (' + k + ', ' + y + ')?',
      'x = ' + k,
      'Vertical lines are x = a number.',
      'The x value stays ' + k + ', so the equation is x = ' + k + '.',

    );
  }
  function horizSlope(r) {
    var k = pick(r, [-3, 0, 2, 4]);
    return q(
      'What is the slope of the line y = ' + k + '?',
      '0',
      'A horizontal line does not rise or fall.',
      'y stays ' + k + ' while x changes, so the slope is 0.',

    );
  }
  function vertSlope(r) {
    var k = pick(r, [-2, 1, 3, 5]);

      'What is the slope of the line x = ' + k + '?',
      'undefined',
      'A vertical line goes straight up. Rise over run would divide by 0.',

  function orderClean(r) {
    var forms = [
      function () {
        var a = irand(r, 2, 12), b = irand(r, 2, 9);

      },
      function () {

      },
      function () {

      },
      function () {

      }
    ];

  }

  function ineqOne(r) {
    var a = irand(r, -6, 8); if (a === 0) a = 3;
    var boundary = irand(r, -4, 8);
    var right = boundary + a;
    var op = pick(r, ['>', '<', '>=', '<=']);
    var showOp = { '>': '>', '<': '<', '>=': '\u2265', '<=': '\u2264' }[op];
    var ansOp = { '>': '>', '<': '<', '>=': '>=', '<=': '<=' }[op];
    return q(
      'Solve: x ' + (a < 0 ? '\u2212 ' + (-a) : '+ ' + a) + ' ' + showOp + ' ' + right,

    );

  function ineqTwo(r) {
    var a = pick(r, [2, 3, 4, 5]);
    var boundary = irand(r, -3, 6);
    var b = irand(r, -5, 6); if (b === 0) b = 1;
    var right = a * boundary + b;
    var op = pick(r, ['>', '<']);
    return q(
      'Solve: ' + linLeft(a, b) + ' ' + op + ' ' + right,
      'x ' + op + ' ' + boundary,
      'Undo the added number first, then divide. The sign stays, because you divide by a positive number.',
      'Subtract ' + b + ', then divide by ' + a + '. x ' + op + ' ' + boundary + '.',
      { kind: 'inequality', ineq: { op: op, n: boundary } }
    );
  }

  var TEMPLATES = {
    'slope': [slopeTwoPoints, slopeTable, slopeFromEq, slopeStandard, slopeTwoPoints],
    'tables': [missingTable, tableMatch, slopeTable, missingTable, tableMatch],
    'intercepts': [interceptEq, interceptPoint, interceptTable, interceptEq, interceptPoint],
    'slope-intercept': [writeSlopeInt, writeFromPoint, writeFromTwo, rewriteStandard, writeSlopeInt],
    'solving-equations': [solveOne, solveTwo, solveOne, solveTwo, solveOne],
    'writing-equations': [writeWord, writeWordStart, writeWord, writeFromPoint, writeWordStart],
    'comparing-linear-costs': [plans, plans, plans, plans, plans],
    'constant-rate': [rateWord, rateUnit, rateTable, rateWord, rateUnit],
    'graphing-lines': [graphSlope, graphReadY, graphHorizontal, graphSlope, graphReadY],
    'points-on-a-line': [pointOnLine, missingY, whichPoint, pointOnLine, missingY],
    'linear-equations': [horizEq, vertEq, horizSlope, vertSlope, horizEq],
    'order-of-operations': [orderClean, orderClean, orderClean, orderClean, orderClean],
    'inequalities': [ineqOne, ineqTwo, ineqOne, ineqTwo, ineqOne]
  };

  function generate(skill, seed) {
    var temps = TEMPLATES[skill];
    if (!temps) return null;
    var r = rng(seed);
    var order = temps.map(function (_, i) { return i; });
    var i, j, tmp;
    for (i = order.length - 1; i > 0; i--) {
      j = Math.floor(r() * (i + 1));
      tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    var out = [];
    var guard = 0;
    while (out.length < 5 && guard < 20) {
      var made = temps[order[guard % order.length]](r);
      made.n = out.length + 1;
      made.skill = skill;
      out.push(made);
      guard++;
    }
    return out;
  }

  /** Lowest percent, but only skills with enough graded points (max >= 2). Ties: most recent miss first. */
