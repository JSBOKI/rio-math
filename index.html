<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<title>Math practice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f3f7ff; --card: #ffffff; --ink: #1d2433; --muted: #5b6475;
    --accent: #3867ff; --accent-dark: #2447c7; --good: #1f9d55; --warn: #d97706; --line: #d6def0;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 20px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  body.tool-open { overflow: hidden; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 14px 200px; }
  header.top { background: linear-gradient(135deg, #3867ff, #7b5cff); color: #fff; border-radius: 22px;
    padding: 20px 20px 18px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(56,103,255,.25); }
  header.top h1 { margin: 0 0 4px; font-size: 1.5em; line-height: 1.2; }
  header.top .date { font-size: 1.05em; opacity: .95; }
  header.top .instructions { margin-top: 10px; font-size: .95em; background: rgba(255,255,255,.15);
    border-radius: 12px; padding: 10px 12px; }
  .card { background: var(--card); border-radius: 20px; padding: 18px 18px 8px; margin: 0 0 16px;
    box-shadow: 0 2px 8px rgba(29,36,51,.06); border: 1px solid var(--line); }
  .stamp { display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .stamp label { font-weight: 600; font-size: .9em; color: var(--muted); display: block; margin-bottom: 4px; }
  .qhead { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .qnum { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 1.15em; }
  .qtitle { font-weight: 800; font-size: 1.1em; line-height: 1.25; }
  .qprompt { margin: 6px 0 10px; }
  .part { border-top: 2px dashed var(--line); padding: 14px 0 12px; }
  .part:first-of-type { border-top: none; }
  .plabel { display: inline-block; min-width: 38px; padding: 2px 10px; margin-right: 6px; border-radius: 10px;
    background: #e8eeff; color: var(--accent-dark); font-weight: 800; text-align: center; }
  .pprompt { font-weight: 600; }
  .field { margin-top: 10px; }
  .field > label { display: block; font-weight: 600; color: var(--muted); font-size: .92em; margin-bottom: 4px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .suffix { color: var(--muted); white-space: nowrap; }
  input[type=text], textarea { width: 100%; font: inherit; font-size: 1.05em; color: var(--ink); padding: 12px 14px;
    border: 2px solid #b9c6e6; border-radius: 14px; background: #fbfcff; outline: none; }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 4px rgba(56,103,255,.15); }
  textarea { min-height: 110px; resize: vertical; }
  .filled input[type=text], .filled textarea { border-color: #8fd3ab; }
  .choices { display: flex; gap: 10px; flex-wrap: wrap; }
  .choices button { font: inherit; font-weight: 700; padding: 12px 20px; border-radius: 14px; border: 2px solid #b9c6e6;
    background: #fff; color: var(--ink); cursor: pointer; min-width: 130px; }
  .choices button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .paper { background: #fff8e6; border: 2px solid #f6d58a; border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
  .paper .big { font-weight: 800; }
  .paper-btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
  .photo-btn { display: inline-block; margin-top: 10px; font: inherit; font-weight: 700; padding: 10px 16px; border-radius: 12px;
    background: #fff; border: 2px solid #f0c052; cursor: pointer; color: var(--ink); min-height: 48px; }
  .paper-btns .photo-btn { margin-top: 0; }
  .photo-btn.graph { border-color: var(--accent); color: var(--accent-dark); }
  .photo-btn input { display: none; }
  .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .thumb { position: relative; }
  .thumb img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; border: 2px solid #f0c052; }
  .thumb button { position: absolute; top: -8px; right: -8px; width: 30px; height: 30px; border-radius: 50%; border: none;
    background: #d33; color: #fff; font-weight: 800; cursor: pointer; }
  .graph-att { margin-top: 10px; }
  .graph-att:empty { display: none; }
  .graph-att .att-head { font-weight: 800; color: #145c33; }
  .graph-att img { display: block; width: 100%; max-width: 360px; border-radius: 12px; border: 3px solid #8fd3ab; background: #fff; margin: 6px 0; }
  .graph-att .att-desc { white-space: pre-wrap; font-size: .8em; line-height: 1.4; background: #fff; border-radius: 10px;
    padding: 8px 10px; margin: 6px 0; border: 1px solid #f0dca6; overflow-wrap: anywhere; }
  table.vals { border-collapse: collapse; margin: 8px 0 12px; font-variant-numeric: tabular-nums; }
  table.vals th, table.vals td { border: 2px solid var(--line); padding: 6px 16px; text-align: center; }
  table.vals th { background: #eef2ff; }
  .info { color: var(--muted); font-style: italic; margin-top: 6px; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.97); border-top: 1px solid var(--line);
    padding: 8px 14px calc(10px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 16px rgba(29,36,51,.08); z-index: 5; }
  .bar-inner { max-width: 760px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .tools { display: flex; gap: 8px; width: 100%; }
  .tool-btn { flex: 1 1 0; font: inherit; font-weight: 800; font-size: .92em; min-height: 46px; padding: 6px 10px; border-radius: 14px;
    border: 2px solid #c5d3fb; background: #eef2ff; color: var(--accent-dark); cursor: pointer; white-space: nowrap; touch-action: manipulation; }
  .tool-btn:active { background: #dbe4ff; }
  .progress { flex: 1; min-width: 0; }
  .progress .txt { font-size: .85em; color: var(--muted); font-weight: 600; }
  .progress .track { height: 12px; background: #e3e8f5; border-radius: 99px; overflow: hidden; margin-top: 4px; }
  .progress .fill { height: 100%; width: 0; background: linear-gradient(90deg, #34c77b, #1f9d55); transition: width .3s; }
  .btn { font: inherit; font-weight: 800; font-size: 1.05em; padding: 14px 26px; border-radius: 16px; border: none;
    background: var(--accent); color: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(56,103,255,.3); touch-action: manipulation; }
  .btn:disabled { opacity: .6; cursor: wait; }
  .btn.secondary { background: #fff; color: var(--accent-dark); border: 2px solid var(--accent); box-shadow: none; }
  .btn.good { background: var(--good); box-shadow: 0 4px 12px rgba(31,157,85,.3); }
  .overlay { position: fixed; inset: 0; background: rgba(20,26,40,.55); display: none; align-items: center; justify-content: center;
    padding: 18px; z-index: 30; }
  .overlay.show { display: flex; }
  .modal { background: #fff; border-radius: 24px; padding: 26px 22px; max-width: 460px; width: 100%; text-align: center; }
  .modal h2 { margin: 0 0 8px; font-size: 1.6em; }
  .modal .emoji { font-size: 3.2em; line-height: 1; margin-bottom: 8px; }
  .modal .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .sent-banner { display: none; background: #e7f8ee; border: 2px solid #8fd3ab; color: #145c33; border-radius: 16px;
    padding: 12px 14px; margin-bottom: 16px; font-weight: 700; }
  .sent-banner.show { display: block; }
  .error { background: #fff1f0; border: 2px solid #f5b5ae; color: #8a1c12; }
  .other-days { font-size: .9em; color: var(--muted); }
  .other-days select { font: inherit; font-size: 1em; padding: 6px 8px; border-radius: 10px; }
  .muted { color: var(--muted); }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 6px rgba(31,157,85,.45); border-color: var(--good); } 100% { box-shadow: none; } }

  /* ---------- tool popups (graph + calculator) ---------- */
  .tool-overlay { position: fixed; inset: 0; z-index: 20; background: rgba(20,26,40,.55); display: flex;
    align-items: center; justify-content: center; }
  .tool-overlay[hidden] { display: none; }
  .toolbox { background: #fff; width: 100%; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .toolhead { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 12px;
    border-bottom: 1px solid var(--line); background: #f7f9ff; }
  .tabs { display: flex; gap: 6px; flex: 1; min-width: 0; }
  .tab { flex: 1 1 0; position: relative; min-width: 0; }
  .tab input { position: absolute; opacity: 0; pointer-events: none; }
  .tab span { display: flex; align-items: center; justify-content: center; min-height: 50px; padding: 4px 6px; border-radius: 14px;
    border: 2px solid #b9c6e6; background: #fff; font-weight: 800; font-size: .88em; cursor: pointer; white-space: nowrap;
    touch-action: manipulation; overflow: hidden; }
  .tab input:checked + span { background: var(--accent); border-color: var(--accent); color: #fff; }
  .tab input:focus-visible + span { outline: 3px solid rgba(56,103,255,.45); outline-offset: 2px; }
  .close-x { flex: 0 0 auto; min-width: 54px; min-height: 54px; padding: 0 14px; border-radius: 14px; border: none; background: #1d2433;
    color: #fff; font: inherit; font-weight: 800; font-size: 1.05em; cursor: pointer; touch-action: manipulation; }
  .close-x .wide-only { display: none; }
  .toolbody { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px; overscroll-behavior: contain; }
  .toolfoot { flex: 0 0 auto; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: #f7fff9; }
  .toolfoot .btn { width: 100%; }
  .toolfoot .muted { font-size: .8em; text-align: center; margin-top: 4px; }
  .gtarget { background: #fff8e6; border: 2px solid #f6d58a; border-radius: 14px; padding: 8px 12px; margin-bottom: 10px; font-size: .9em; }
  .glayout { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  .canvas-wrap { position: relative; width: 100%; }
  .canvas-wrap canvas { display: block; width: 100%; border-radius: 12px; border: 2px solid var(--line); touch-action: manipulation; cursor: crosshair; background: #fff; }
  .gbelow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-height: 40px; margin-top: 6px; }
  .gbelow .hint { margin-top: 0; }
  .coord { background: #1d2433; color: #fff; font-weight: 800; padding: 4px 14px; border-radius: 99px; font-size: 1em; }
  .coord[hidden] { display: none; }
  .hint { color: var(--muted); font-size: .8em; margin-top: 4px; }
  .gsec { background: #f7f9ff; border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; margin-bottom: 12px; }
  .gsec-title { display: block; font-weight: 800; margin-bottom: 6px; }
  .axrow { display: grid; grid-template-columns: 20px auto minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr); align-items: center;
    gap: 5px; margin: 6px 0; }
  .axrow b { font-size: 1.1em; font-style: italic; }
  .axrow span { color: var(--muted); font-size: .8em; }
  .axrow input[type=text] { padding: 8px 4px; text-align: center; font-size: 18px; border-radius: 12px; min-width: 0; }
  input[type=text].bad { border-color: #e5484d; background: #fff5f5; }
  .gmsg { border-radius: 12px; padding: 8px 12px; margin: 8px 0; font-size: .88em; font-weight: 600; background: #e7f8ee; color: #145c33; }
  .gmsg.bad { background: #fff1f0; color: #8a1c12; border: 2px solid #f5b5ae; }
  .gmsg[hidden] { display: none; }
  .gbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
  .chip-btn { font: inherit; font-size: .85em; font-weight: 700; min-height: 44px; padding: 6px 12px; border-radius: 12px; border: 2px solid #b9c6e6;
    background: #fff; color: var(--ink); cursor: pointer; touch-action: manipulation; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .keys button { font: inherit; font-weight: 800; min-width: 44px; min-height: 44px; border-radius: 12px; border: 2px solid #c5d3fb;
    background: #eef2ff; color: var(--accent-dark); cursor: pointer; touch-action: manipulation; }
  #gLabel { margin-top: 2px; font-size: 1em; }
  .add-btn { width: 100%; margin-top: 10px; }
  .glist { list-style: none; margin: 10px 0 4px; padding: 0; }
  .glist li { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
  .glist li:first-child { border-top: none; }
  .glist li.empty { color: var(--muted); font-size: .88em; }
  .swatch { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; }
  .glist .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; line-height: 1.25; }
  .glist .txt b { font-weight: 800; }
  .glist .txt small { display: block; color: var(--muted); font-size: .8em; }
  .glist .rm { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 12px; border: 2px solid #f5c2bc; background: #fff1f0; color: #b42318;
    font: inherit; font-weight: 800; cursor: pointer; touch-action: manipulation; }
  .linkish { font: inherit; font-size: .85em; background: none; border: none; color: #b42318; text-decoration: underline; cursor: pointer; padding: 8px 0; }
  .calc { max-width: 480px; margin: 0 auto; }
  .cdisplay { background: #1d2433; color: #fff; border-radius: 18px; padding: 10px 16px 12px; text-align: right; min-height: 118px; }
  .cexpr { font-size: 1.1em; opacity: .85; overflow-wrap: anywhere; min-height: 1.5em; }
  .cres { font-size: 2.2em; font-weight: 800; overflow-wrap: anywhere; line-height: 1.2; }
  .cres.preview { opacity: .55; font-size: 1.5em; }
  .cres.err { color: #ffb4a8; font-size: 1em; font-weight: 700; padding-top: 6px; }
  .cfrac { font-size: 1em; opacity: .85; min-height: 1.2em; }
  .ckeys { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-flow: row dense; gap: 8px; margin-top: 12px; }
  .ckeys button { min-height: 56px; font: inherit; font-size: 1.25em; font-weight: 700; border-radius: 14px; border: 2px solid #d6def0;
    background: #fff; color: var(--ink); cursor: pointer; padding: 0; touch-action: manipulation; }
  .ckeys button:active, .ckeys button.hit { transform: scale(.96); filter: brightness(.93); }
  .ckeys .d { background: #f3f6fd; }
  .ckeys .op { background: #e8eeff; color: var(--accent-dark); border-color: #c5d3fb; font-size: 1.6em; }
  .ckeys .fn { background: #fff1f0; color: #b42318; border-color: #f5c2bc; }
  .ckeys .eq { background: var(--accent); color: #fff; border-color: var(--accent); grid-row: span 2; font-size: 1.6em; }
  .ckeys .wide { grid-column: span 2; }
  .ckeys .small { font-size: 1em; }
  .cactions { display: flex; gap: 10px; margin-top: 12px; }
  .cactions .btn { flex: 1 1 0; padding: 12px 10px; font-size: .95em; }
  .cactions .btn:disabled { cursor: not-allowed; opacity: .45; }
  @media (min-width: 640px) {
    main { padding-bottom: 140px; }
    .bar-inner { flex-wrap: nowrap; }
    .tools { width: auto; flex: 0 0 auto; }
    .tool-btn { flex: 0 0 auto; }
  }
  @media (min-width: 760px) {
    .tool-overlay { padding: 20px; }
    .toolbox { max-width: 1000px; height: auto; max-height: calc(100vh - 40px); border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    .close-x .wide-only { display: inline; }
    .toolbody { padding: 18px; }
    .glayout { grid-template-columns: minmax(0, 1.3fr) minmax(300px, 1fr); align-items: start; }
    .tab span { font-size: .95em; }
  }
  @media (max-width: 480px) {
    body { font-size: 19px; }
    .stamp { grid-template-columns: 1fr; }
    .btn { padding: 14px 18px; }
  }
  .loading { text-align: center; padding: 60px 10px; color: var(--muted); }
  .loading .spin { width: 44px; height: 44px; margin: 0 auto 14px; border-radius: 50%; border: 5px solid var(--line);
    border-top-color: var(--accent); animation: rspin 0.9s linear infinite; }
  @keyframes rspin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main id="app"></main>

<div class="bar" id="bar" hidden>
  <div class="bar-inner">
    <div class="tools" role="group" aria-label="Math tools">
      <button class="tool-btn" id="openGraphBtn" type="button">📈 Graph</button>
      <button class="tool-btn" id="openCalcBtn" type="button">🧮 Calculator</button>
    </div>
    <div class="progress">
      <div class="txt" id="progressTxt">0 answered</div>
      <div class="track"><div class="fill" id="progressFill"></div></div>
    </div>
    <button class="btn" id="submitBtn" type="button">Submit ✈️</button>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<div class="tool-overlay" id="toolOverlay" hidden>
  <div class="toolbox" role="dialog" aria-modal="true" aria-label="Math tools">
    <div class="toolhead">
      <div class="tabs" role="radiogroup" aria-label="Pick a tool">
        <label class="tab"><input type="radio" name="tool" value="graph" id="tabGraph"><span>📈 Graph</span></label>
        <label class="tab"><input type="radio" name="tool" value="calc" id="tabCalc"><span>🧮 Calculator</span></label>
      </div>
      <button type="button" class="close-x" id="toolClose" aria-label="Close">✕<span class="wide-only">&nbsp;Close</span></button>
    </div>
    <div class="toolbody" id="toolBody">
      <section id="graphTool" hidden>
        <div class="gtarget" id="gTarget" hidden></div>
        <div class="glayout">
          <div>
            <div class="canvas-wrap" id="gWrap">
              <canvas id="gCanvas" role="img" aria-label="Graph"></canvas>
            </div>
            <div class="gbelow"><span class="coord" id="gCoord" hidden></span><span class="hint" id="gTapHint">Tap the graph to see the coordinates of that spot.</span></div>
          </div>
          <div>
            <div class="gsec">
              <div class="gsec-title">Axes</div>
              <div class="axrow"><b>x</b><span>from</span><input type="text" id="ax-xmin" aria-label="x min" autocomplete="off" spellcheck="false"><span>to</span><input type="text" id="ax-xmax" aria-label="x max" autocomplete="off" spellcheck="false"><span>by</span><input type="text" id="ax-xstep" aria-label="x interval" autocomplete="off" spellcheck="false"></div>
              <div class="axrow"><b>y</b><span>from</span><input type="text" id="ax-ymin" aria-label="y min" autocomplete="off" spellcheck="false"><span>to</span><input type="text" id="ax-ymax" aria-label="y max" autocomplete="off" spellcheck="false"><span>by</span><input type="text" id="ax-ystep" aria-label="y interval" autocomplete="off" spellcheck="false"></div>
              <div class="gmsg bad" id="gAxisMsg" role="alert" hidden></div>
              <div class="gbtns">
                <button type="button" class="chip-btn" id="gSuggest" hidden>Use the suggested bounds</button>
                <button type="button" class="chip-btn" id="gResetAxes">Reset to −10 … 10</button>
              </div>
            </div>
            <div class="gsec">
              <label class="gsec-title" for="gInput">Add a line or points</label>
              <input type="text" id="gInput" placeholder="y = 2x + 3  or  (3, 5)" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
              <div class="keys" id="gKeys"></div>
              <input type="text" id="gLabel" placeholder="Label (optional), like TechBus" maxlength="40" autocomplete="off" aria-label="Label (optional)">
              <button type="button" class="btn add-btn" id="gAdd">＋ Add to graph</button>
              <div class="gmsg" id="gAddMsg" role="status" hidden></div>
              <ul class="glist" id="gList"></ul>
              <button type="button" class="linkish" id="gClear">Clear all lines and points</button>
            </div>
          </div>
        </div>
      </section>
      <section id="calcTool" hidden>
        <div class="calc">
          <div class="cdisplay" aria-live="polite">
            <div class="cexpr" id="cExpr"></div>
            <div class="cres" id="cRes">0</div>
            <div class="cfrac" id="cFrac"></div>
          </div>
          <div class="ckeys" id="cKeys"></div>
          <div class="cactions">
            <button type="button" class="btn secondary" id="cCopy">📋 Copy</button>
            <button type="button" class="btn" id="cInsert">⤵ Put in my answer</button>
          </div>
          <div class="hint" id="cHint"></div>
        </div>
      </section>
    </div>
    <div class="toolfoot" id="gFoot" hidden>
      <button type="button" class="btn good" id="gUse">✅ Use this graph in my answer</button>
      <div class="muted" id="gFootNote"></div>
    </div>
  </div>
</div>

<script>
  var RIO_API_URL = "https://script.google.com/macros/s/AKfycbwsufZ6Nh4q3j03LZHJXVIo0did9KHo8RUI-QhP5EVnQGPVDXji1ZW3xWzcHAA7B1WZ/exec";
  var DATA = null;   // filled in by the loader at the bottom of the page (GET <exec>?format=json)
  /* No cookies ever go to Google: credentials 'omit', no referrer. GET for the test; POST with a text/plain
     body for Submit (a "simple" CORS request, so no preflight). Apps Script answers with a 302 to
     script.googleusercontent.com, which fetch follows; both send Access-Control-Allow-Origin: *. */

  function describeGraph(spec) {

<script>
window.__rioStart = function () {

  var MAX_PICTURES = 8;   // Code.gs keeps at most CONFIG.MAX_PHOTOS = 8 pictures per submission
  var partById = {};      // partId -> { part, q }

  function el(tag, attrs, children) {
    var n = document.createElement(tag);

  function store(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  // Must mirror fieldsForPart_() in Code.gs
  function fieldsForPart(p) {
    if (p.type === 'info') return [];
    if (p.type === 'paper') return [{ id: p.id + '-notes', label: 'Notes (optional)', type: 'paper' }];
    if (p.fields && p.fields.length) return p.fields;
    return [{ id: p.id, label: '', type: p.type || 'long' }];
  }
  function allFields() {
    var out = [];

      fieldsForPart(p).forEach(function (f) { out.push(f); });
    }); });
    return out;
  }
  function prettyDate(iso) {
    var p = iso.split('-');

  }

  function saveDraft() {

  }

  function table(t) {

      el('thead', null, [el('tr', null, t.columns.map(function (c) { return el('th', { text: c }); }))]),
      el('tbody', null, (t.rows || []).map(function (r) {

      }))

  function fieldEl(f) {

          wrap.classList.toggle('filled', !!answers[f.id]);
          saveDraftSafe();

    var n = 0;

    Object.keys(graphs).forEach(function (k) { if (graphs[k]) n++; });
    return n;
  }
  function tooManyPictures() {

  }

    ]);
    var thumbs = el('div', { class: 'thumbs' });

        thumbs.appendChild(el('div', { class: 'thumb' }, [
          el('img', { src: src, alt: 'Photo ' + (i + 1) }),
          el('button', { type: 'button', 'aria-label': 'Remove photo', text: '×', onclick: function () {
            photos[p.id].splice(i, 1); saveDraftSafe(); drawThumbs();
          } })
        ]));
      });

    var fileInput = el('input', { type: 'file', accept: 'image/*' });

    ]));

  function render() {

      partById[p.id] = { part: p, q: q };

    }); });

    app.appendChild(el('div', { class: 'card' }, [el('div', { class: 'stamp' }, [
      el('div', null, [el('label', { for: 'name', text: 'Your name' }), nameInput]),
      el('div', null, [el('label', { text: 'Today' }), el('div', { style: 'padding:12px 0;font-weight:700', text: DATA.today })])
    ]), el('div', { style: 'height:10px' })]));

    (test.questions || []).forEach(function (q) {

        el('div', { class: 'qhead' }, [el('div', { class: 'qnum', text: String(q.number) }), el('div', { class: 'qtitle', text: q.title || ('Question ' + q.number) })]),

  function otherDays() {

      dates.map(function (d) { return el('option', { value: d, text: d + (test && d === test.date ? ' (this one)' : '') }); })));
    sel.addEventListener('change', function () {

  }

  function counts() {

        el('p', { text: 'Do you want to go back and try them, or send it now?' }),

  /** Answers + pictures exactly as they are sent. Graph-tool graphs go in as a PNG "photo" of their part

  function buildSubmission() {
    var sendAnswers = {}, photoList = [], graphCount = 0;
    Object.keys(answers).forEach(function (k) { sendAnswers[k] = answers[k]; });

      var png = null;

      var key = pid + '-notes', notes = String(answers[key] || '').trim(), desc = M.describeGraph(g);

  }

  function doSubmit() {

          el('h2', { text: 'Sent!' }),
          el('p', { text: 'Great work, ' + payload.name + '! Your answers were saved.' }),
          el('p', { class: 'muted', text: (c.requiredTotal - c.blanks.length) + ' of ' + c.requiredTotal + ' boxes answered' + extra + '.' }),

          el('div', { class: 'actions' }, [el('button', { class: 'btn', type: 'button', text: 'Yay!', onclick: closeModal })])

      })
      .submitAnswers(payload);
  }

  /* =====================================================================
   * Tools: 📈 Graph and 🧮 Calculator popups (one overlay, two tabs).
   * They sit on top of the page and never re-render it, so typed answers stay put.
   * ===================================================================== */
  var toolEl = document.getElementById('toolOverlay');
  var currentTool = null, toolOpener = null;
  var lastField = null;   // last answer box he was typing in, for "Put in my answer"
  var FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

  function copyText(text, btn, label) {

  }

  /**

  function drawGraph(ctx, W, H, axes, items, o) {
    o = o || {};
    var fs = o.font || 13, pad = o.pad || 8;

    function lab(v) { return uni(M.formatNumber(v)); }

    setFont(600);
    var yLabW = 0, xLabW = 0;
    yt.forEach(function (t) { yLabW = Math.max(yLabW, ctx.measureText(lab(t.v)).width); });
    xt.forEach(function (t) { xLabW = Math.max(xLabW, ctx.measureText(lab(t.v)).width); });
    var yAxisIn = axes.xmin < 0 && axes.xmax > 0, xAxisIn = axes.ymin < 0 && axes.ymax > 0;

    function seg(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }

    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    if (o.title) {

      yt.forEach(function (t) { if ((t.k % everyY === 0) !== strong) return; var Y = Math.round(sy(t.v)) + 0.5; ctx.moveTo(left, Y); ctx.lineTo(right, Y); });

    ctx.strokeStyle = '#9aa7c2'; ctx.lineWidth = 1.5; ctx.strokeRect(left, top, pw, ph);

    var xLabY, xBase = 'top', xAlong = xAxisIn;

    else xLabY = bottom + 5;
    ctx.textAlign = 'center'; ctx.textBaseline = xBase;
    xt.forEach(function (t) {
      if (t.k % everyX !== 0) return;
      if (t.v === 0 && xAxisIn && yAxisIn) return;
      var X = sx(t.v), s = lab(t.v), w = ctx.measureText(s).width;
      if (xAxisVis) { ctx.strokeStyle = '#1d2433'; ctx.lineWidth = 1.5; seg(X, ay0 - tick, X, ay0 + tick); }
      X = Math.max(w / 2 + 2, Math.min(W - w / 2 - 2, X));
      if (xAlong) halo(s, X, xLabY, '#1d2433'); else { ctx.fillStyle = '#1d2433'; ctx.fillText(s, X, xLabY); }
    });
    var yLabX, yAlign = 'right', yAlong = yAxisIn;
    if (yAxisIn) { yLabX = ax0 - tick - 3; if (yLabX - yLabW < left) { yLabX = ax0 + tick + 3; yAlign = 'left'; } }
    else yLabX = left - 5;
    ctx.textAlign = yAlign; ctx.textBaseline = 'middle';
    yt.forEach(function (t) {
      if (t.k % everyY !== 0) return;
      if (t.v === 0 && xAxisIn && yAxisIn) return;
      var Y = sy(t.v), s = lab(t.v);
      if (yAxisVis) { ctx.strokeStyle = '#1d2433'; ctx.lineWidth = 1.5; seg(ax0 - tick, Y, ax0 + tick, Y); }
      Y = Math.max(fs / 2 + 1, Math.min(H - fs / 2 - 1, Y));
      if (yAlong) halo(s, yLabX, Y, '#1d2433'); else { ctx.fillStyle = '#1d2433'; ctx.fillText(s, yLabX, Y); }
    });
    if (xAxisIn && yAxisIn) { ctx.textAlign = 'right'; ctx.textBaseline = 'top'; halo('0', ax0 - 4, ay0 + 3, '#1d2433'); }
    setFont('italic 800', fs * 1.1);
    if (xAxisVis) { ctx.textAlign = 'right'; ctx.textBaseline = 'bottom'; halo('x', right - 3, ay0 - 3, '#1d2433'); }

    // the things he graphed

    items.forEach(function (it, idx) {

          ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();
          shapes.push({ pts: [[X, Y]], r: r + 2 });
          var coords = (pt.name ? pt.name : '') + '(' + uni(M.formatNumber(pt.x)) + ', ' + uni(M.formatNumber(pt.y)) + ')';

    if (yAxisVis && yAlong) taken.push({ x: yAlign === 'right' ? yLabX - yLabW - 2 : ax0 - tick, y: top, w: yLabW + tick + 8, h: ph });
    setFont('italic 800', fs * 1.1);
    if (xAxisVis) taken.push({ x: right - fs * 1.2, y: ay0 - fs * 1.4, w: fs * 1.2, h: fs * 1.4 });

  /** The picture that gets sent with the answer (fixed size, same on every device). */
  function graphPNG(spec, title) {

      { font: fs, pad: 18, lineW: 4.5, dot: 9, axisW: 3.5, title: title, titleH: titleH, legend: true, legendH: legendH });
    return c.toDataURL('image/png');
  }
  function graphTitle(pid) {
    var info = partById[pid];

  }

  /* ------------------------------ graph tool ------------------------------ */
  var G = { mode: 'free', part: null, ws: null, axes: DEFAULT_AXES, axesOk: true, view: null, tap: null };

    if (part && graphs[part.id]) return { axesText: axesToText(graphs[part.id].axes), items: graphs[part.id].items.slice() };

  }

      inp.addEventListener('input', function () { G.ws.axesText[k] = inp.value; applyAxes(); saveWs(); });
    });
    ['x', 'y', '=', '(', ')', '/', '-', ',', '.'].forEach(function (ch) {

        var inp = $('gInput'), v = inp.value;
        var s = typeof inp.selectionStart === 'number' ? inp.selectionStart : v.length, e2 = typeof inp.selectionEnd === 'number' ? inp.selectionEnd : v.length;

    });

    });

    window.addEventListener('resize', function () { if (currentTool === 'graph') drawScreen(); });
  }

  function openGraph(partId) {

    ensureGraphReady();
    G.part = info ? info.part : null;
    G.mode = info ? info.part.id : 'free';
    G.ws = loadWs(G.mode, G.part);
    G.tap = null;
    AXIS_KEYS.forEach(function (k) { $('ax-' + k).value = G.ws.axesText[k] == null ? '' : G.ws.axesText[k]; });
    var tgt = $('gTarget');
    tgt.innerHTML = '';

    show(tgt, !!info);
    show($('gSuggest'), !!(G.part && M.suggestedAxes(G.part.prompt)));
    $('gUse').textContent = info && graphs[info.part.id] ? '✅ Update the graph in my answer' : '✅ Use this graph in my answer';

    applyAxes(true);
    renderList();
    openTool('graph');
  }

  function setAxesText(t) {
    G.ws.axesText = t;
    AXIS_KEYS.forEach(function (k) { $('ax-' + k).value = t[k]; });
    applyAxes(); saveWs();
  }
  function applyAxes(noDraw) {
    var r = M.validateAxes(G.ws.axesText), msg = $('gAxisMsg');
    AXIS_KEYS.forEach(function (k) { $('ax-' + k).classList.toggle('bad', !!r.bad[k]); });
    G.axesOk = r.ok;
    if (r.ok) { G.axes = r.axes; msg.hidden = true; }
    else {
      msg.innerHTML = '';
      r.errors.forEach(function (e) { msg.appendChild(el('div', { text: '⚠️ ' + e })); });
      msg.appendChild(el('div', { class: 'muted', text: 'The graph shows your last good settings until this is fixed.' }));
      msg.hidden = false;
    }
    $('gUse').disabled = !r.ok;
    if (!noDraw) drawScreen();
  }

  function addMsg(text, bad) {
    var m = $('gAddMsg');
    m.textContent = text; m.classList.toggle('bad', !!bad); m.hidden = !text;
  }

  function isVisible(p, a) {
    var box = { xmin: a.xmin, xmax: a.xmax, ymin: a.ymin, ymax: a.ymax };
    if (p.kind === 'line') return !!M.clipLine(p.a, p.b, p.c, box);
    if (p.kind === 'points') return p.points.some(function (q) { return q.x >= a.xmin && q.x <= a.xmax && q.y >= a.ymin && q.y <= a.ymax; });
    return M.sampleCurve(p, box, 200).some(function (run) { return run.some(function (q) { return q[1] >= a.ymin && q[1] <= a.ymax; }); });
  }

  function addItem() {
    var inp = $('gInput'), raw = inp.value.trim(), p;
    if (!raw) { addMsg('Type something to graph first, like y = 2x + 3 or (3, 5).', true); return; }
    try { p = M.parseGraphInput(raw); } catch (e) {
      addMsg((e.friendly ? e.message : 'I couldn\'t read that.') + ' Examples: y = 2x + 3,  x = -2,  3x - y = -6,  (3, 5)', true);
      return;
    }
    if (G.ws.items.length >= 12) { addMsg('That\'s a lot! Take something off the list first (12 at most).', true); return; }
    var item = { input: raw, label: $('gLabel').value.trim().slice(0, 40), color: M.nextColor(G.ws.items) };
    G.ws.items.push(item);
    inp.value = ''; $('gLabel').value = '';
    var notes = [];
    if (p.note) notes.push('I graphed it with ' + p.note + '.');
    if (!isVisible(p, G.axes)) notes.push('It\'s outside this graph window, so change the axes to see it.');
    addMsg(notes.length ? 'Added! ' + notes.join(' ') : '', false);
    saveWs(); renderList(); drawScreen();
  }

  function renderList() {
    var ul = $('gList');
    ul.innerHTML = '';
    if (!G.ws.items.length) {
      ul.appendChild(el('li', { class: 'empty', text: 'Nothing on the graph yet. Try y = 2x + 3 or (3, 5).' }));
      return;
    }
    withParsed(G.ws.items).forEach(function (it, i) {
      var kind = it.p ? (it.p.kind === 'points' ? (it.p.points.length === 1 ? 'point' : it.p.points.length + ' points') : it.p.kind === 'curve' ? 'curve' : 'line') : 'can\'t read this one';
      ul.appendChild(el('li', null, [
        el('span', { class: 'swatch', style: 'background:' + it.color }),
        el('div', { class: 'txt' }, [el('b', { text: itemName(it) }), el('small', { text: (it.label ? it.label + ' · ' : '') + kind + ' · ' + M.colorName(it.color) })]),
        el('button', { type: 'button', class: 'rm', 'aria-label': 'Remove ' + itemName(it), text: '✕', onclick: function () {
          G.ws.items.splice(i, 1); saveWs(); renderList(); drawScreen();
        } })
      ]));
    });
  }

  function drawScreen() {
    if (!gReady || currentTool !== 'graph' || toolEl.hidden || !G.ws) return;
    var c = $('gCanvas'), wrap = $('gWrap');
    var cssW = Math.max(220, Math.floor(wrap.clientWidth - 4));
    var cssH = Math.round(Math.min(cssW * (window.innerWidth >= 760 ? 0.9 : 1), Math.max(240, window.innerHeight * 0.6)));
    var dpr = Math.min(3, window.devicePixelRatio || 1);
    c.style.height = cssH + 'px';
    c.width = Math.round(cssW * dpr); c.height = Math.round(cssH * dpr);
    var ctx = c.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    var fs = cssW < 400 ? 12 : 14;
    G.view = drawGraph(ctx, cssW, cssH, G.axes, withParsed(G.ws.items), { font: fs, lineW: 3, dot: 6 });
    var coord = $('gCoord');
    if (G.tap && G.tap.x >= G.axes.xmin && G.tap.x <= G.axes.xmax && G.tap.y >= G.axes.ymin && G.tap.y <= G.axes.ymax) {
      var X = G.view.sx(G.tap.x), Y = G.view.sy(G.tap.y);
      ctx.strokeStyle = '#1d2433'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(X, Y, 9, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(X - 14, Y); ctx.lineTo(X - 5, Y); ctx.moveTo(X + 5, Y); ctx.lineTo(X + 14, Y);
      ctx.moveTo(X, Y - 14); ctx.lineTo(X, Y - 5); ctx.moveTo(X, Y + 5); ctx.lineTo(X, Y + 14); ctx.stroke();
      coord.textContent = '📍 (' + uni(M.formatNumber(G.tap.x)) + ', ' + uni(M.formatNumber(G.tap.y)) + ')';
      coord.hidden = false;
    } else coord.hidden = true;
  }

  function onCanvasTap(e) {
    var v = G.view;
    if (!v) return;
    var r = $('gCanvas').getBoundingClientRect(), X = e.clientX - r.left, Y = e.clientY - r.top, a = G.axes;
    if (X < v.left - 2 || X > v.left + v.pw + 2 || Y < v.top - 2 || Y > v.top + v.ph + 2) { G.tap = null; drawScreen(); return; }
    var x = a.xmin + (X - v.left) / v.pw * (a.xmax - a.xmin), y = a.ymax - (Y - v.top) / v.ph * (a.ymax - a.ymin);
    var gx = Math.round(x / a.xstep) * a.xstep, gy = Math.round(y / a.ystep) * a.ystep;
    var rx = Math.min(12, 0.3 * v.pw * a.xstep / (a.xmax - a.xmin)), ry = Math.min(12, 0.3 * v.ph * a.ystep / (a.ymax - a.ymin));
    if (Math.abs(v.sx(gx) - X) <= rx && Math.abs(v.sy(gy) - Y) <= ry) { x = gx; y = gy; }   // snap to a grid corner
    else {
      var dx = Math.max(0, Math.min(4, Math.floor(-Math.log((a.xmax - a.xmin) / v.pw) / Math.LN10)));
      var dy = Math.max(0, Math.min(4, Math.floor(-Math.log((a.ymax - a.ymin) / v.ph) / Math.LN10)));
      x = Math.round(x * Math.pow(10, dx)) / Math.pow(10, dx); y = Math.round(y * Math.pow(10, dy)) / Math.pow(10, dy);
    }
    G.tap = { x: Math.max(a.xmin, Math.min(a.xmax, x)), y: Math.max(a.ymin, Math.min(a.ymax, y)) };
    drawScreen();
  }

  function useGraph() {
    if (!G.part) return;
    if (!G.axesOk) { addMsg('Fix the axes first (see the red message).', true); return; }
    if (!G.ws.items.length) { addMsg('Add at least one line or point first, then press the green button.', true); return; }
    var pid = G.part.id;
    if (!graphs[pid] && pictureCount() >= MAX_PICTURES) { closeTool(); tooManyPictures(); return; }
    graphs[pid] = {
      axes: { xmin: G.axes.xmin, xmax: G.axes.xmax, xstep: G.axes.xstep, ymin: G.axes.ymin, ymax: G.axes.ymax, ystep: G.axes.ystep },
      items: G.ws.items.map(function (it) { return { input: it.input, label: it.label || '', color: it.color }; }),
      savedAt: new Date().toISOString()
    };
    saveDraftSafe();
    if (paperRefresh[pid]) paperRefresh[pid]();
    closeTool();
    var att = $('graph-att-' + pid);
    if (att) { att.scrollIntoView({ block: 'center' }); flashEl(att.querySelector('img') || att); }
  }

  /* ------------------------------ calculator ------------------------------ */
  var C = { expr: '', done: false, ans: '', frac: null, error: '' };
  var calcBuilt = false;
  var CALC_KEYS = [
    ['C', 'clear', 'fn', 'Clear'], ['⌫', 'back', 'fn', 'Backspace'], ['(', '(', ''], [')', ')', ''], ['÷', '÷', 'op', 'Divide'],
    ['x²', '²', '', 'Squared'], ['√', '√(', '', 'Square root'], ['^', '^', '', 'Power'], ['π', 'π', '', 'Pi'], ['×', '×', 'op', 'Times'],
    ['7', '7', 'd'], ['8', '8', 'd'], ['9', '9', 'd'], ['±', 'neg', '', 'Change sign'], ['−', '−', 'op', 'Minus'],
    ['4', '4', 'd'], ['5', '5', 'd'], ['6', '6', 'd'], ['a/b', '/', 'small', 'Fraction bar'], ['+', '+', 'op', 'Plus'],
    ['1', '1', 'd'], ['2', '2', 'd'], ['3', '3', 'd'], ['.', '.', 'd', 'Decimal point'], ['=', 'eq', 'eq', 'Equals'],
    ['0', '0', 'd wide'], ['Ans', 'ans', 'small wide', 'Last answer']
  ];
  var calcBtns = {};

  function buildCalc() {
    if (calcBuilt) return;
    calcBuilt = true;
    CALC_KEYS.forEach(function (k) {
      var b = el('button', { type: 'button', class: k[2], text: k[0], 'aria-label': k[3] || k[0] });
      b.addEventListener('click', function () { calcPress(k[1]); });
      calcBtns[k[1]] = b;
      $('cKeys').appendChild(b);
    });
    $('cCopy').addEventListener('click', function () { var t = calcOutput(); if (t) copyText(t, $('cCopy'), '📋 Copy'); });
    $('cInsert').addEventListener('click', function () {
      var t = calcOutput();
      if (t && !insertIntoAnswer(t)) renderCalc();
    });
  }
  function ansForExpr() {
    if (!C.ans) return '';
    var a = uni(C.ans);
    return C.ans.charAt(0) === '-' ? '(' + a + ')' : a;
  }
  function calcPress(k) {
    C.error = '';
    if (k === 'clear') { C.expr = ''; C.done = false; }
    else if (k === 'back') { if (C.done) C.done = false; else C.expr = C.expr.slice(0, -1); }
    else if (k === 'eq') {
      if (!C.expr) return renderCalc();
      var open = (C.expr.match(/\(/g) || []).length - (C.expr.match(/\)/g) || []).length;
      try {
        var r = M.calc(C.expr);
        for (var i = 0; i < open; i++) C.expr += ')';
        C.ans = r.text; C.frac = r.fraction; C.done = true;
      } catch (e) { C.error = e.friendly ? e.message : 'Hmm, check that again.'; C.done = false; }
    } else if (k === 'neg') {
      if (C.done) { C.expr = C.ans.charAt(0) === '-' ? C.ans.slice(1) : '\u2212' + C.ans; C.expr = uni(C.expr); C.done = false; }
      else {
        var m = /(\d+\.?\d*|\.\d+|π)$/.exec(C.expr);
        if (!m) C.expr += '\u2212';
        else {
          var before = C.expr.slice(0, m.index), num = m[0];
          if (/\(\u2212$/.test(before)) C.expr = before.slice(0, -2) + num;
          else if (/(^|[×÷\/^(])\u2212$/.test(before)) C.expr = before.slice(0, -1) + num;
          else if (before === '' || /[×÷\/^(]$/.test(before)) C.expr = before + '\u2212' + num;
          else C.expr = before + '(\u2212' + num;
        }
      }
    } else {
      var s = k === 'ans' ? ansForExpr() : k;
      if (!s) return renderCalc();
      if (C.done) { C.expr = /^[+\u2212×÷\/^²]/.test(s) ? ansForExpr() : ''; C.done = false; }
      if (C.expr.length < 150) C.expr += s;
    }
    renderCalc();
  }
  function calcPreview() {
    if (!C.expr || C.done) return null;
    try { return M.calc(C.expr); } catch (e) { return null; }
  }
  /** What Copy / Put-in-my-answer use: the answer after "=", or the live preview. Plain "-" minus. */
  function calcOutput() {
    if (C.done) return C.ans;
    var p = calcPreview();
    return p ? p.text : '';
  }
  function renderCalc() {
    var res = $('cRes'), pv = calcPreview();
    $('cExpr').textContent = C.expr ? C.expr + (C.done ? ' =' : '') : '';
    res.className = 'cres';
    if (C.error) { res.textContent = '⚠️ ' + C.error; res.classList.add('err'); }
    else if (C.done) res.textContent = uni(C.ans);
    else if (pv && /[^\d.]/.test(C.expr)) { res.textContent = '= ' + uni(pv.text); res.classList.add('preview'); }
    else res.textContent = C.expr ? '' : '0';
    var frac = C.done ? C.frac : (pv && !C.error ? pv.fraction : null);
    $('cFrac').textContent = frac ? '= ' + uni(frac) + ' as a fraction' : '';
    var out = calcOutput(), target = lastField && document.body.contains(lastField) ? fieldInfo[lastField.id.slice(2)] : '';
    $('cCopy').disabled = !out;
    $('cInsert').disabled = !out || !target;
    $('cHint').textContent = target ? 'Put in my answer → ' + target
      : 'Tip: tap an answer box first, then open the calculator, and "Put in my answer" will type the result there for you.';
  }

  document.addEventListener('keydown', function (e) {
    if (toolEl.hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closeTool(); return; }
    if (currentTool !== 'calc' || e.ctrlKey || e.metaKey || e.altKey) return;
    var a = document.activeElement;
    if (a && (a.tagName === 'TEXTAREA' || (a.tagName === 'INPUT' && a.type === 'text'))) return;
    var map = { '+': '+', '-': '\u2212', '*': '×', 'x': '×', 'X': '×', '/': '/', '÷': '÷', '^': '^', '(': '(', ')': ')', '.': '.', ',': '.',
      'p': 'π', 'P': 'π', 'r': '√(', 's': '√(', '²': '²', 'Enter': 'eq', '=': 'eq', 'Backspace': 'back', 'Delete': 'clear', 'c': 'clear', 'C': 'clear' };
    var k = /^[0-9]$/.test(e.key) ? e.key : map[e.key];
    if (!k) return;
    e.preventDefault();
    calcPress(k);
    var b = calcBtns[k === '/' ? '/' : k];
    if (b) { b.classList.add('hit'); setTimeout(function () { b.classList.remove('hit'); }, 120); }
  });

  document.getElementById('submitBtn').addEventListener('click', trySubmit);
  document.getElementById('overlay').addEventListener('click', function (e) { if (e.target.id === 'overlay') closeModal(); });
  render();
  // Handy for local tests only (dev/browser-test.js); harmless on the live page.
  window.__rio = { buildSubmission: buildSubmission, openGraph: openGraph, view: function () { return G.view; } };
};
</script>
<script>
/* Loader: reads ?date=YYYY-MM-DD (no date = today in Tokyo, or the newest test before it), fetches the
   questions-only test from Apps Script without cookies, then starts the page. */
(function () {
  'use strict';
  var app = document.getElementById('app');
  function tokyoToday() {
    try {
      return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Tokyo', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
    } catch (e) { return new Date(Date.now() + 9 * 3600000).toISOString().slice(0, 10); }
  }
  var requested = '';
  try { requested = (new URLSearchParams(location.search).get('date') || '').trim(); } catch (e) {}
  var baseUrl = location.origin + location.pathname;
  function node(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
  function showLoading() {
    app.innerHTML = '';
    var box = node('div', 'loading'); box.appendChild(node('div', 'spin')); box.appendChild(node('div', '', 'Loading your math practice…'));
    app.appendChild(box);
  }
  function showError(msg) {
    app.innerHTML = '';
    var h = node('header', 'top'); h.appendChild(node('h1', '', 'Math practice')); app.appendChild(h);
    var c = node('div', 'card error');
    c.appendChild(node('p', '', '😕 ' + msg));
    c.appendChild(node('p', 'muted', 'Check the internet connection and try again.'));
    var b = node('button', 'btn', 'Try again'); b.type = 'button'; b.addEventListener('click', load);
    var a = node('div', 'actions'); a.style.margin = '6px 0 14px'; a.appendChild(b); c.appendChild(a);
    app.appendChild(c);
  }
  function load() {
    showLoading();
    var url = RIO_API_URL + '?format=json' + (requested ? '&date=' + encodeURIComponent(requested) : '');
    rioFetchJSON(url, { method: 'GET' }, 45000).then(function (res) {
      if (!res || (!res.test && !res.error)) throw new Error('The math server sent something unexpected.');
      DATA = {
        test: res.test || null,
        error: res.error || null,
        requested: requested,
        today: res.today || tokyoToday(),
        recent: Array.isArray(res.recent) ? res.recent : [],
        baseUrl: baseUrl
      };
      document.title = DATA.test ? ('Math practice ' + DATA.test.date) : 'Math practice';
      app.innerHTML = '';
      window.__rioStart();
    }).catch(function (e) { showError(String(e && e.message || e)); });
  }
  load();
})();
</script>
